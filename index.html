<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CritCare Bedside — Suite de Cuidados Críticos</title>
  <meta name="description" content="Suite integral de cálculo para cuidados críticos: hemodinamia, ventilación mecánica, balances hídricos, electrolitos y ultrasonido.">
  <meta name="theme-color" content="#06101e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06101e; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { height: 4px; width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(60,140,170,0.3); border-radius: 2px; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
const { useState, useRef } = React;

/* ═══════════ STYLES ═══════════ */
const S={
  sec:{background:"rgba(10,24,42,0.6)",borderRadius:14,border:"1px solid rgba(60,140,170,0.08)",padding:"16px 14px",marginBottom:12},
  secT:{fontSize:13,fontWeight:700,color:"#b8dce8",marginBottom:10,display:"flex",alignItems:"center",gap:8},
  label:{fontSize:10.5,fontWeight:600,color:"#6a9aaa",marginBottom:3,display:"block",textTransform:"uppercase",letterSpacing:"0.04em"},
  inp:{width:"100%",padding:"10px 12px",borderRadius:8,border:"1px solid rgba(60,140,170,0.15)",background:"rgba(6,16,30,0.8)",color:"#c0e0ec",fontSize:14,fontFamily:"'JetBrains Mono',monospace",fontWeight:500,outline:"none",boxSizing:"border-box"},
  btn:{width:"100%",padding:"13px",borderRadius:9,border:"none",fontSize:13.5,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans'"},
  note:{padding:"8px 10px",borderRadius:8,background:"rgba(59,130,246,0.06)",border:"1px solid rgba(59,130,246,0.12)",marginBottom:10},
};

/* ═══════════ INPUT COMPONENTS ═══════════ */
function NI({label,unit,value,onChange,placeholder,style:st}){return(<div style={{flex:"1 1 48%",minWidth:110,marginBottom:8,...st}}><label style={S.label}>{label} {unit&&<span style={{color:"#4a6a7a",textTransform:"none"}}>({unit})</span>}</label><input type="number" inputMode="decimal" step="any" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={S.inp}/></div>);}
function OS({label,value,onChange,options}){return(<div style={{marginBottom:8}}><label style={S.label}>{label}</label><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{options.map(o=>{const s=value===o.v;return(<button key={o.v} onClick={()=>onChange(o.v)} style={{padding:"7px 10px",borderRadius:7,border:s?"1px solid rgba(22,78,99,0.6)":"1px solid rgba(60,140,170,0.1)",background:s?"rgba(22,78,99,0.3)":"rgba(15,30,50,0.35)",color:s?"#a0d8ec":"#6a8a9a",fontSize:11,fontWeight:s?600:400,cursor:"pointer",fontFamily:"'DM Sans'"}}>{s?"✓ ":""}{o.l}</button>);})}</div></div>);}
function DD({label,value,onChange,options,style:st}){return(<div style={{flex:"1 1 100%",marginBottom:8,...st}}><label style={S.label}>{label}</label><select value={value} onChange={e=>onChange(e.target.value)} style={{...S.inp,appearance:"auto",cursor:"pointer"}}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>);}
function CB({label,checked,onChange}){return(<button onClick={()=>onChange(!checked)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"9px 11px",borderRadius:8,border:checked?"1px solid rgba(22,78,99,0.6)":"1px solid rgba(60,140,170,0.1)",background:checked?"rgba(22,78,99,0.25)":"rgba(15,30,50,0.35)",color:checked?"#a0d8ec":"#7a9aaa",fontSize:11.5,fontWeight:checked?600:400,cursor:"pointer",fontFamily:"'DM Sans'",marginBottom:5,textAlign:"left"}}><span style={{fontSize:13}}>{checked?"☑":"☐"}</span>{label}</button>);}

/* ═══════════ RESULT RENDERERS ═══════════ */
const ML=({t,c,b})=>t.split("\n").map((l,i)=><p key={i} style={{fontSize:11.5,color:c||"#b0ccd8",margin:i?"2px 0 0":"0",lineHeight:1.5,fontWeight:b?700:400,paddingLeft:l.trim().startsWith("•")||l.trim().startsWith("→")?8:0}}>{l}</p>);

function Results({res,rRef}){
  if(!res)return null;
  return(<div ref={rRef} style={{marginTop:16}}>
    {res.alerts.map((a,i)=><div key={i} style={{...S.sec,background:a.lv==="critical"?"rgba(239,68,68,0.08)":"rgba(245,158,11,0.06)",borderLeft:`3px solid ${a.lv==="critical"?"#ef4444":"#f59e0b"}`}}><p style={{fontSize:12.5,color:a.lv==="critical"?"#f88":"#e8c060",margin:0,lineHeight:1.5,fontWeight:600}}>{a.lv==="critical"?"🚨":"⚠️"} {a.t}</p></div>)}
    {res.calc.length>0&&<div style={S.sec}><div style={S.secT}><span>🔢</span> Valores calculados</div>{res.calc.map((c,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<res.calc.length-1?"1px solid rgba(60,140,170,0.06)":"none"}}><div style={{flex:1,paddingRight:8}}><div style={{fontSize:11.5,color:"#a0c4d0",fontWeight:600}}>{c.l}</div><div style={{fontSize:9,color:"#506878",fontFamily:"'JetBrains Mono',monospace"}}>{c.f}</div></div><div style={{fontSize:15,fontWeight:700,color:c.c,fontFamily:"'JetBrains Mono',monospace",textAlign:"right",whiteSpace:"nowrap"}}>{c.v}</div></div>)}</div>}
    {res.interp.length>0&&<div style={S.sec}><div style={S.secT}><span>📊</span> Interpretación</div>{res.interp.map((ip,i)=><div key={i} style={{padding:"8px 10px",borderRadius:8,background:"rgba(0,10,20,0.3)",marginBottom:6,borderLeft:`2px solid ${ip.c}`}}><ML t={ip.t} b={ip.bold}/></div>)}</div>}
    {res.act.length>0&&<div style={S.sec}><div style={S.secT}><span>⚕️</span> Recomendaciones</div>{res.act.map((a,i)=><div key={i} style={{marginBottom:10,paddingLeft:4}}><ML t={a}/></div>)}</div>}
    {res.refs.length>0&&<div style={S.sec}><div style={S.secT}><span>📚</span> Referencias</div>{res.refs.map((r,i)=><p key={i} style={{fontSize:9,color:"#5a7a88",margin:"0 0 4px",fontFamily:"'JetBrains Mono',monospace"}}>[{i+1}] {r}</p>)}</div>}
    <div style={{...S.sec,background:"rgba(200,160,40,0.04)"}}><p style={{fontSize:10,color:"#a09050",margin:0,lineHeight:1.5}}>⚠ Herramienta educativa de apoyo. No sustituye juicio clínico. Individualizar según contexto.</p></div>
  </div>);
}

/* ═══════════ SVG WAVEFORMS ═══════════ */
function WF({type,width:w=340,height:h=130}){const mid=h*.65;const C={normal:"#22c55e",respiratory_variation:"#3b82f6",dampened:"#f59e0b",vasodilation:"#ef4444",alternans:"#a855f7",paradoxus:"#ec4899",irregular:"#f97316",flat:"#6b7280"};const c=C[type]||"#4a9bb5";let ann=[],p="";const nb=(x0,a)=>`L${x0+4},${mid} L${x0+8},${mid-a*.95} L${x0+12},${mid-a} L${x0+16},${mid-a*.55} L${x0+20},${mid-a*.62} L${x0+24},${mid-a*.5} L${x0+38},${mid-a*.12} L${x0+55},${mid}`;
switch(type){
case"normal":p=`M0,${mid} ${nb(10,65)} ${nb(75,65)} ${nb(140,65)} ${nb(205,65)} L${w},${mid}`;ann=[{x:80,y:mid-72,t:"Pico sistólico"},{x:96,y:mid-36,t:"Muesca dicrótica"},{x:175,y:mid+18,t:"Desc. diastólico"}];break;
case"respiratory_variation":{const aa=[30,38,50,62,70,65,52,38,28,35,48];p=`M0,${mid}`;aa.forEach((a,i)=>{const x=8+i*28;p+=` L${x+3},${mid} L${x+6},${mid-a} L${x+10},${mid-a*.5} L${x+12},${mid-a*.56} L${x+18},${mid-a*.1} L${x+25},${mid}`;});p+=` L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"Variación >13% = respondedor",a:"middle"}];break;}
case"dampened":{const db=(x0,a)=>`L${x0+8},${mid} Q${x0+18},${mid-a*1.1} ${x0+25},${mid-a} Q${x0+42},${mid-a*.5} ${x0+60},${mid}`;p=`M0,${mid} ${db(5,25)} ${db(70,23)} ${db(135,22)} ${db(200,24)} L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"Bajo GC / vasoconstricción",a:"middle"}];break;}
case"vasodilation":{const vb=(x0,a)=>`L${x0+4},${mid} L${x0+9},${mid-a} L${x0+14},${mid-a*.35} L${x0+17},${mid-a*.15} L${x0+19},${mid-a*.42} L${x0+36},${mid-a*.08} L${x0+52},${mid+2}`;p=`M0,${mid} ${vb(10,85)} ${vb(72,85)} ${vb(134,85)} ${vb(196,83)} L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"RVS bajas",a:"middle"}];break;}
case"alternans":{p=`M0,${mid}`;[65,30,65,30,65,30,65,30].forEach((a,i)=>{const x=5+i*34;p+=`L${x+4},${mid} L${x+8},${mid-a} L${x+12},${mid-a*.5} L${x+20},${mid-a*.12} L${x+30},${mid}`;});p+=` L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"Alternancia → disfunción VI",a:"middle"}];break;}
case"paradoxus":{p=`M0,${mid}`;let xP=5;[60,65,62,58].forEach(a=>{p+=` L${xP+4},${mid} L${xP+8},${mid-a} L${xP+14},${mid-a*.55} L${xP+20},${mid-a*.1} L${xP+28},${mid}`;xP+=32;});[25,20,18,22].forEach(a=>{p+=` L${xP+4},${mid} L${xP+8},${mid-a} L${xP+12},${mid-a*.4} L${xP+18},${mid-a*.05} L${xP+24},${mid}`;xP+=28;});p+=` L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"Caída inspiratoria >10mmHg",a:"middle"}];break;}
case"irregular":{const bb=[{d:30,a:55},{d:22,a:40},{d:38,a:62},{d:18,a:28},{d:28,a:50},{d:42,a:58},{d:20,a:32}];p=`M0,${mid}`;let xI=5;bb.forEach(b=>{p+=` L${xI+3},${mid} L${xI+6},${mid-b.a} L${xI+10},${mid-b.a*.45} L${xI+b.d*.6},${mid-b.a*.08} L${xI+b.d},${mid}`;xI+=b.d;});p+=` L${w},${mid}`;ann=[{x:w/2,y:mid+22,t:"Arritmia — PPV/SVV no válidos",a:"middle"}];break;}
case"flat":{p=`M0,${mid}`;for(let x=0;x<w;x+=2)p+=` L${x},${mid+(Math.sin(x*.8)+Math.sin(x*1.3))*1.5}`;ann=[{x:w/2,y:mid-20,t:"Sin pulsatilidad",a:"middle"},{x:w/2,y:mid+24,t:"Sensor → Pulso → ¿Código azul?",a:"middle"}];break;}}
return(<div style={{background:"rgba(0,8,16,0.7)",borderRadius:10,padding:"8px 4px 4px",border:`1px solid ${c}22`}}><svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{display:"block"}}><line x1={0} y1={mid} x2={w} y2={mid} stroke="rgba(60,140,170,0.12)" strokeWidth={0.5} strokeDasharray="4,4"/><path d={p} fill="none" stroke={c} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/><path d={p} fill="none" stroke={c} strokeWidth={5} strokeLinecap="round" strokeLinejoin="round" opacity={0.12}/>{ann.map((a,i)=><text key={i} x={a.x} y={a.y} textAnchor={a.a||"start"} fill="rgba(160,200,215,0.6)" fontSize={8.5} fontFamily="DM Sans" fontWeight={500}>{a.t}</text>)}</svg></div>);}

/* ═══════════ CONSTANTS ═══════════ */
const ALTS=[{v:"760",l:"Nivel del mar — 760 mmHg"},{v:"757",l:"Veracruz/Ensenada (24m) — 757"},{v:"752",l:"Cd. Mante (90m) — 752"},{v:"715",l:"Monterrey (522m) — 715"},{v:"693",l:"Tijuana (778m) — 693"},{v:"681",l:"Córdoba (927m) — 681"},{v:"666",l:"Nogales/Cd. Juárez (1120m) — 666"},{v:"665",l:"Torreón (1131m) — 665"},{v:"656",l:"Chilpancingo/Orizaba (1250m) — 656"},{v:"642",l:"Chihuahua (1435m) — 642"},{v:"635",l:"Cuernavaca (1528m) — 635"},{v:"633",l:"Guadalajara (1547m) — 633"},{v:"624",l:"Tehuacán (1676m) — 624"},{v:"619",l:"Celaya (1750m) — 619"},{v:"615",l:"León (1804m) — 615"},{v:"614",l:"Querétaro (1816m) — 614"},{v:"610",l:"Aguascalientes/SLP (1867m) — 610"},{v:"609",l:"Durango (1886m) — 609"},{v:"607",l:"Morelia (1914m) — 607"},{v:"597",l:"Guanajuato (2050m) — 597"},{v:"593",l:"San Cristóbal (2100m) — 593"},{v:"590",l:"Puebla (2144m) — 590"},{v:"584",l:"CDMX/Tlaxcala (2238m) — 584"},{v:"573",l:"Pachuca (2399m) — 573"},{v:"572",l:"Zacatecas (2410m) — 572"},{v:"556",l:"Toluca (2651m) — 556"},{v:"534",l:"La Marquesa (3000m) — 534"},{v:"560",l:"Bogotá (2640m) — 560"},{v:"490",l:"La Paz, Bolivia (3640m) — 490"},{v:"custom",l:"Otra (personalizar)"}];
const SHOCK_OPTS=[{v:"none",l:"Sin choque"},{v:"distributive",l:"Distributivo (séptico/anafiláctico)"},{v:"cardiogenic",l:"Cardiogénico"},{v:"hypovolemic",l:"Hipovolémico/hemorrágico"},{v:"obstructive",l:"Obstructivo"},{v:"mixed_dist_card",l:"Mixto: distributivo+cardiogénico"},{v:"mixed_card_obst",l:"Mixto: cardiogénico+obstructivo"},{v:"mixed_dist_hypo",l:"Mixto: distributivo+hipovolémico"},{v:"mixed_triple",l:"Triple: dist+card+hipovolémico"}];

const ATLAS={
  normal:{p:"Onda Normal",e:"✅",c:"#22c55e",h:{est:"Estable",vol:"Adecuada",tone:"RVS normales",card:"GC conservado",perf:"Preservada"},a:["Monitorización estándar"],r:["Shelley KH. Anesth Analg. 2007;105(6S):S31."]},
  respiratory_variation:{p:"Variación Respiratoria",e:"〰️",c:"#3b82f6",h:{est:"Precarga-dependiente",vol:"Hipovolemia relativa/absoluta",tone:"Variable",card:"Llenado insuficiente",perf:"Potencialmente comprometida"},a:["Validar: VM controlada, Vt≥8, sin arritmias","PLR: ↑GC≥10% = respondedor","Cristaloide 250-500mL"],r:["Cannesson M. Br J Anaesth. 2008;101(2):200."]},
  dampened:{p:"Onda Amortiguada",e:"▽",c:"#f59e0b",h:{est:"Bajo GC / vasoconstricción",vol:"Evaluación multimodal",tone:"RVS elevadas",card:"Disfunción sistólica probable",perf:"Severamente comprometida"},a:["Verificar sensor","NE 1ª línea","Dobutamina si bajo GC"],r:["Cecconi M. ICM. 2014;40:1795."]},
  vasodilation:{p:"Vasodilatación",e:"△",c:"#ef4444",h:{est:"Vasodilatado hiperdinámico",vol:"Hipovolemia relativa",tone:"RVS bajas",card:"Alto GC, baja RVS",perf:"Compromiso microcirculatorio"},a:["NE 1ª línea","Cristaloides ≥30mL/kg","Hour-1 Bundle si sepsis"],r:["SSC 2026."]},
  alternans:{p:"Pulsus Alternans",e:"⇅",c:"#a855f7",h:{est:"Disfunción VI severa",vol:"No evaluable",tone:"Activación neurohumoral",card:"Alternancia contractilidad",perf:"Comprometida"},a:["Cardiología URGENTE","Inotrópicos si refractario"],r:["Heidenreich PA. Circulation. 2022;145:e895."]},
  paradoxus:{p:"Pulsus Paradoxus",e:"↕️",c:"#ec4899",h:{est:"Interdep. cardiopulmonar",vol:"Variable",tone:"Preservado/elevado",card:"Restricción diastólica",perf:"Comprometida en inspiración"},a:["Eco INMEDIATA","Tamponamiento → pericardiocentesis"],r:["Adler Y. Eur Heart J. 2015;36:2921."]},
  irregular:{p:"Onda Irregular",e:"⚡",c:"#f97316",h:{est:"Arritmia",vol:"PPV/SVV NO válidos",tone:"No evaluable",card:"Variable según arritmia",perf:"Depende de FC"},a:["ECG 12 derivaciones","NO usar índices dinámicos"],r:["Hindricks G. Eur Heart J. 2021;42:373."]},
  flat:{p:"Onda Plana",e:"—",c:"#6b7280",h:{est:"CRÍTICO: sin pulsatilidad",vol:"No evaluable",tone:"Colapso circulatorio",card:"Paro o GC críticamente bajo",perf:"Ausente"},a:["Verificar sensor","Sin pulso → RCP"],r:["Panchal AR. Circulation. 2020;142:S366."]}
};
const hLab={est:"Estado",vol:"Volemia",tone:"Tono vascular",card:"Función cardíaca",perf:"Perfusión"};

/* ═══════════ TAB 1: HEMODINAMIA ═══════════ */
function calcHemo(v){
  const R={calc:[],interp:[],act:[],alerts:[],refs:[]};const n=k=>{const x=parseFloat(v[k]);return isNaN(x)?null:x;};
  const sbp=n("sbp"),dbp=n("dbp"),hr=n("hr"),temp=n("temp"),crt=n("crt"),lactate=n("lactate"),age=n("age"),wt=n("weight");
  const isHTN=v.htn==="yes",isShock=v.shock!=="none";

  if(sbp!==null&&dbp!==null){
    const map=Math.round((sbp+2*dbp)/3),pp=sbp-dbp;
    R.calc.push({l:"PAM",v:`${map} mmHg`,f:"(PAS+2×PAD)/3",c:map<65?"#ef4444":map>100?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Presión de Pulso",v:`${pp} mmHg`,f:"PAS−PAD",c:pp>60?"#ef4444":pp<25?"#f59e0b":"#22c55e"});
    R.calc.push({l:"PP proporcional",v:`${(pp/sbp*100).toFixed(0)}%`,f:"(PP/PAS)×100",c:pp/sbp<0.25?"#ef4444":"#22c55e"});
    if(pp/sbp<0.25)R.interp.push({t:`PP proporcional <25%: sugiere índice cardíaco <2.2 L/min/m² (sensibilidad 91%, especificidad 83% en falla cardíaca avanzada)`,c:"#ef4444"});
    if(map<65){R.alerts.push({lv:"critical",t:`PAM ${map} mmHg — por debajo de meta de perfusión`});
      R.act.push(`HIPOTENSIÓN (PAM ${map}):\n• Norepinefrina 1ª línea (SSC 2026, recomendación fuerte)\n• 2ª línea: vasopresina hasta 0.04 U/min\n• 3ª línea: epinefrina\n• Con disfunción cardíaca: NE si taquicardia, EPI si bradicardia (SSC 2026 #58)\n• EN CONTRA: terlipresina, betabloqueadores IV, levosimendán`);
      if(isHTN)R.act.push(`HTA CRÓNICA: considerar meta PAM 80-85 mmHg\n• SEPSISPAM (Asfar, NEJM 2014): meta alta ↓LRA y ↓necesidad de TRR en hipertensos crónicos\n• Titular NE gradualmente y reevaluar perfusión (CRT, lactato, diuresis)`);
      if(age!==null&&age>=65&&!isHTN)R.interp.push({t:`Paciente ≥65 años: SSC 2026 sugiere meta PAM 60-65 mmHg (condicional, baja certeza)`,c:"#f59e0b"});}
    if(pp>60)R.interp.push({t:`PP amplia (${pp}): vasodilatación, insuficiencia aórtica, estado hiperdinámico, rigidez aórtica. Fenotipo ANDROMEDA: PP≥40 = volumen sistólico adecuado → evaluar tono vascular (PAD)`,c:"#ef4444"});
    if(pp<25)R.interp.push({t:`PP estrecha (${pp}): bajo volumen sistólico — hipovolemia, disfunción VI, tamponamiento, estenosis aórtica`,c:"#f59e0b"});
    if(dbp!==null&&dbp<50)R.interp.push({t:`PAD ${dbp} <50 mmHg: marcador de VASOPLEGIA (tono arterial reducido). En choque séptico predice necesidad de vasopresor. Fenotipo ANDROMEDA-SHOCK-2`,c:"#ef4444"});
  }
  if(hr!==null&&sbp!==null&&sbp>0){const si=(hr/sbp).toFixed(2);R.calc.push({l:"Índice de Choque",v:si,f:"FC/PAS (normal 0.5-0.7)",c:si>1?"#ef4444":si>.7?"#f59e0b":"#22c55e"});
    if(si>1)R.alerts.push({lv:"warning",t:`Índice de choque ${si} >1.0 — inestabilidad hemodinámica significativa`});
    if(age!==null){const asi=(hr/sbp*age).toFixed(0);R.calc.push({l:"Índice choque × edad",v:asi,f:"IC×Edad (>50 = alto riesgo)",c:asi>50?"#ef4444":"#22c55e"});}}
  if(hr!==null){if(hr>120)R.interp.push({t:`Taquicardia (${hr}): dolor, hipovolemia, fiebre, anemia, ansiedad, arritmia. SSC 2026 sugiere EN CONTRA de betabloqueadores IV en choque séptico`,c:"#f59e0b"});
    if(hr<50)R.interp.push({t:`Bradicardia (${hr}): fármacos, hipotiroidismo, bloqueo AV, hipotermia, hipertensión intracraneal (reflejo de Cushing)`,c:"#ef4444"});}
  if(temp!==null){if(temp<36)R.interp.push({t:`Hipotermia (${temp}°C): peor pronóstico en sepsis. La señal PPG puede artefactarse por vasoconstricción. Calentamiento activo`,c:"#f59e0b"});
    if(temp>38.3)R.interp.push({t:`Fiebre (${temp}°C): buscar foco infeccioso. Aumenta consumo de O2 10-13% por °C. SSC 2026: evidencia insuficiente para antipiréticos rutinarios`,c:"#f59e0b"});}

  // CRT — ANDROMEDA-SHOCK-2
  if(crt!==null){R.calc.push({l:"Llenado capilar (CRT)",v:`${crt} seg`,f:"Presión 10s en falange distal",c:crt>3?"#ef4444":"#22c55e"});
    if(crt>3){R.alerts.push({lv:"warning",t:`CRT ${crt}s prolongado — hipoperfusión periférica`});
      R.interp.push({t:`ANDROMEDA-SHOCK-2 (Hernández, JAMA 2025, n=1467, 86 UCI): reanimación personalizada guiada por CRT superó cuidado usual (win ratio 1.16, p=0.04). Beneficio: más días libres de soporte vital y menor TRR. Mortalidad 28d sin diferencia (26.5% vs 26.6%). Meta: CRT <3s, reevaluar cada hora × 6h`,c:"#ef4444"});
      const pp2=(sbp!==null&&dbp!==null)?sbp-dbp:null;
      if(pp2!==null&&pp2<40)R.act.push(`ANDROMEDA-SHOCK-2 → FENOTIPO HIPOVOLEMIA (PP ${pp2} <40 + CRT ${crt}s)\n\nTIER 1:\n• PASO 1: Evaluar fluid responsiveness — PLR con ΔGC, PPV >13%, SVV, oclusión tele-espiratoria, o mini-fluid challenge\n• PASO 2: Si FR POSITIVA → bolo 500 mL cristaloide o albúmina 5% en 30 min\n• PASO 3: Máximo 2 bolos (1000 mL total)\n• PASO 4: Reevaluar CRT tras cada bolo\n• PASO 5: Si FR NEGATIVA o CRT persiste → pasar a TIER 2\n\n⚠ LÍMITES DE SEGURIDAD: ↑PVC >5 mmHg, ↑FiO2 ≥3 puntos, ↑PEEP ≥5, nuevos estertores o líneas B`);
      else if(pp2!==null&&pp2>=40&&dbp!==null&&dbp<50)R.act.push(`ANDROMEDA-SHOCK-2 → FENOTIPO VASOPLEGIA (PP ${pp2} ≥40 + PAD ${dbp} <50 + CRT ${crt}s)\n\nTIER 1:\n• PASO 1: Titular NE en incrementos de 0.1 μg/kg/min cada 10-15 min\n• PASO 2: META → PAD ≥50 mmHg\n• PASO 3: Si NE >0.3 μg/kg/min → agregar vasopresina hasta 0.04 U/min\n• PASO 4: Máximo NE recomendado 0.5 μg/kg/min (solo +25% adicional permitido)\n• PASO 5: Si CRT persiste >3s → TIER 2\n\n⚠ SUSPENDER ESCALAMIENTO SI: FC >130, arritmias nuevas, isquemia miocárdica`);
      else R.act.push(`ANDROMEDA-SHOCK-2 → CRT ${crt}s prolongado\n• Evaluar fenotipo: medir PP y PAD\n• PP <40 → hipovolemia → evaluar FR\n• PP ≥40 + PAD <50 → vasoplegia → titular NE\n• PP ≥40 + PAD ≥50 → evaluar FR → si negativa, ecocardiografía`);
      R.act.push(`ANDROMEDA-SHOCK-2 → TIER 2 (si CRT persiste tras Tier 1)\n\n• PASO 1: Ecocardiografía de cabecera\n  → Disfunción VI: FAC <40% + VTI aórtico <14 cm → dobutamina 5 μg/kg/min × 1h (dosis fija, sin titulación)\n  → Falla VD: relación VD/VI >1 + PVC ≥8 → SUSPENDER fluidos, ↓PEEP <10 cmH₂O, Pplat <28\n• PASO 2: Si HTA crónica → prueba de PAM: titular NE a PAM 80-85 mmHg × 1 hora\n  → Si CRT normaliza: mantener meta alta\n  → Si no: regresar a dosis previa\n• PASO 3: Prueba de dobutamina si no se hizo antes\n• PASO 4: Si CRT persiste tras todo → considerar terapias de rescate individualizadas`);
      R.refs.push("Hernández G, et al. ANDROMEDA-SHOCK-2. JAMA. 2025;334(22):1988-1999.");}
    else R.interp.push({t:`CRT ${crt}s normal (<3s): perfusión periférica adecuada. Marcador de resolución de hipoperfusión en reanimación guiada por perfusión`,c:"#22c55e"});}

  if(lactate!==null){R.calc.push({l:"Lactato",v:`${lactate} mmol/L`,f:"Marcador de perfusión",c:lactate>=4?"#ef4444":lactate>=2?"#f59e0b":"#22c55e"});
    if(lactate>=4){R.alerts.push({lv:"critical",t:`Lactato ${lactate} mmol/L — hipoperfusión tisular significativa`});
      R.act.push(`LACTATO ≥4 mmol/L:\n• SSC 2026: usar lactato SERIADO para guiar reanimación\n• ⚠ "Sugerimos NO usar lactato elevado como indicación refleja de administrar fluidos"\n• Causas multifactoriales: hipoperfusión, disfunción mitocondrial, ↓aclaramiento hepático, catecolaminas (efecto β2)\n• Meta: aclaramiento ≥20% cada 2h (Jansen, AJRCCM 2010)\n• Combinar con CRT, moteado cutáneo, diuresis, ScvO2`);}
    else if(lactate>=2)R.interp.push({t:`Lactato ${lactate}: elevación moderada. Evaluar en contexto con CRT, moteado, diuresis. SSC 2026 enfatiza interpretación multifactorial`,c:"#f59e0b"});}

  // Shock type guidance
  if(isShock){const G={
    distributive:`CHOQUE DISTRIBUTIVO:\n• NE 1ª línea (SSC 2026, fuerte, alta certeza)\n• 2ª línea: vasopresina hasta 0.04 U/min (condicional)\n• 3ª línea: epinefrina\n• Hidrocortisona 200 mg/día si NE en dosis escalantes\n• Cristaloides ≥30 mL/kg en 3h (usar peso ajustado si IMC >30)\n• Post-bolo inicial: estrategia liberal O restrictiva según factores individuales (SSC 2026, nueva)\n• Remoción activa de fluidos tras fase aguda (SSC 2026, nueva)\n• Cristaloides balanceados > SSN (certeza moderada)`,
    cardiogenic:`CHOQUE CARDIOGÉNICO:\n• NE preferido sobre dopamina (De Backer, NEJM 2010 — ↓arritmias)\n• Dobutamina si bajo GC con RVS elevadas\n• EVITAR sobrecarga de volumen\n• Soporte mecánico temprano si refractario (BCIA, Impella, VA-ECMO)\n• Metas: PAM ≥65, IC >2.2 L/min/m², ScvO2 >65%, lactato descendente`,
    hypovolemic:`CHOQUE HIPOVOLÉMICO:\n• Control de la hemorragia (cirugía/angioembolización) es prioridad\n• Transfusión masiva 1:1:1 (PG:PFC:Plaquetas) si hemorragia activa\n• Ácido tranexámico <3h del trauma (CRASH-2)\n• Meta Hb 7-9 g/dL (estrategia restrictiva)\n• Cristaloides balanceados; evitar SSN en volumen alto`,
    obstructive:`CHOQUE OBSTRUCTIVO:\n• TRATAR LA CAUSA ES LA PRIORIDAD\n• TEP masiva → trombólisis sistémica o catéter-dirigida\n• Tamponamiento → pericardiocentesis urgente\n• Neumotórax a tensión → descompresión inmediata\n• Mantener precarga; EVITAR agentes que la reduzcan\n• En TEP: fluidos con precaución (empeoran dilatación VD)`,
    mixed_dist_card:`CHOQUE MIXTO: DISTRIBUTIVO + CARDIOGÉNICO (20-28% de choques en UCI)\n• NE como agente puente (vasopresor + inotrópico leve)\n• Si componente cardiogénico primario: dobutamina/inotrópicos primero\n• Si vasoplegia primaria: NE + vasopresina\n• Cardiomiopatía séptica afecta hasta 60% de pacientes sépticos\n• Ecocardiografía SERIADA para fenotipificación dinámica\n• Considerar catéter de arteria pulmonar si refractario`,
    mixed_card_obst:`CHOQUE MIXTO: CARDIOGÉNICO + OBSTRUCTIVO\n• RESOLVER EL COMPONENTE OBSTRUCTIVO PRIMERO (urgente)\n• Fluidos con extrema precaución (empeoran VD en TEP)\n• Tras resolver obstrucción, reevaluar función ventricular\n• Ejemplos: TEP + disfunción VI previa, tamponamiento post-IAM`,
    mixed_dist_hypo:`CHOQUE MIXTO: DISTRIBUTIVO + HIPOVOLÉMICO\n• RESTAURAR VOLUMEN PRIMERO\n• Luego vasopresores para vasodilatación persistente\n• Medidas dinámicas (PPV >13%, PLR ↑GC >10%) para guiar fluidos\n• Ejemplo: sepsis + hemorragia digestiva, sepsis + tercer espacio severo`,
    mixed_triple:`CHOQUE TRIPLE (distributivo + cardiogénico + hipovolémico)\n• Requiere monitoreo hemodinámico AVANZADO (PAC ideal)\n• Manejo SECUENCIAL del componente dominante\n• Reevaluación iterativa cada 1-2h\n• Ecocardiografía seriada obligatoria\n• Ejemplos: postquirúrgico cardíaco con vasoplejía + aturdimiento + sangrado`};
    if(G[v.shock]){R.interp.push({t:`Tipo de choque: ${SHOCK_OPTS.find(o=>o.v===v.shock)?.l}`,c:"#ef4444",bold:true});R.act.push(G[v.shock]);}
    R.refs.push("Prescott HC, et al. SSC 2026. Intensive Care Med/Crit Care Med. 2026.");}

  if(wt!==null&&sbp!==null&&dbp!==null){const map2=(sbp+2*dbp)/3;const cvp=n("cvp");
    if(cvp!==null){R.calc.push({l:"Presión de perfusión",v:`${Math.round(map2-cvp)} mmHg`,f:"PAM−PVC",c:map2-cvp<55?"#ef4444":"#22c55e"});
      if(map2-cvp<55)R.interp.push({t:`Presión de perfusión <55 mmHg: asociada a LRA. La PVC elevada compromete el flujo renal (congestión venosa) tanto como la PAM baja`,c:"#ef4444"});}}

  R.refs=[...new Set(R.refs)];return R;
}

/* ═══════════ TAB 2: VENTILACIÓN + GASOMETRÍA ═══════════ */
function calcVent(v){
  const R={calc:[],interp:[],act:[],alerts:[],refs:[]};const n=k=>{const x=parseFloat(v[k]);return isNaN(x)?null:x;};
  const mode=v.ventMode,ht=n("height"),sex=v.sex,isARDS=v.ards==="yes";
  const vt=n("vt"),rr=n("rr"),peep=n("peep"),pplat=n("pplat"),ppeak=n("ppeak"),pOP=n("pOverPeep"),iFlow=n("inspFlow"),ti=n("ti"),ie=v.ieRatio;
  const cpap=n("cpapLevel"),ipap=n("ipap"),epap=n("epap"),vtNIV=n("vtNIV");
  const ph=n("ph"),paco2=n("paco2"),hco3=n("hco3"),pao2=n("pao2"),fio2=n("fio2"),na=n("na"),cl=n("cl"),alb=n("alb"),be=n("be"),lactate=n("lactate");
  const pvco2=n("pvco2"),scvo2=n("scvo2"),pvo2=n("pvo2"),hb=n("hb"),sao2=n("sao2");
  const wtV=n("weight");
  const patm=v.altitude==="custom"?n("customPatm"):parseFloat(v.altitude)||760;

  // ═══ PBW ═══
  let pbw=null;
  if(ht!==null&&sex){pbw=sex==="m"?50+0.91*(ht-152.4):45.5+0.91*(ht-152.4);
    R.calc.push({l:"Peso predicho (PBW)",v:`${pbw.toFixed(1)} kg`,f:sex==="m"?"50+0.91×(Talla−152.4)":"45.5+0.91×(Talla−152.4)",c:"#22c55e"});
    const rng=isARDS?[4,6]:[6,8];
    R.calc.push({l:`Vt objetivo (${isARDS?"SDRA":"protector"})`,v:`${Math.round(pbw*rng[0])}-${Math.round(pbw*rng[1])} mL`,f:`${rng[0]}-${rng[1]} mL/kg PBW`,c:"#3b82f6"});}

  // ═══ INVASIVE VENTILATION ═══
  if(v.ventType==="invasive"){
    let effPplat=pplat,effDP=null,effVt=vt;
    if(mode==="pressure"&&pOP!==null&&peep!==null){effDP=pOP;if(effPplat===null)effPplat=peep+pOP;}
    else if(effPplat!==null&&peep!==null)effDP=effPplat-peep;

    if(effVt!==null&&pbw!==null){const vtkg=(effVt/pbw).toFixed(1);R.calc.push({l:"Vt / PBW",v:`${vtkg} mL/kg`,f:"Vt÷PBW",c:vtkg>(isARDS?6:8)?"#ef4444":"#22c55e"});
      if(vtkg>(isARDS?6:8))R.alerts.push({lv:"warning",t:`Vt ${vtkg} mL/kg PBW excede el rango protector${isARDS?" para SDRA (meta 4-6)":" (meta 6-8)"}`});}

    if(effDP!==null){
      R.calc.push({l:"Driving Pressure (ΔP)",v:`${effDP.toFixed(1)} cmH₂O`,f:mode==="pressure"?"Presión sobre PEEP (PROGRAMADA)":"Pplat−PEEP (RESULTANTE)",c:effDP>15?"#ef4444":effDP>13?"#f59e0b":"#22c55e"});
      if(effDP>15){R.alerts.push({lv:"warning",t:`ΔP ${effDP.toFixed(1)} cmH₂O >15 — variable ventilatoria más fuertemente asociada a mortalidad en SDRA`});R.refs.push("Amato MBP, et al. Driving pressure and survival in ARDS. NEJM. 2015;372(8):747-755.");}
      if(effPplat!==null&&effPplat>30)R.alerts.push({lv:"warning",t:`Pplat ${effPplat} >30 cmH₂O — riesgo de barotrauma`});

      if(effVt!==null&&effDP>0){const cst=effVt/effDP;
        R.calc.push({l:"Distensibilidad estática (Cst)",v:`${cst.toFixed(1)} mL/cmH₂O`,f:"Vt÷(Pplat−PEEP)",c:cst<30?"#ef4444":cst<40?"#f59e0b":"#22c55e"});
        if(pbw!==null)R.calc.push({l:"Cst específica",v:`${(cst/pbw).toFixed(2)} mL/cmH₂O/kg`,f:"Cst÷PBW (normal >0.6)",c:cst/pbw<0.5?"#ef4444":"#22c55e"});
        R.calc.push({l:"Elastancia estática",v:`${(1/cst*1000).toFixed(1)} cmH₂O/L`,f:"1÷Cst (inversa)",c:"#8ab0c0"});
        if(cst<30)R.interp.push({t:`Cst ${cst.toFixed(1)} severamente reducida (<30 mL/cmH₂O). Causas: SDRA severo, edema pulmonar, atelectasia extensa, neumotórax, fibrosis, obesidad mórbida, hipertensión intraabdominal, derrame pleural masivo`,c:"#ef4444"});}}

    if(effVt!==null&&ppeak!==null&&peep!==null&&ppeak>peep){const cdyn=effVt/(ppeak-peep);
      R.calc.push({l:"Distensibilidad dinámica (Cdyn)",v:`${cdyn.toFixed(1)} mL/cmH₂O`,f:"Vt÷(Ppico−PEEP)",c:cdyn<25?"#ef4444":"#22c55e"});
      if(effDP!==null&&effVt!==null&&effDP>0){const cst2=effVt/effDP;
        if(cdyn<cst2*0.7)R.interp.push({t:`Cdyn (${cdyn.toFixed(1)}) considerablemente menor que Cst (${cst2.toFixed(1)}): la diferencia refleja RESISTENCIA elevada de vía aérea. Evaluar broncoespasmo, secreciones, tubo endotraqueal obstruido o acodado. Considerar aspiración y broncodilatadores`,c:"#f59e0b"});
        else R.interp.push({t:`Cdyn y Cst similares: resistencia de vía aérea normal. El problema (si existe) es de distensibilidad del sistema respiratorio, no de flujo`,c:"#22c55e"});}}

    // Airway resistance
    if(ppeak!==null&&effPplat!==null&&iFlow!==null&&iFlow>0){const raw=(ppeak-effPplat)/(iFlow/60);
      R.calc.push({l:"Resistencia vía aérea (Raw)",v:`${raw.toFixed(1)} cmH₂O/L/s`,f:"(Ppico−Pplat)÷Flujo",c:raw>15?"#ef4444":raw>10?"#f59e0b":"#22c55e"});
      if(raw>15)R.interp.push({t:`Raw ${raw.toFixed(1)} elevada (normal 5-10 cmH₂O/L/s con TET). Causas: broncoespasmo, secreciones, TET de calibre pequeño, obstrucción del TET, auto-PEEP. Acción: aspirar, broncodilatador, verificar permeabilidad del TET`,c:"#ef4444"});}
    else if(ppeak!==null&&effPplat!==null){R.calc.push({l:"Ppico − Pplat",v:`${(ppeak-effPplat).toFixed(1)} cmH₂O`,f:"Componente resistivo",c:(ppeak-effPplat)>10?"#f59e0b":"#22c55e"});
      if((ppeak-effPplat)>10)R.interp.push({t:`Diferencia Ppico−Pplat >10 cmH₂O sugiere resistencia elevada. Ingresa el flujo inspiratorio para calcular Raw exacta`,c:"#f59e0b"});}

    // Mean airway pressure
    if(peep!==null&&rr!==null){
      let tiCalc=ti;
      if(tiCalc===null&&ie){const parts=ie.split(":");if(parts.length===2){const ratio=parseFloat(parts[1])/parseFloat(parts[0]);const ttot=60/rr;tiCalc=ttot/(1+ratio);}}
      if(tiCalc===null&&iFlow!==null&&effVt!==null&&iFlow>0)tiCalc=(effVt/1000)/(iFlow/60);
      if(tiCalc!==null&&tiCalc>0){const ttot=60/rr;const ratioIT=tiCalc/ttot;
        let pmed;
        if(mode==="pressure"&&effDP!==null)pmed=effDP*ratioIT+peep; // square wave
        else if(effPplat!==null)pmed=0.5*(effPplat-peep)*ratioIT+peep; // ramp (constant flow VCV)
        if(pmed!==undefined){R.calc.push({l:"Presión media vía aérea (Pmed)",v:`${pmed.toFixed(1)} cmH₂O`,f:mode==="pressure"?"ΔP×(Ti/Ttot)+PEEP":"0.5×ΔP×(Ti/Ttot)+PEEP",c:pmed>20?"#f59e0b":"#22c55e"});
          R.calc.push({l:"Relación I:E",v:`1:${(( ttot-tiCalc)/tiCalc).toFixed(1)}`,f:`Ti ${tiCalc.toFixed(2)}s / Ttot ${ttot.toFixed(2)}s`,c:"#8ab0c0"});
          R.interp.push({t:`Pmed ${pmed.toFixed(1)} cmH₂O: principal determinante de la oxigenación (reclutamiento alveolar) y del impacto hemodinámico (↓retorno venoso). En modo presión el flujo es desacelerado (onda cuadrada de presión) → Pmed mayor a igual ΔP que en volumen con flujo constante`,c:"#3b82f6"});}}}

    // Mechanical power
    if(rr!==null&&effVt!==null&&effDP!==null){
      let mp;
      if(mode==="pressure"&&peep!==null){mp=0.098*rr*(effVt/1000)*(effDP+peep);R.calc.push({l:"Poder Mecánico (PCV)",v:`${mp.toFixed(1)} J/min`,f:"0.098×FR×Vt×(ΔP+PEEP)",c:mp>17?"#ef4444":mp>12?"#f59e0b":"#22c55e"});}
      else if(ppeak!==null){mp=0.098*rr*(effVt/1000)*(ppeak-effDP/2);R.calc.push({l:"Poder Mecánico (VCV)",v:`${mp.toFixed(1)} J/min`,f:"0.098×FR×Vt×(Ppico−ΔP/2)",c:mp>17?"#ef4444":mp>12?"#f59e0b":"#22c55e"});}
      if(mp!==undefined){
        if(pbw!==null)R.calc.push({l:"PM normalizado por PBW",v:`${(mp/pbw*100).toFixed(1)} J/min/100kg`,f:"PM÷PBW×100",c:"#8ab0c0"});
        if(effVt!==null&&effDP>0){const cst3=effVt/effDP;R.calc.push({l:"PM normalizado por Cst",v:`${(mp/cst3*100).toFixed(1)}`,f:"PM÷Cst×100 (índice de estrés)",c:"#8ab0c0"});}
        if(mp>17){R.alerts.push({lv:"warning",t:`Poder mecánico ${mp.toFixed(1)} J/min >17 — umbral asociado a VILI y mortalidad`});
          R.act.push(`REDUCIR PODER MECÁNICO (${mp.toFixed(1)} J/min):\n${mode==="pressure"?"• En PCV: ↓presión sobre PEEP (reduce ΔP y Vt simultáneamente)\n• ↓FR si permite el pH":"• En VCV: ↓Vt (mayor impacto, PM es lineal con Vt)\n• ↓FR si el pH lo permite"}\n• El PM es lineal con FR y cuadrático con Vt → reducir Vt tiene mayor efecto\n• Optimizar PEEP: la PEEP alta ↑PM pero puede ↑compliance (efecto neto variable)\n• Reducir flujo inspiratorio disminuye componente resistivo\n• Considerar hipercapnia permisiva (pH >7.20) para permitir FR/Vt bajos`);
          R.refs.push("Serpa Neto A, et al. Mechanical power of ventilation. Intensive Care Med. 2018;44:1914-1922.");}}}

    // Mode-specific guidance
    if(mode==="pressure")R.interp.push({t:`MODO PRESIÓN CONTROLADA (PCV)\n• Programado: presión sobre PEEP, FR, Ti, PEEP\n• Resultante: Vt (varía con compliance y resistencia)\n• Ppico ≈ Pplat (flujo desacelerado, sin componente resistivo al final)\n• VENTAJA: presión limitada → menor riesgo de barotrauma\n• DESVENTAJA: Vt no garantizado → vigilar si ↓compliance\n• ⚠ Si el Vt cae súbitamente: buscar neumotórax, atelectasia, broncoespasmo, intubación selectiva`,c:"#3b82f6"});
    else R.interp.push({t:`MODO VOLUMEN CONTROLADO (VCV)\n• Programado: Vt, FR, flujo inspiratorio, PEEP\n• Resultante: Ppico y Pplat (varían con compliance y resistencia)\n• Ppico > Pplat: la diferencia es el componente resistivo\n• VENTAJA: Vt y ventilación minuto garantizados\n• DESVENTAJA: presiones no limitadas → riesgo si ↓compliance\n• ⚠ Si Ppico sube pero Pplat NO: problema resistivo (secreciones, broncoespasmo)\n• ⚠ Si suben AMBAS: problema de compliance (edema, atelectasia, neumotórax)`,c:"#3b82f6"});
  }

  // ═══ NON-INVASIVE ═══
  if(v.ventType==="niv"){
    if(v.nivMode==="cpap"&&cpap!==null){
      R.calc.push({l:"Nivel de CPAP",v:`${cpap} cmH₂O`,f:"Presión continua",c:"#3b82f6"});
      R.calc.push({l:"Driving Pressure (ventilador)",v:`0 cmH₂O`,f:"CPAP no genera ΔP",c:"#8ab0c0"});
      R.interp.push({t:`CPAP: DRIVING PRESSURE DEL VENTILADOR = 0\n• El CPAP aplica una presión constante SIN ciclado — no hay diferencial inspiratorio-espiratorio generado por el equipo\n• El ΔP transpulmonar real lo genera el ESFUERZO del paciente (presión pleural negativa)\n• Para medirlo se requiere manometría esofágica (Pes) → ΔP transpulmonar = ΔPaw − ΔPes\n• Sin Pes no es posible calcular el driving pressure real ni el poder mecánico total`,c:"#f59e0b"});
      R.interp.push({t:`PODER MECÁNICO EN CPAP\n• El poder mecánico ENTREGADO POR EL VENTILADOR es ≈0 (no hay trabajo cíclico del equipo)\n• Sin embargo el poder mecánico TOTAL sobre el pulmón puede ser ALTO si hay esfuerzo inspiratorio vigoroso\n• Riesgo de P-SILI (Patient Self-Inflicted Lung Injury): esfuerzos intensos generan presiones transpulmonares lesivas\n• Vigilar: FR >30, uso de músculos accesorios, Vt espontáneo >9-10 mL/kg PBW, oscilación de presión esofágica >10 cmH₂O`,c:"#ef4444"});
      if(vtNIV!==null&&pbw!==null){const vtkgN=(vtNIV/pbw).toFixed(1);R.calc.push({l:"Vt espontáneo / PBW",v:`${vtkgN} mL/kg`,f:"Marcador de P-SILI",c:vtkgN>9?"#ef4444":"#22c55e"});
        if(vtkgN>9)R.alerts.push({lv:"warning",t:`Vt espontáneo ${vtkgN} mL/kg >9 — riesgo de P-SILI. Considerar intubación`});}
      R.act.push(`MONITOREO EN CPAP:\n• Índice ROX = (SpO2/FiO2)/FR → <4.88 a las 12h predice falla\n• Vigilar Vt espontáneo (si el equipo lo mide): >9-10 mL/kg PBW sugiere esfuerzo excesivo\n• Reevaluar a 1h y 2h: si no mejora oxigenación o trabajo respiratorio → INTUBAR sin demora\n• La intubación tardía tras falla de VNI aumenta mortalidad`);}

    if(v.nivMode==="bipap"&&ipap!==null&&epap!==null){
      const dpNIV=ipap-epap;
      R.calc.push({l:"IPAP",v:`${ipap} cmH₂O`,f:"Presión inspiratoria",c:"#3b82f6"});
      R.calc.push({l:"EPAP",v:`${epap} cmH₂O`,f:"Presión espiratoria (=PEEP)",c:"#3b82f6"});
      R.calc.push({l:"Driving Pressure (soporte)",v:`${dpNIV} cmH₂O`,f:"IPAP−EPAP",c:dpNIV>15?"#ef4444":"#22c55e"});
      R.interp.push({t:`DRIVING PRESSURE EN BiPAP/VNI\n• ΔP del ventilador = IPAP − EPAP = ${dpNIV} cmH₂O\n• Este es el soporte de presión que ENTREGA el equipo\n• ⚠ El ΔP transpulmonar REAL es mayor: se suma el esfuerzo del paciente\n• ΔP >15 cmH₂O se asocia a mayor falla de VNI y a P-SILI\n• El Vt espontáneo es mejor marcador de riesgo que el ΔP programado`,c:dpNIV>15?"#ef4444":"#3b82f6"});
      if(vtNIV!==null&&rr!==null){const mpNIV=0.098*rr*(vtNIV/1000)*(ipap);
        R.calc.push({l:"PM estimado (ventilador)",v:`${mpNIV.toFixed(1)} J/min`,f:"0.098×FR×Vt×IPAP (aproximación)",c:mpNIV>17?"#ef4444":"#22c55e"});
        R.interp.push({t:`PODER MECÁNICO EN VNI — LIMITACIONES\n• Este cálculo estima SOLO el componente entregado por el ventilador\n• El poder total incluye el trabajo muscular del paciente, no medible sin Pes\n• Subestima el estrés real cuando hay esfuerzo inspiratorio vigoroso\n• Interpretar como referencia de tendencia, no como valor absoluto`,c:"#f59e0b"});}
      if(vtNIV!==null&&pbw!==null){const vtkgN=(vtNIV/pbw).toFixed(1);R.calc.push({l:"Vt espontáneo / PBW",v:`${vtkgN} mL/kg`,f:"Predictor de falla de VNI",c:vtkgN>9.5?"#ef4444":"#22c55e"});
        if(vtkgN>9.5){R.alerts.push({lv:"warning",t:`Vt ${vtkgN} mL/kg >9.5 — predictor independiente de falla de VNI y P-SILI (Carteaux, CCM 2016)`});
          R.act.push(`ALTO RIESGO DE FALLA DE VNI:\n• Vt espontáneo >9.5 mL/kg PBW predice falla (Carteaux, Crit Care Med 2016)\n• Considerar intubación temprana en lugar de prolongar VNI\n• Alternativa: reducir presión de soporte (↓IPAP) si la oxigenación lo permite\n• Reevaluar en 1-2h; la intubación tardía aumenta mortalidad`);}}
      R.refs.push("Carteaux G, et al. Failure of NIV for de novo respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290.");}

    if(v.nivMode==="hfnc"){const flowHF=n("hfncFlow");
      if(flowHF!==null){R.calc.push({l:"Flujo CNAF",v:`${flowHF} L/min`,f:"Cánula nasal alto flujo",c:"#3b82f6"});
        R.calc.push({l:"PEEP generada (estimada)",v:`~${(flowHF/10).toFixed(1)} cmH₂O`,f:"≈0.5-1 cmH₂O por cada 10 L/min (boca cerrada)",c:"#8ab0c0"});
        R.interp.push({t:`CNAF — MECÁNICA\n• Genera PEEP baja y variable (~0.5-1 cmH₂O por cada 10 L/min con boca cerrada; menos con boca abierta)\n• NO permite calcular driving pressure ni poder mecánico del ventilador (no cicla presión)\n• Beneficio principal: lavado del espacio muerto nasofaríngeo, ↓trabajo respiratorio, FiO2 estable, acondicionamiento del gas\n• El riesgo de P-SILI persiste si el esfuerzo es vigoroso`,c:"#3b82f6"});}
      const spo2H=n("spo2"),fio2H=fio2,rrH=rr;
      if(spo2H!==null&&fio2H!==null&&rrH!==null&&fio2H>0){const rox=(spo2H/fio2H)/rrH*100;
        R.calc.push({l:"Índice ROX",v:`${rox.toFixed(2)}`,f:"(SpO2/FiO2)/FR",c:rox<4.88?"#ef4444":"#22c55e"});
        if(rox<4.88){R.alerts.push({lv:"warning",t:`ROX ${rox.toFixed(2)} <4.88 — riesgo de falla de CNAF`});
          R.act.push(`ÍNDICE ROX BAJO (${rox.toFixed(2)}):\n• ROX <2.85 a las 2h, <3.47 a las 6h, <3.85 a las 12h → alto riesgo de intubación\n• ROX ≥4.88 a las 12h → predictor de éxito\n• Reevaluar tendencia: un ROX que no mejora en 2-6h sugiere falla\n• Considerar intubación electiva antes del deterioro agudo (Roca, AJRCCM 2019)`);
          R.refs.push("Roca O, et al. ROX index to predict HFNC outcome. Am J Respir Crit Care Med. 2019;199(11):1368-1376.");}}}
  }

  // ═══ ARTERIAL BLOOD GAS ═══
  if(pao2!==null&&fio2!==null&&fio2>0){const pf=Math.round(pao2/(fio2/100));
    R.calc.push({l:"PaO2/FiO2 (PaFi)",v:`${pf}`,f:"PaO2÷FiO2",c:pf<100?"#ef4444":pf<200?"#ef4444":pf<300?"#f59e0b":"#22c55e"});
    if(pf<100)R.interp.push({t:`PaFi ${pf} → SDRA SEVERO (Berlín). Indicación de prono ≥12-16h/día. Considerar ECMO si refractario (EOLIA, NEJM 2018)`,c:"#ef4444"});
    else if(pf<200)R.interp.push({t:`PaFi ${pf} → SDRA MODERADO. Prono si PaFi <150 (PROSEVA)`,c:"#ef4444"});
    else if(pf<300)R.interp.push({t:`PaFi ${pf} → SDRA LEVE`,c:"#f59e0b"});
    if(pf<150)R.act.push(`SDRA CON PaFi <150:\n• PRONO ≥12-16 h/día (PROSEVA, Guérin NEJM 2013: ↓mortalidad 16% absoluto)\n• Vt 4-6 mL/kg PBW, Pplat <30, ΔP ≤15\n• PEEP según tabla ARDSNet o titulación individualizada\n• Bloqueo neuromuscular las primeras 48h si asincronía severa\n• Evaluar ECMO si PaFi <80 por >6h o pH <7.25 con PaCO2 ≥60 por >6h`);}
  if(pao2!==null&&fio2!==null&&paco2!==null&&patm){const pAlv=(fio2/100)*(patm-47)-paco2/0.8;const aa=pAlv-pao2;const age2=n("age");const eAa=age2?2.5+0.21*age2:null;
    R.calc.push({l:"PAO2 alveolar",v:`${pAlv.toFixed(0)} mmHg`,f:`FiO2×(Patm[${patm}]−47)−PaCO2/0.8`,c:"#8ab0c0"});
    R.calc.push({l:"Gradiente A-a",v:`${aa.toFixed(0)} mmHg`,f:"PAO2−PaO2",c:eAa&&aa>eAa?"#f59e0b":"#22c55e"});
    if(eAa){R.calc.push({l:"A-a esperado por edad",v:`≤${eAa.toFixed(0)} mmHg`,f:"2.5+0.21×Edad",c:aa>eAa?"#f59e0b":"#22c55e"});
      if(aa>eAa)R.interp.push({t:`Gradiente A-a ELEVADO (${aa.toFixed(0)} vs esperado ≤${eAa.toFixed(0)}): la hipoxemia es de causa PULMONAR — alteración V/Q, shunt intrapulmonar o trastorno de difusión. Descartar TEP, neumonía, SDRA, edema pulmonar, atelectasia`,c:"#f59e0b"});
      else R.interp.push({t:`Gradiente A-a NORMAL: si hay hipoxemia, la causa es EXTRAPULMONAR — hipoventilación (depresión del centro respiratorio, debilidad neuromuscular, obstrucción de vía aérea alta) o baja FiO2 inspirada (altitud)`,c:"#22c55e"});}}

  // ═══ ACID-BASE ANALYSIS ═══
  if(ph!==null)R.calc.push({l:"pH arterial",v:ph.toFixed(2),f:"7.35-7.45",c:ph<7.2?"#ef4444":ph<7.35?"#f59e0b":ph>7.45?"#f59e0b":"#22c55e"});
  if(paco2!==null)R.calc.push({l:"PaCO2",v:`${paco2} mmHg`,f:"35-45",c:paco2>45?"#f59e0b":paco2<35?"#f59e0b":"#22c55e"});
  if(hco3!==null)R.calc.push({l:"HCO3⁻",v:`${hco3} mEq/L`,f:"22-26",c:hco3>26?"#f59e0b":hco3<22?"#f59e0b":"#22c55e"});
  if(be!==null){const bv=v.beSign==="-"?-Math.abs(be):Math.abs(be);R.calc.push({l:"Exceso de base (BE)",v:`${bv>0?"+":""}${bv} mEq/L`,f:"Normal −2 a +2",c:bv<-5?"#ef4444":bv>5?"#f59e0b":"#22c55e"});
    if(wtV!==null){const beDeficit=0.3*wtV*Math.abs(bv);R.calc.push({l:bv<0?"Déficit de base total":"Exceso de base total",v:`${beDeficit.toFixed(0)} mEq`,f:"0.3 × Peso × |BE|",c:"#8ab0c0"});}
    if(bv<=-10){R.alerts.push({lv:"critical",t:`Déficit de base ${bv} mEq/L — acidosis metabólica severa`});
      R.act.push(`DÉFICIT DE BASE SEVERO (BE ${bv} mEq/L)\n\n📊 SIGNIFICADO:\n• El BE cuantifica el componente METABÓLICO puro, independiente del respiratorio\n• Es la cantidad de ácido o base necesaria para llevar el pH a 7.40 con PaCO2 de 40\n• Ventaja sobre el HCO3: no se altera por cambios agudos en la PaCO2\n\n🩸 EN TRAUMA Y CHOQUE — VALOR PRONÓSTICO:\n• BE −2 a −5: déficit leve\n• BE −6 a −9: déficit moderado — considerar transfusión\n• BE ≤ −10: déficit severo — predictor independiente de mortalidad, necesidad de transfusión masiva y de lesión oculta\n• El déficit de base al ingreso predice mortalidad mejor que la presión arterial en trauma\n\n⚕️ INTERVENCIONES:\n• Buscar y tratar la CAUSA: hipoperfusión (lactato), cetoacidosis, uremia, intoxicación, pérdidas de bicarbonato\n• Si hay hipoperfusión → optimizar volemia y gasto cardíaco (ver pestaña Hemodinamia)\n• Si es hiperclorémica (AG normal, Cl alto) → cambiar a cristaloides balanceados\n• Reevaluar BE seriado: la NO mejoría tras reanimación adecuada sugiere hemorragia oculta o daño irreversible\n• Bicarbonato: solo considerar si pH ≤7.20 (ver criterios BICAR-ICU en pestaña Electrolitos)`);}
    else if(bv<=-5)R.interp.push({t:`Déficit de base ${bv} mEq/L (moderado): indica acidosis metabólica establecida. En contexto de trauma o choque, un BE entre −6 y −9 se asocia con necesidad de transfusión. Investigar hipoperfusión, y correlacionar con lactato y anión gap`,c:"#f59e0b"});
    else if(bv<-2)R.interp.push({t:`Déficit de base leve (${bv}): componente metabólico ácido presente pero de baja magnitud. Vigilar tendencia`,c:"#f59e0b"});
    else if(bv>5){R.interp.push({t:`Exceso de base ${bv} mEq/L: alcalosis metabólica. Causas frecuentes en UCI: pérdidas gástricas por SNG o vómito, diuréticos de asa, hipokalemia, hipovolemia (alcalosis por contracción), aporte excesivo de bicarbonato, corticoides`,c:"#f59e0b"});
      R.act.push(`EXCESO DE BASE (BE +${bv} mEq/L) — ALCALOSIS METABÓLICA\n\n⚠ IMPLICACIONES CLÍNICAS:\n• Deprime el estímulo respiratorio → DIFICULTA EL DESTETE del ventilador\n• Desplaza la curva de disociación de la hemoglobina a la izquierda → menor entrega de O2 a los tejidos\n• Reduce el calcio ionizado → puede causar tetania y arritmias\n• Favorece hipokalemia (círculo vicioso)\n\n⚕️ CORRECCIÓN SEGÚN CAUSA:\n• Pérdidas gástricas → reponer cloro con SSN 0.9%; inhibidor de bomba de protones para reducir pérdida de H+\n• Diuréticos de asa → considerar acetazolamida 250-500 mg IV/VO (inhibe anhidrasa carbónica, promueve bicarbonaturia)\n• Hipokalemia → corregir el K⁺ (la hipoK perpetúa la alcalosis por intercambio H+/K+ renal)\n• Hipovolemia → expandir con SSN (la alcalosis por contracción responde a volumen)\n• Exceso de bicarbonato o citrato (transfusiones, TRR con citrato) → suspender o ajustar aporte\n\n🔬 DIFERENCIAR POR CLORO URINARIO:\n• Cl urinario <20 mEq/L → responde a salino (vómito, SNG, diuréticos previos, post-hipercapnia)\n• Cl urinario >20 mEq/L → resistente a salino (hiperaldosteronismo, Bartter, Gitelman, hipokalemia severa, diuréticos activos)`);}
    else R.interp.push({t:`BE ${bv>0?"+":""}${bv} mEq/L dentro de rango normal (−2 a +2): sin trastorno metabólico significativo`,c:"#22c55e"});}

  // ═══ LACTATE ═══
  if(lactate!==null){
    R.calc.push({l:"Lactato arterial",v:`${lactate} mmol/L`,f:"Normal <2 | Choque séptico ≥2",c:lactate>=4?"#ef4444":lactate>=2?"#f59e0b":"#22c55e"});
    if(lactate>=4){R.alerts.push({lv:"critical",t:`Lactato ${lactate} mmol/L — hiperlactatemia severa`});
      R.act.push(`LACTATO ≥4 mmol/L — INTERPRETACIÓN Y MANEJO\n\n🔬 TIPO A (hipoxia tisular) — la más frecuente en UCI:\n• Choque de cualquier etiología (séptico, cardiogénico, hipovolémico, obstructivo)\n• Hipoxemia severa, anemia profunda, intoxicación por CO o cianuro\n• Isquemia regional: mesentérica, de extremidad, síndrome compartimental\n\n🔬 TIPO B (sin hipoxia tisular evidente):\n• B1 (enfermedad subyacente): hepatopatía con ↓aclaramiento, malignidad, cetoacidosis, sepsis con disfunción mitocondrial, tiamina baja\n• B2 (fármacos y toxinas): metformina, linezolid, propofol (síndrome de infusión), antirretrovirales, salicilatos, epinefrina y β2-agonistas (efecto glucolítico, NO indica hipoperfusión)\n• B3 (errores congénitos del metabolismo)\n\n⚠ SSC 2026 — CAMBIO IMPORTANTE:\n• "Sugerimos NO usar el lactato elevado como indicación refleja para administrar fluidos"\n• Usar lactato SERIADO para GUIAR la reanimación, no como gatillo automático de volumen\n• La administración de líquidos debe individualizarse tras el bolo inicial\n\n⚕️ ACCIONES:\n• Determinar si hay hipoperfusión REAL: correlacionar con CRT, moteado cutáneo, diuresis, ScvO2 y gap venoarterial de CO2\n• Si hay hipoperfusión → optimizar perfusión según fenotipo (ver pestaña Hemodinamia, algoritmo ANDROMEDA-SHOCK-2)\n• Si NO hay hipoperfusión → buscar causa tipo B (revisar fármacos, función hepática, tiamina)\n• Meta: aclaramiento ≥20% cada 2 horas (Jansen, AJRCCM 2010)\n• Repetir lactato a las 2-4 horas para evaluar tendencia — el VALOR AISLADO es menos útil que la TENDENCIA\n\n📊 PRONÓSTICO:\n• Lactato ≥4 mmol/L con hipotensión: mortalidad >40%\n• La NO depuración a las 6h es predictor independiente de mortalidad`);
      R.refs.push("Jansen TC, et al. Early lactate-guided therapy in ICU patients. Am J Respir Crit Care Med. 2010;182(6):752-761.");}
    else if(lactate>=2){R.interp.push({t:`Lactato ${lactate} mmol/L (2-3.9): hiperlactatemia moderada. En presencia de infección sospechada o confirmada, un lactato ≥2 mmol/L junto con requerimiento de vasopresores para mantener PAM ≥65 define SHOCK SÉPTICO según Sepsis-3`,c:"#f59e0b"});
      R.act.push(`LACTATO 2-4 mmol/L\n• Evaluar perfusión periférica: CRT, gradiente térmico, moteado cutáneo, diuresis\n• Considerar causas no hipóxicas antes de expandir volumen indiscriminadamente\n• Repetir en 2 horas: la tendencia orienta más que el valor absoluto\n• Si desciende ≥20%: la reanimación va en buen camino\n• Si asciende o se mantiene: reevaluar fenotipo hemodinámico y buscar foco no controlado`);}
    else R.interp.push({t:`Lactato ${lactate} mmol/L normal (<2): sin evidencia bioquímica de hipoperfusión global. Recordar que un lactato normal no descarta hipoperfusión regional (isquemia mesentérica temprana)`,c:"#22c55e"});
    // Lactate + BE correlation
    if(be!==null){const bv2=v.beSign==="-"?-Math.abs(be):Math.abs(be);
      if(lactate>=2&&bv2>-2)R.interp.push({t:`⚠ DISOCIACIÓN: lactato elevado (${lactate}) con BE casi normal (${bv2>0?"+":""}${bv2}). Sugiere que existe un componente alcalótico simultáneo que enmascara la acidosis láctica, o hiperlactatemia tipo B sin acidosis significativa. Revisar anión gap y delta ratio`,c:"#f59e0b"});
      if(lactate<2&&bv2<=-6)R.interp.push({t:`⚠ DISOCIACIÓN: déficit de base importante (${bv2}) con lactato normal (${lactate}). La acidosis metabólica NO es láctica. Considerar: acidosis hiperclorémica (revisar Cl⁻ y anión gap), cetoacidosis, uremia, intoxicaciones, acidosis tubular renal`,c:"#f59e0b"});}}


  let primaryDisorder=null;
  if(ph!==null&&paco2!==null&&hco3!==null){
    let steps=[];
    if(ph<7.35){steps.push("PASO 1: pH <7.35 → ACIDEMIA");
      if(paco2>45&&hco3<22){primaryDisorder="mixed_acidosis";steps.push("PASO 2: PaCO2 ↑ Y HCO3 ↓ → ACIDOSIS MIXTA (respiratoria + metabólica)");steps.push("→ Ambos componentes empujan el pH en la misma dirección");}
      else if(paco2>45){primaryDisorder="resp_acidosis";steps.push("PASO 2: PaCO2 ↑ → ACIDOSIS RESPIRATORIA primaria");
        const expAcute=24+(paco2-40)/10,expChronic=24+3.5*(paco2-40)/10;
        steps.push(`PASO 3: HCO3 esperado — aguda ≈${expAcute.toFixed(0)} | crónica ≈${expChronic.toFixed(0)}`);
        if(hco3<expAcute-2)steps.push("→ HCO3 menor al esperado: acidosis metabólica SOBREAGREGADA");
        else if(hco3>expChronic+2)steps.push("→ HCO3 mayor al esperado: alcalosis metabólica sobreagregada");
        else if(Math.abs(hco3-expChronic)<=2)steps.push("→ Patrón de compensación CRÓNICA (≥3-5 días)");
        else steps.push("→ Patrón de compensación AGUDA");}
      else if(hco3<22){primaryDisorder="met_acidosis";steps.push("PASO 2: HCO3 ↓ → ACIDOSIS METABÓLICA primaria");
        const eC=1.5*hco3+8;R.calc.push({l:"PaCO2 esperada (Winter)",v:`${eC.toFixed(0)} ± 2`,f:"1.5×HCO3+8",c:Math.abs(paco2-eC)>2?"#f59e0b":"#22c55e"});
        steps.push(`PASO 3: PaCO2 esperada por Winter = ${eC.toFixed(0)}±2 (real: ${paco2})`);
        if(paco2<eC-2){steps.push("→ PaCO2 MENOR a la esperada: ALCALOSIS RESPIRATORIA sobreagregada");primaryDisorder="met_acidosis_resp_alk";}
        else if(paco2>eC+2){steps.push("→ PaCO2 MAYOR a la esperada: ACIDOSIS RESPIRATORIA sobreagregada (compensación insuficiente)");primaryDisorder="met_acidosis_resp_acid";}
        else steps.push("→ Compensación respiratoria ADECUADA");}}
    else if(ph>7.45){steps.push("PASO 1: pH >7.45 → ALCALEMIA");
      if(paco2<35&&hco3>26){primaryDisorder="mixed_alkalosis";steps.push("PASO 2: PaCO2 ↓ Y HCO3 ↑ → ALCALOSIS MIXTA");}
      else if(paco2<35){primaryDisorder="resp_alkalosis";steps.push("PASO 2: PaCO2 ↓ → ALCALOSIS RESPIRATORIA primaria");
        const expA=24-2*(40-paco2)/10,expC=24-5*(40-paco2)/10;
        steps.push(`PASO 3: HCO3 esperado — aguda ≈${expA.toFixed(0)} | crónica ≈${expC.toFixed(0)}`);}
      else if(hco3>26){primaryDisorder="met_alkalosis";steps.push("PASO 2: HCO3 ↑ → ALCALOSIS METABÓLICA primaria");
        const expCO2m=0.7*hco3+21;steps.push(`PASO 3: PaCO2 esperada ≈${expCO2m.toFixed(0)}±2 (real: ${paco2})`);
        if(paco2>expCO2m+2)steps.push("→ Acidosis respiratoria sobreagregada");}}
    else{steps.push("PASO 1: pH 7.35-7.45 → NORMAL");
      if(paco2>45||paco2<35||hco3>26||hco3<22){steps.push("PASO 2: pH normal PERO PaCO2 o HCO3 anormales → TRASTORNO MIXTO COMPENSADO");primaryDisorder="mixed_compensated";}
      else steps.push("PASO 2: Sin trastorno ácido-base evidente");}
    steps.forEach(s=>R.interp.push({t:s,c:"#8ab0c0"}));}

  // Anion gap
  if(na!==null&&cl!==null&&hco3!==null){let ag=na-(cl+hco3);
    R.calc.push({l:"Anión Gap",v:`${ag.toFixed(1)} mEq/L`,f:"Na−(Cl+HCO3) | normal 8-12",c:ag>12?"#f59e0b":"#22c55e"});
    if(alb!==null){const agC=ag+2.5*(4-alb);R.calc.push({l:"AG corregido por albúmina",v:`${agC.toFixed(1)} mEq/L`,f:"AG+2.5×(4−Alb)",c:agC>12?"#f59e0b":"#22c55e"});
      if(alb<4)R.interp.push({t:`Albúmina ${alb} g/dL: cada 1 g/dL de descenso reduce el AG ~2.5 mEq/L. SIN corregir, el AG subestima la presencia de aniones no medidos — crítico en el paciente crítico con hipoalbuminemia`,c:"#f59e0b"});
      ag=agC;}
    if(ag>12&&hco3<24){const dAG=ag-12,dH=24-hco3;
      R.calc.push({l:"Delta AG (ΔAG)",v:`${dAG.toFixed(1)}`,f:"AG−12",c:"#8ab0c0"});
      R.calc.push({l:"Delta HCO3 (ΔHCO3)",v:`${dH.toFixed(1)}`,f:"24−HCO3",c:"#8ab0c0"});
      if(dH>0){const dr=dAG/dH;
        R.calc.push({l:"Delta Ratio",v:dr.toFixed(2),f:"ΔAG÷ΔHCO3",c:dr<0.4||dr>2?"#f59e0b":"#22c55e"});
        if(dr<0.4)R.interp.push({t:`Delta ratio ${dr.toFixed(2)} <0.4 → ACIDOSIS HIPERCLORÉMICA PURA (AG normal). Causas: diarrea, acidosis tubular renal, exceso de solución salina, fístulas intestinales, inhibidores de anhidrasa carbónica`,c:"#f59e0b"});
        else if(dr<0.8)R.interp.push({t:`Delta ratio ${dr.toFixed(2)} (0.4-0.8) → ACIDOSIS MIXTA: AG elevado + componente hiperclorémico`,c:"#f59e0b"});
        else if(dr<=1.2)R.interp.push({t:`Delta ratio ${dr.toFixed(2)} (0.8-1.2) → ACIDOSIS CON AG ELEVADO PURA. Relación 1:1 entre aniones ganados y bicarbonato consumido`,c:"#22c55e"});
        else if(dr<=2)R.interp.push({t:`Delta ratio ${dr.toFixed(2)} (1.2-2.0) → AG elevado + ALCALOSIS METABÓLICA coexistente, o acidosis láctica con buffer preservado`,c:"#f59e0b"});
        else R.interp.push({t:`Delta ratio ${dr.toFixed(2)} >2 → AG elevado + ALCALOSIS METABÓLICA significativa (vómito, diuréticos, esteroides). El HCO3 está más alto de lo esperado para el AG`,c:"#f59e0b"});}
      R.interp.push({t:`ACIDOSIS CON AG ELEVADO — Nemotecnia GOLD MARK:\nGlicoles (etilenglicol, propilenglicol) | Oxoprolina (paracetamol crónico) | L-lactato | D-lactato | Metanol | Aspirina | Renal (uremia) | Cetoacidosis`,c:"#f59e0b"});}
    if(ag<=12&&hco3<22)R.interp.push({t:`Acidosis metabólica con AG NORMAL (hiperclorémica). Calcular AG urinario para diferenciar: AGu positivo → causa renal (ATR); AGu negativo → causa gastrointestinal (diarrea)`,c:"#f59e0b"});}

  // ═══ SODIUM-CHLORIDE INDEX (bedside proxy for strong ion difference) ═══
  if(na!==null&&cl!==null){
    const naClDiff=na-cl;
    const clNaRatio=cl/na;
    const clCorr=cl*(140/na);
    R.calc.push({l:"Diferencia Na⁻Cl",v:`${naClDiff.toFixed(0)} mEq/L`,f:"Na−Cl | Normal 32-40 (media 36)",c:naClDiff<30?"#ef4444":naClDiff>40?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Índice Cl/Na",v:`${clNaRatio.toFixed(3)}`,f:"Cl÷Na | Normal 0.75-0.79",c:clNaRatio>0.79?"#ef4444":clNaRatio<0.75?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Cloro corregido por Na",v:`${clCorr.toFixed(1)} mEq/L`,f:"Cl×(140÷Na) | Normal 100-110",c:clCorr>110?"#ef4444":clCorr<98?"#f59e0b":"#22c55e"});

    R.interp.push({t:`📐 ÍNDICE SODIO-CLORO — FUNDAMENTO\nLa diferencia Na⁻Cl es una aproximación de cabecera a la DIFERENCIA DE IONES FUERTES (SID) del modelo de Stewart. Refleja el espacio disponible para los aniones amortiguadores (bicarbonato y albúmina). Cuando el cloro aumenta desproporcionadamente respecto al sodio, desplaza al bicarbonato y genera acidosis, sin que existan aniones no medidos. Es el complemento del anión gap: mientras el AG detecta aniones anormales, el índice Na⁻Cl detecta el exceso o déficit del anión fisiológico más abundante.`,c:"#3b82f6"});

    // ── Interpretation by Na-Cl difference ──
    if(naClDiff<30){
      R.alerts.push({lv:naClDiff<26?"warning":"warning",t:`Diferencia Na⁻Cl ${naClDiff.toFixed(0)} mEq/L — acidosis hiperclorémica`});
      R.interp.push({t:`Diferencia Na⁻Cl ${naClDiff.toFixed(0)} (<30): indica ACIDOSIS METABÓLICA HIPERCLORÉMICA. El exceso relativo de cloro consume bicarbonato y reduce el SID. Este hallazgo es consistente con un anión gap normal y con un delta ratio bajo. Si además hay anión gap elevado, coexisten ambos mecanismos (acidosis mixta)`,c:"#ef4444",bold:true});
    } else if(naClDiff<32){
      R.interp.push({t:`Diferencia Na⁻Cl ${naClDiff.toFixed(0)} (30-32, límite bajo): componente hiperclorémico incipiente. Vigilar si continúa la administración de soluciones ricas en cloro`,c:"#f59e0b"});
    } else if(naClDiff>40){
      R.interp.push({t:`Diferencia Na⁻Cl ${naClDiff.toFixed(0)} (>40): sugiere ALCALOSIS METABÓLICA HIPOCLORÉMICA. El déficit relativo de cloro amplía el SID y eleva el bicarbonato. Causas típicas: pérdidas gástricas por sonda o vómito, diuréticos de asa y tiazidas, alcalosis por contracción de volumen`,c:"#f59e0b",bold:true});
    } else {
      R.interp.push({t:`Diferencia Na⁻Cl ${naClDiff.toFixed(0)} en rango normal (32-40): la relación entre sodio y cloro es proporcionada. Si existe acidosis metabólica, es poco probable que el componente hiperclorémico sea el mecanismo dominante`,c:"#22c55e"});
    }

    // ── Cl/Na ratio (Durward) ──
    if(clNaRatio>0.79&&hco3!==null&&hco3<22){
      R.interp.push({t:`Índice Cl/Na ${clNaRatio.toFixed(3)} (>0.79) con HCO3 bajo: apoya fuertemente el diagnóstico de acidosis metabólica HIPERCLORÉMICA. Durward y colaboradores describieron que un cociente Cl/Na superior a 0.79 discrimina la acidosis hiperclorémica de la acidosis con anión gap elevado con buena precisión, incluso cuando el anión gap está falsamente normalizado por hipoalbuminemia`,c:"#ef4444"});
    } else if(clNaRatio<0.75&&hco3!==null&&hco3<22){
      R.interp.push({t:`Índice Cl/Na ${clNaRatio.toFixed(3)} (<0.75) con HCO3 bajo: apoya acidosis metabólica con ANIÓN GAP ELEVADO. El cloro no es el responsable del consumo de bicarbonato; buscar aniones no medidos (lactato, cetoácidos, uremia, tóxicos)`,c:"#f59e0b"});
    }

    // ── Corrected chloride (unmasks dysnatremia effect) ──
    if(Math.abs(na-140)>5){
      R.interp.push({t:`⚠ CLORO CORREGIDO — por qué importa aquí\nEl paciente tiene Na⁺ ${na} mEq/L (desviado de 140). El cloro medido (${cl}) puede estar artefactualmente alterado por el mismo mecanismo que alteró el sodio (dilución o concentración del plasma). El cloro corregido de ${clCorr.toFixed(1)} mEq/L representa el valor que tendría si el sodio fuera normal.\n• Cloro corregido >110 → hipercloremia VERDADERA, con capacidad acidificante real\n• Cloro corregido <98 → hipocloremia VERDADERA\n• En este paciente: ${clCorr>110?"hipercloremia verdadera confirmada":clCorr<98?"hipocloremia verdadera confirmada":"el cloro es proporcionalmente normal — la alteración es del agua, no del cloro"}`,c:"#f59e0b"});
    }

    // ── Interventions: hyperchloremic ──
    if(naClDiff<32||clCorr>110){
      R.act.push(`ACIDOSIS HIPERCLORÉMICA — CONDUCTA\n\n📊 HALLAZGOS EN ESTE PACIENTE:\n• Diferencia Na⁻Cl: ${naClDiff.toFixed(0)} mEq/L (normal 32-40)\n• Índice Cl/Na: ${clNaRatio.toFixed(3)} (normal 0.75-0.79)\n• Cloro corregido: ${clCorr.toFixed(1)} mEq/L (normal 100-110)\n\n🔍 IDENTIFICAR LA CAUSA:\n\n▸ IATROGÉNICA — la más frecuente en UCI\n   • Solución salina 0.9%: contiene 154 mEq/L de cloro, muy por encima del plasma (98-107)\n   • Cada litro de SSN aporta un exceso neto de ~50 mEq de cloro\n   • También: soluciones de reposición ricas en cloro, nutrición parenteral, cloruro de potasio en altas dosis\n\n▸ PÉRDIDA DE BICARBONATO\n   • Diarrea de alto gasto, fístulas intestinales o pancreáticas, ureterosigmoidostomía\n   • Acidosis tubular renal tipo 2 (proximal)\n\n▸ ALTERACIÓN DE LA ACIDIFICACIÓN RENAL\n   • Acidosis tubular renal tipo 1 (distal) y tipo 4 (hipoaldosteronismo)\n   • Inhibidores de anhidrasa carbónica (acetazolamida)\n   • Fase de recuperación de cetoacidosis diabética (pérdida urinaria de cetoaniones con retención de cloro)\n\n⚕️ INTERVENCIONES:\n\n1️⃣ CAMBIAR A CRISTALOIDES BALANCEADOS\n   • Ringer lactato: Cl⁻ 109 mEq/L | Plasma-Lyte: Cl⁻ 98 mEq/L\n   • La SSC 2026 recomienda cristaloides balanceados sobre salina 0.9% con CERTEZA MODERADA (fue una elevación respecto a la certeza baja de 2021)\n   • Los estudios SMART y SALT-ED mostraron menor incidencia del desenlace compuesto de mortalidad, terapia de reemplazo renal y disfunción renal persistente\n   • ⚠ EXCEPCIÓN: en lesión cerebral traumática se prefiere salina 0.9% (los balanceados son ligeramente hipotónicos y pueden aumentar el edema cerebral)\n\n2️⃣ REVISAR TODOS LOS APORTES DE CLORO\n   • Diluciones de fármacos preparadas en SSN\n   • Lavados de líneas y de sonda vesical\n   • Cloruro de potasio, cloruro de calcio, cloruro de amonio\n   • Nutrición parenteral: solicitar ajuste del contenido de cloro al servicio de nutrición\n\n3️⃣ CONSIDERACIONES FISIOPATOLÓGICAS\n   • La hipercloremia produce vasoconstricción de la arteriola aferente por retroalimentación tubuloglomerular → reduce el flujo sanguíneo renal y la tasa de filtración\n   • Se asocia con mayor incidencia de lesión renal aguda y con coagulopatía en modelos experimentales\n   • Puede prolongar la acidemia y confundir la interpretación del lactato\n\n4️⃣ CORRECCIÓN ACTIVA (solo si es severa y sintomática)\n   • Generalmente NO requiere bicarbonato: la acidosis hiperclorémica se resuelve al retirar la fuente de cloro y con la regeneración renal de bicarbonato\n   • Si pH ≤7.20 con repercusión hemodinámica, ver criterios de BICAR-ICU en la pestaña de Electrolitos\n   • Alternativa: soluciones con aniones metabolizables (lactato, acetato, gluconato) que generan bicarbonato al metabolizarse\n\n📋 SEGUIMIENTO:\n• Recalcular la diferencia Na⁻Cl tras 12-24 horas del cambio de solución\n• La normalización del índice precede a la normalización del pH`);
      R.refs.push("Semler MW, et al. Balanced crystalloids versus saline in critically ill adults (SMART). NEJM. 2018;378(9):829-839.","Self WH, et al. Balanced crystalloids versus saline in noncritically ill adults (SALT-ED). NEJM. 2018;378(9):819-828.");
    }

    // ── Interventions: hypochloremic ──
    if(naClDiff>40||clCorr<98){
      R.act.push(`ALCALOSIS HIPOCLORÉMICA — CONDUCTA\n\n📊 HALLAZGOS EN ESTE PACIENTE:\n• Diferencia Na⁻Cl: ${naClDiff.toFixed(0)} mEq/L (normal 32-40)\n• Cloro corregido: ${clCorr.toFixed(1)} mEq/L (normal 100-110)\n\n🔍 CAUSAS FRECUENTES:\n• Pérdidas gástricas: aspiración por sonda nasogástrica, vómito de repetición\n• Diuréticos de asa y tiazidas (pérdida urinaria de cloro)\n• Alcalosis por contracción de volumen\n• Corrección de hipercapnia crónica (alcalosis post-hipercápnica)\n• Aporte excesivo de bicarbonato o de citrato (transfusiones, anticoagulación regional en terapia de reemplazo renal)\n\n⚠ POR QUÉ IMPORTA EN EL PACIENTE CRÍTICO:\n• Deprime el estímulo respiratorio central → DIFICULTA EL DESTETE de la ventilación mecánica\n• Desplaza la curva de disociación de la hemoglobina hacia la izquierda → menor liberación de oxígeno a los tejidos\n• Reduce la fracción de calcio iónico → riesgo de tetania y arritmias\n• Se asocia con hipokalemia refractaria (ambas se perpetúan mutuamente)\n\n🔬 DIFERENCIAR POR CLORO URINARIO — determina el tratamiento:\n\n▸ Cloro urinario <20 mEq/L → SENSIBLE A SALINO\n   • Causas: vómito, aspiración por sonda, diuréticos suspendidos, post-hipercapnia\n   • Tratamiento: solución salina 0.9% para reponer cloro y volumen\n   • Reponer también potasio (cloruro de potasio)\n\n▸ Cloro urinario >20 mEq/L → RESISTENTE A SALINO\n   • Causas: hiperaldosteronismo, síndrome de Cushing, diuréticos en uso activo, hipokalemia severa, síndromes de Bartter y Gitelman\n   • Tratamiento: corregir el exceso mineralocorticoide, espironolactona, corregir potasio\n\n⚕️ INTERVENCIONES:\n\n1️⃣ REPOSICIÓN DE CLORO\n   • Solución salina 0.9% si hay hipovolemia o cloro urinario bajo\n   • Cloruro de potasio si coexiste hipokalemia (aporta ambos iones deficitarios)\n   • En casos severos y refractarios: cloruro de amonio o ácido clorhídrico diluido por vía central (raramente necesario)\n\n2️⃣ REDUCIR LAS PÉRDIDAS\n   • Inhibidor de bomba de protones para disminuir la pérdida de ácido clorhídrico gástrico\n   • Revisar la indicación y el débito de la sonda nasogástrica\n   • Ajustar o suspender diuréticos de asa si es posible\n\n3️⃣ ACETAZOLAMIDA\n   • Dosis de 250-500 mg por vía intravenosa u oral\n   • Inhibe la anhidrasa carbónica y promueve bicarbonaturia\n   • Especialmente útil cuando la alcalosis dificulta el destete ventilatorio y no se puede suspender el diurético\n   • ⚠ Vigilar hipokalemia y acidosis excesiva\n\n4️⃣ CORREGIR EL POTASIO\n   • La hipokalemia mantiene la alcalosis por intercambio renal de hidrogeniones por potasio\n   • Sin corregir el potasio, la alcalosis no se resuelve\n\n📋 SEGUIMIENTO:\n• Recalcular la diferencia Na⁻Cl y el cloro corregido cada 12-24 horas\n• Vigilar el efecto sobre el estímulo respiratorio si el paciente está en destete`);
    }
  }

  // ═══ VENOUS BLOOD GAS ═══
  if(scvo2!==null){R.calc.push({l:"ScvO2 (central)",v:`${scvo2}%`,f:"Normal 70-75%",c:scvo2<65?"#ef4444":scvo2>80?"#f59e0b":"#22c55e"});
    if(scvo2<65)R.interp.push({t:`ScvO2 ${scvo2}% BAJA (<65%): desequilibrio entre aporte y consumo de O2. Causas: bajo gasto cardíaco, anemia, hipoxemia, o ↑consumo (fiebre, agitación, trabajo respiratorio). Optimizar en ese orden`,c:"#ef4444"});
    else if(scvo2>80)R.interp.push({t:`ScvO2 ${scvo2}% ALTA (>80%): sugiere extracción tisular alterada — shunt microcirculatorio, disfunción mitocondrial (sepsis), o hipotermia. Paradójicamente se asocia a peor pronóstico en sepsis`,c:"#f59e0b"});
    else R.interp.push({t:`ScvO2 ${scvo2}% en rango normal (70-75%)`,c:"#22c55e"});}
  if(pvco2!==null&&paco2!==null){const gapCO2=pvco2-paco2;
    R.calc.push({l:"Gap venoarterial de CO2",v:`${gapCO2.toFixed(1)} mmHg`,f:"PvCO2−PaCO2 | normal <6",c:gapCO2>6?"#ef4444":"#22c55e"});
    if(gapCO2>6){R.interp.push({t:`Gap v-a CO2 ${gapCO2.toFixed(1)} >6 mmHg: indica FLUJO SANGUÍNEO INSUFICIENTE para remover el CO2 producido (relación inversa con gasto cardíaco según ecuación de Fick modificada). Sugiere gasto cardíaco inadecuado para las demandas metabólicas, incluso con ScvO2 normal`,c:"#ef4444"});
      R.act.push(`GAP v-a CO2 ELEVADO (${gapCO2.toFixed(1)} mmHg):\n• Marcador de gasto cardíaco insuficiente para la demanda\n• Puede estar elevado con ScvO2 NORMAL → mayor sensibilidad para detectar hipoperfusión residual\n• Acción: evaluar respuesta a volumen; si no responde, considerar inotrópicos\n• Complementar con ecocardiografía para medir gasto cardíaco\n• Meta: gap <6 mmHg`);}
    else R.interp.push({t:`Gap v-a CO2 ${gapCO2.toFixed(1)} mmHg normal (<6): flujo sanguíneo adecuado para el aclaramiento de CO2`,c:"#22c55e"});}
  if(scvo2!==null&&sao2!==null&&hb!==null&&pvco2!==null&&paco2!==null){
    const cao2=1.34*hb*(sao2/100)+0.003*(pao2||90);
    const cvo2=1.34*hb*(scvo2/100)+0.003*(pvo2||40);
    const cavo2=cao2-cvo2;const gapCO2b=pvco2-paco2;
    R.calc.push({l:"CaO2 (contenido arterial)",v:`${cao2.toFixed(1)} mL/dL`,f:"1.34×Hb×SaO2+0.003×PaO2",c:cao2<15?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Dif. arteriovenosa O2",v:`${cavo2.toFixed(1)} mL/dL`,f:"CaO2−CvO2 | normal 3.5-5.5",c:cavo2>5.5?"#f59e0b":"#22c55e"});
    if(cavo2>0){const rq=gapCO2b/cavo2;
      R.calc.push({l:"Cociente respiratorio (Pv-aCO2/Ca-vO2)",v:`${rq.toFixed(2)}`,f:"Normal <1.4",c:rq>1.4?"#ef4444":"#22c55e"});
      if(rq>1.4){R.alerts.push({lv:"warning",t:`Cociente Pv-aCO2/Ca-vO2 ${rq.toFixed(2)} >1.4 — sugiere metabolismo ANAERÓBICO`});
        R.interp.push({t:`COCIENTE RESPIRATORIO >1.4: marcador de metabolismo anaeróbico global. Cuando la producción de CO2 excede el consumo de O2 en esta proporción, hay generación anaeróbica de CO2 por buffer de protones. Predice mortalidad e identifica pacientes que aún se benefician de optimización hemodinámica, incluso con lactato en descenso`,c:"#ef4444"});}}}
  if(sao2!==null&&scvo2!==null){const ero2=((sao2-scvo2)/sao2*100);
    R.calc.push({l:"Tasa de extracción de O2",v:`${ero2.toFixed(0)}%`,f:"(SaO2−ScvO2)/SaO2 | normal 25-30%",c:ero2>35?"#ef4444":"#22c55e"});
    if(ero2>35)R.interp.push({t:`Extracción de O2 ${ero2.toFixed(0)}% >35%: los tejidos están compensando un aporte insuficiente aumentando la extracción. Indica reserva fisiológica agotándose`,c:"#ef4444"});}

  // ═══ VENTILATOR INTERVENTIONS FOR ACID-BASE ═══
  if(primaryDisorder&&(v.ventType==="invasive"||v.ventType==="niv")){
    const mvCurrent=(rr!==null&&vt!==null)?rr*(vt/1000):null;
    if(primaryDisorder==="resp_acidosis"||primaryDisorder==="mixed_acidosis"||primaryDisorder==="met_acidosis_resp_acid"){
      let txt=`🔧 CORREGIBLE CON EL VENTILADOR — ACIDOSIS RESPIRATORIA\n\nEl exceso de CO2 responde directamente al aumento de la ventilación alveolar:\n`;
      if(mvCurrent!==null&&paco2!==null){const targetMV=mvCurrent*paco2/40;const nRR=Math.ceil(targetMV/(vt/1000));const nVt=Math.round(targetMV*1000/rr);
        txt+=`\n• Volumen minuto actual: ${mvCurrent.toFixed(1)} L/min\n• VM necesario para PaCO2 → 40: ${targetMV.toFixed(1)} L/min\n`;
        if(mode==="volume")txt+=`\nOPCIÓN A: ↑FR de ${rr} a ~${nRR} rpm (mantener Vt ${vt} mL)\nOPCIÓN B: ↑Vt de ${vt} a ~${nVt} mL (mantener FR ${rr}) — verificar que ΔP y Pplat no excedan límites\n`;
        else txt+=`\nOPCIÓN A: ↑FR de ${rr} a ~${nRR} rpm\nOPCIÓN B: ↑presión sobre PEEP para aumentar el Vt resultante — vigilar Pplat\n`;}
      txt+=`\n⚠ PRECAUCIONES:\n• FR alta → riesgo de auto-PEEP: verificar con pausa espiratoria y curva de flujo\n• En SDRA: priorizar Vt protector y aceptar HIPERCAPNIA PERMISIVA si pH >7.20\n• Si ya hay Vt 6 mL/kg y ΔP ≤15: NO aumentar Vt, preferir ↑FR\n• Si FR >35 sin corregir CO2 y pH <7.15: considerar ECCO2R o ECMO\n• Descartar causas de ↑espacio muerto: TEP, sobredistensión por PEEP excesiva, bajo gasto`;
      R.act.push(txt);}
    if(primaryDisorder==="resp_alkalosis"||primaryDisorder==="mixed_alkalosis"){
      let txt=`🔧 CORREGIBLE CON EL VENTILADOR — ALCALOSIS RESPIRATORIA\n\nHiperventilación: reducir la ventilación minuto\n`;
      if(mvCurrent!==null&&paco2!==null){const targetMV=mvCurrent*paco2/40;const nRR=Math.max(8,Math.floor(targetMV/(vt/1000)));
        txt+=`\n• Volumen minuto actual: ${mvCurrent.toFixed(1)} L/min\n• VM necesario para PaCO2 → 40: ${targetMV.toFixed(1)} L/min\n• ↓FR de ${rr} a ~${nRR} rpm\n`;}
      txt+=`\n⚠ ANTES DE REDUCIR EL SOPORTE, DESCARTAR:\n• Dolor no controlado o ansiedad → analgesia/sedación\n• Acidosis metabólica compensatoria → NO reducir la FR (empeoraría el pH)\n• Hipoxemia → corregir oxigenación primero\n• Sepsis, dolor, fiebre → tratar causa\n• Lesión del SNC (hiperventilación central)\n• Si el paciente está en modo asistido: el drive respiratorio propio determina la FR real`;
      R.act.push(txt);}
    if(primaryDisorder==="met_acidosis"||primaryDisorder==="met_acidosis_resp_alk"){
      R.act.push(`⚠ NO CORREGIBLE PRIMARIAMENTE CON EL VENTILADOR — ACIDOSIS METABÓLICA\n\nEl ventilador solo COMPENSA, no corrige la causa:\n• La hiperventilación compensatoria es un mecanismo PROTECTOR — NO suprimirla\n• ⚠ CRÍTICO AL SEDAR/RELAJAR: si se abole el drive respiratorio sin ajustar la FR programada, el pH cae abruptamente\n• Al programar la FR en un paciente con acidosis metabólica: igualar o superar el volumen minuto espontáneo previo\n• Verificar con la fórmula de Winter que la PaCO2 alcanzada sea la esperada\n\nTRATAR LA CAUSA:\n• Lactato ↑ → optimizar perfusión (ver pestaña Hemodinamia)\n• Cetoacidosis → insulina + volumen\n• Uremia → considerar TRR\n• Intoxicación → antídoto específico\n• Hiperclorémica → cambiar a cristaloides balanceados`);}
    if(primaryDisorder==="met_alkalosis"){
      R.act.push(`⚠ NO CORREGIBLE CON EL VENTILADOR — ALCALOSIS METABÓLICA\n\n• La hipoventilación compensatoria es fisiológica, pero limitada (la PaCO2 rara vez sube >55 por el estímulo hipóxico)\n• ⚠ En destete: la alcalosis metabólica DEPRIME el drive respiratorio y dificulta la extubación\n\nCORREGIR LA CAUSA:\n• Pérdidas gástricas (SNG, vómito) → reponer cloro con SSN, considerar IBP\n• Diuréticos de asa → considerar acetazolamida 250-500 mg\n• Hipokalemia → corregir K⁺ (la alcalosis y la hipoK se perpetúan mutuamente)\n• Hipovolemia (alcalosis por contracción) → volumen con SSN\n• Exceso de bicarbonato → suspender aporte`);}}

  R.refs=[...new Set(R.refs)];return R;
}

/* ═══════════ TAB 3: BALANCES HÍDRICOS ═══════════ */
function calcBalance(v){
  const R={calc:[],interp:[],act:[],alerts:[],refs:[]};const n=k=>{const x=parseFloat(v[k]);return isNaN(x)?null:x;};
  const wt=n("weight"),wtAdm=n("weightAdmission"),temp=n("temp"),rr=n("rr"),hrs=n("balanceHours")||24;
  // Inputs
  const ivFluids=n("ivFluids")||0,oralIntake=n("oralIntake")||0,meds=n("medsVolume")||0,nutrition=n("nutritionVolume")||0,blood=n("bloodProducts")||0;
  const urine=n("urineOutput")||0,ngLoss=n("ngLoss")||0,drains=n("drainsLoss")||0,stool=n("stoolLoss")||0,other=n("otherLoss")||0;
  const cumBalance=n("cumulativeBalance");

  const totalIn=ivFluids+oralIntake+meds+nutrition+blood;
  const measuredOut=urine+ngLoss+drains+stool+other;

  if(totalIn>0||measuredOut>0){
    R.calc.push({l:"INGRESOS totales",v:`${totalIn.toFixed(0)} mL`,f:`IV+VO+fármacos+nutrición+hemoderivados (${hrs}h)`,c:"#3b82f6"});
    R.calc.push({l:"EGRESOS medibles",v:`${measuredOut.toFixed(0)} mL`,f:`Uresis+SNG+drenajes+heces+otros (${hrs}h)`,c:"#3b82f6"});}

  // Insensible losses
  let insensible=null;
  if(wt!==null){
    let baseRate=0.5; // mL/kg/h standard
    let adjustments=[];
    // Fever adjustment
    if(temp!==null&&temp>37){const excess=temp-37;baseRate+=0.1*excess*2;adjustments.push(`Fiebre ${temp}°C: +${(0.1*excess*2).toFixed(2)} mL/kg/h (~10-12% por °C)`);}
    // Tachypnea
    if(rr!==null&&rr>20&&v.ventType!=="invasive"){const excessRR=rr-20;baseRate+=excessRR*0.01;adjustments.push(`Taquipnea FR ${rr}: +${(excessRR*0.01).toFixed(2)} mL/kg/h`);}
    // Mechanical ventilation with humidification reduces respiratory losses
    if(v.ventType==="invasive"&&v.humidified==="yes"){baseRate-=0.15;adjustments.push(`VM con humidificación activa: −0.15 mL/kg/h (elimina pérdida respiratoria)`);}
    else if(v.ventType==="invasive"){adjustments.push(`VM sin humidificación activa: sin ajuste (pérdida respiratoria persiste)`);}
    // Open abdomen / burns
    if(v.openAbdomen==="yes"){baseRate+=0.5;adjustments.push(`Abdomen abierto: +0.5 mL/kg/h (evaporación peritoneal)`);}
    if(v.burns==="yes"){const bsa=n("burnBSA")||0;const burnLoss=(25+bsa)*1.73/24/wt;baseRate+=burnLoss;adjustments.push(`Quemaduras ${bsa}% SCT: +${burnLoss.toFixed(2)} mL/kg/h`);}
    if(v.sweating==="yes"){baseRate+=0.3;adjustments.push(`Diaforesis profusa: +0.3 mL/kg/h`);}

    insensible=baseRate*wt*hrs;
    R.calc.push({l:"Pérdidas insensibles",v:`${insensible.toFixed(0)} mL`,f:`${baseRate.toFixed(2)} mL/kg/h × ${wt}kg × ${hrs}h`,c:"#f59e0b"});
    if(adjustments.length>0)R.interp.push({t:`CÁLCULO DE PÉRDIDAS INSENSIBLES\n• Base: 0.5 mL/kg/h (≈12 mL/kg/día) — piel (2/3) + vía respiratoria (1/3)\n${adjustments.map(a=>"• "+a).join("\n")}\n• Total: ${baseRate.toFixed(2)} mL/kg/h → ${insensible.toFixed(0)} mL en ${hrs}h`,c:"#f59e0b"});
    else R.interp.push({t:`Pérdidas insensibles basales: 0.5 mL/kg/h (piel 2/3 + respiratorio 1/3). Sin factores modificadores registrados`,c:"#8ab0c0"});}

  // Balance calculation
  if((totalIn>0||measuredOut>0)&&insensible!==null){
    const totalOut=measuredOut+insensible;
    const balance=totalIn-totalOut;
    R.calc.push({l:"EGRESOS totales",v:`${totalOut.toFixed(0)} mL`,f:"Medibles + insensibles",c:"#3b82f6"});
    R.calc.push({l:`BALANCE (${hrs}h)`,v:`${balance>0?"+":""}${balance.toFixed(0)} mL`,f:"Ingresos − Egresos totales",c:Math.abs(balance)>1500?"#ef4444":Math.abs(balance)>750?"#f59e0b":"#22c55e"});
    if(wt!==null){R.calc.push({l:"Balance / kg",v:`${balance>0?"+":""}${(balance/wt).toFixed(1)} mL/kg`,f:"Balance÷Peso",c:"#8ab0c0"});
      R.calc.push({l:"Balance proyectado 24h",v:`${(balance/hrs*24)>0?"+":""}${(balance/hrs*24).toFixed(0)} mL`,f:"Extrapolación lineal",c:"#8ab0c0"});}

    // Urine output analysis
    if(wt!==null&&urine>0){const uop=urine/wt/hrs;
      R.calc.push({l:"Gasto urinario",v:`${uop.toFixed(2)} mL/kg/h`,f:`${urine}mL ÷ ${wt}kg ÷ ${hrs}h`,c:uop<0.5?"#ef4444":uop>3?"#f59e0b":"#22c55e"});
      if(uop<0.3){R.alerts.push({lv:"critical",t:`Oliguria severa ${uop.toFixed(2)} mL/kg/h — criterio KDIGO estadio 3 si >24h`});
        R.act.push(`OLIGURIA SEVERA (${uop.toFixed(2)} mL/kg/h):\n• Descartar obstrucción: verificar permeabilidad de la sonda vesical (lavado)\n• Evaluar volemia con métodos dinámicos (NO con PVC aislada)\n• Verificar presión de perfusión renal = PAM − PVC (meta >55-60 mmHg)\n• Medir presión intraabdominal si sospecha de síndrome compartimental (>20 mmHg)\n• Suspender nefrotóxicos e IECA/ARA-II\n• ⚠ NO administrar diuréticos para "forzar" diuresis sin evaluar volemia primero\n• Considerar prueba de estrés con furosemida (1 mg/kg si naive; 1.5 si expuesto) para estratificar riesgo de progresión`);}
      else if(uop<0.5)R.interp.push({t:`Gasto urinario ${uop.toFixed(2)} mL/kg/h por debajo de la meta (≥0.5). Criterio de LRA KDIGO si persiste 6-12h`,c:"#ef4444"});
      else if(uop>3)R.interp.push({t:`Poliuria ${uop.toFixed(2)} mL/kg/h: evaluar diuresis osmótica (hiperglucemia, manitol, contraste), diabetes insípida, fase poliúrica de recuperación de LRA, o sobrecarga hídrica previa en resolución`,c:"#f59e0b"});
      else R.interp.push({t:`Gasto urinario ${uop.toFixed(2)} mL/kg/h adecuado (meta ≥0.5)`,c:"#22c55e"});}

    // Balance interpretation and recommendations
    if(balance>1500){R.alerts.push({lv:"warning",t:`Balance positivo ${balance.toFixed(0)} mL en ${hrs}h — riesgo de sobrecarga`});
      R.act.push(`BALANCE MUY POSITIVO (+${balance.toFixed(0)} mL en ${hrs}h):\n\n• El balance acumulado positivo se asocia INDEPENDIENTEMENTE con mortalidad en sepsis y SDRA\n• SSC 2026 (nueva recomendación): sugiere REMOCIÓN ACTIVA de fluidos tras la fase de reanimación aguda\n\nACCIONES:\n• Revisar TODOS los aportes: diluciones de fármacos, lavados, nutrición — suelen ser la fuente oculta\n• Concentrar infusiones cuando sea posible\n• Si hemodinámicamente estable → diuréticos de asa (furosemida en bolo o infusión)\n• Meta de desescalada: balance neutro a negativo una vez resuelto el choque\n• Vigilar signos de congestión: líneas B en ultrasonido pulmonar, VExUS, edema periférico, ↑PVC\n• Si refractario a diuréticos + LRA → considerar ultrafiltración`);}
    else if(balance>750)R.interp.push({t:`Balance positivo moderado (+${balance.toFixed(0)} mL). Aceptable en fase de reanimación activa; requiere justificación si el choque ya está resuelto`,c:"#f59e0b"});
    else if(balance<-1500){R.alerts.push({lv:"warning",t:`Balance negativo ${balance.toFixed(0)} mL en ${hrs}h — vigilar hipovolemia`});
