      R.act.push(`BALANCE MUY NEGATIVO (${balance.toFixed(0)} mL en ${hrs}h):\n\n• Apropiado en fase de desescalada si hay sobrecarga previa documentada\n• PELIGROSO si el paciente aún está en fase de reanimación\n\nEVALUAR:\n• Signos de hipoperfusión: CRT >3s, lactato, moteado cutáneo, ↓gasto urinario\n• Respuesta a volumen con métodos dinámicos (PLR, PPV/SVV)\n• Función renal: ¿la diuresis excesiva está causando LRA prerrenal?\n• Electrolitos: la diuresis agresiva causa hipokalemia, hipomagnesemia, alcalosis por contracción\n• Si hay hipoperfusión → suspender diuréticos y reevaluar`);}
    else if(balance<-750)R.interp.push({t:`Balance negativo moderado (${balance.toFixed(0)} mL). Adecuado en fase de desescalada con monitoreo de perfusión`,c:"#f59e0b"});
    else R.interp.push({t:`Balance cercano a neutro (${balance>0?"+":""}${balance.toFixed(0)} mL). Objetivo razonable tras la fase de reanimación aguda`,c:"#22c55e"});}

  // Cumulative balance and fluid overload
  if(cumBalance!==null&&wtAdm!==null&&wtAdm>0){
    const pctOverload=(cumBalance/1000)/wtAdm*100;
    R.calc.push({l:"Balance acumulado",v:`${cumBalance>0?"+":""}${cumBalance.toFixed(0)} mL`,f:"Desde el ingreso",c:cumBalance>5000?"#ef4444":"#8ab0c0"});
    R.calc.push({l:"% Sobrecarga hídrica",v:`${pctOverload>0?"+":""}${pctOverload.toFixed(1)}%`,f:"(Balance acum. L ÷ peso ingreso) × 100",c:pctOverload>10?"#ef4444":pctOverload>5?"#f59e0b":"#22c55e"});
    if(pctOverload>10){R.alerts.push({lv:"critical",t:`Sobrecarga hídrica ${pctOverload.toFixed(1)}% — umbral asociado a mortalidad`});
      R.interp.push({t:`SOBRECARGA HÍDRICA >10%: umbral consistentemente asociado con mayor mortalidad, más días de ventilación mecánica, mayor incidencia y peor recuperación de LRA, y prolongación de estancia en UCI. Documentado en sepsis, SDRA y población pediátrica`,c:"#ef4444"});
      R.act.push(`SOBRECARGA HÍDRICA SIGNIFICATIVA (${pctOverload.toFixed(1)}%):\n\n• PRIORIDAD: desescalada activa de fluidos\n• Estrategia de las 4 fases (ROSE): Rescate → Optimización → Estabilización → Evacuación\n• Está en fase de EVACUACIÓN si el choque está resuelto\n\nHERRAMIENTAS:\n• Furosemida en infusión continua (mejor control que bolos en algunos escenarios)\n• Combinación con tiazida si resistencia diurética\n• Albúmina + furosemida si hipoalbuminemia severa (<2 g/dL)\n• Ultrafiltración si refractario o LRA avanzada\n\nMONITOREO:\n• Ultrasonido pulmonar seriado (líneas B) para evaluar agua pulmonar extravascular\n• VExUS para congestión venosa sistémica\n• Vigilar que la desescalada no comprometa perfusión (CRT, lactato)`);}
    else if(pctOverload>5)R.interp.push({t:`Sobrecarga hídrica ${pctOverload.toFixed(1)}%: por encima del rango neutro. Iniciar estrategia de desescalada si el choque está resuelto`,c:"#f59e0b"});}

  // Weight change
  if(wt!==null&&wtAdm!==null){const deltaW=wt-wtAdm;
    R.calc.push({l:"Cambio de peso",v:`${deltaW>0?"+":""}${deltaW.toFixed(1)} kg`,f:"Peso actual − peso al ingreso",c:Math.abs(deltaW)>5?"#ef4444":"#8ab0c0"});
    R.interp.push({t:`El cambio de peso es el estimador más confiable del balance real acumulado: 1 kg ≈ 1 L. Un aumento de ${deltaW.toFixed(1)} kg corresponde aproximadamente a ${(deltaW*1000).toFixed(0)} mL de retención. Compare con el balance calculado — las discrepancias sugieren errores de registro o pérdidas no contabilizadas`,c:"#8ab0c0"});}

  R.refs.push("Malbrain MLNG, et al. Principles of fluid management and stewardship in septic shock. Ann Intensive Care. 2018;8:66.","Prescott HC, et al. SSC 2026. ICM/CCM. 2026.");
  R.refs=[...new Set(R.refs)];return R;
}

/* ═══════════ TAB 4: ELECTROLITOS ═══════════ */
function calcElectro(v){
  const R={calc:[],interp:[],act:[],alerts:[],refs:[]};const n=k=>{const x=parseFloat(v[k]);return isNaN(x)?null:x;};
  const na=n("na"),k=n("k"),mg=n("mg"),ca=n("ca"),phos=n("phos"),cl=n("cl"),alb=n("alb"),hco3=n("hco3"),ph=n("ph"),wt=n("weight"),glu=n("glucose");
  const sex=v.sex,chronic=v.naChronicity;

  // ═══ SODIUM ═══
  if(na!==null){
    // Corrected Na for hyperglycemia
    let naCorr=na;
    if(glu!==null&&glu>100){naCorr=na+((glu-100)/100)*1.6;
      R.calc.push({l:"Na⁺ corregido por glucosa",v:`${naCorr.toFixed(1)} mEq/L`,f:"Na+1.6×((Glu−100)/100)",c:naCorr>145?"#ef4444":naCorr<135?"#f59e0b":"#22c55e"});
      R.interp.push({t:`Hiperglucemia ${glu} mg/dL: cada 100 mg/dL sobre 100 desplaza agua al espacio extracelular y diluye el Na⁺ ~1.6 mEq/L. El Na⁺ corregido (${naCorr.toFixed(1)}) refleja la osmolalidad real`,c:"#f59e0b"});}
    R.calc.push({l:"Na⁺ sérico",v:`${na} mEq/L`,f:"Normal 135-145",c:na>145?"#ef4444":na<135?"#f59e0b":"#22c55e"});

    if(wt!==null){
      const tbwFactor=sex==="f"?0.5:0.6;
      const tbw=wt*tbwFactor;
      R.calc.push({l:"Agua corporal total (ACT)",v:`${tbw.toFixed(1)} L`,f:`Peso × ${tbwFactor} (${sex==="f"?"mujer":"hombre"})`,c:"#8ab0c0"});

      // ══════ HYPERNATREMIA — fluid-by-fluid analysis ══════
      if(na>145){
        const waterDef=tbw*((na/140)-1);
        const maxDrop=chronic==="acute"?12:8;
        const hoursToCorrect=Math.ceil((na-140)/maxDrop*24);
        R.calc.push({l:"Déficit de agua libre",v:`${(waterDef*1000).toFixed(0)} mL`,f:"ACT×((Na/140)−1)",c:"#ef4444"});
        R.calc.push({l:"Descenso máximo permitido",v:`${maxDrop} mEq/L/24h`,f:chronic==="acute"?"Aguda <48h":"Crónica — riesgo de edema cerebral",c:"#ef4444"});
        R.calc.push({l:"Tiempo mínimo de corrección",v:`${hoursToCorrect} h`,f:"(Na actual−140) ÷ velocidad × 24",c:"#f59e0b"});
        R.alerts.push({lv:na>160?"critical":"warning",t:`Hipernatremia ${na} mEq/L${na>160?" SEVERA":""}`});

        // Adrogué-Madias for each fluid type (how much Na DROPS per liter)
        const fluids=[
          {n:"Agua libre (VO/SNG)",na:0,note:"Máxima eficacia. Vía de elección si el tracto GI funciona"},
          {n:"Glucosada 5% (SG5%)",na:0,note:"Equivale a agua libre. Vigilar hiperglucemia (empeora diuresis osmótica)"},
          {n:"Salina 0.45%",na:77,note:"Aporta volumen + agua libre. Útil si hay hipovolemia leve concomitante"},
          {n:"Salina 0.9% (SSN)",na:154,note:na>154?"Aún baja el Na porque el Na sérico es mayor. Para restaurar volumen primero":"NO corrige — su Na es mayor o igual al del paciente"},
          {n:"Ringer lactato",na:130,note:"Baja el Na más lento que la 0.45%. Preferible si hay acidosis hiperclorémica"},
        ];
        let fluidTable=`💧 DESCENSO DE Na⁺ POR CADA LITRO INFUNDIDO (Adrogué-Madias)\nFórmula: ΔNa = (Na_infusión − Na_sérico) ÷ (ACT + 1)\nACT del paciente: ${tbw.toFixed(1)} L\n`;
        fluids.forEach(f=>{
          const delta=(f.na-na)/(tbw+1);
          if(delta<0){
            const litersNeeded=(na-140)/Math.abs(delta);
            const rateMLh=(litersNeeded*1000)/hoursToCorrect;
            fluidTable+=`\n▸ ${f.n} (Na ${f.na} mEq/L)\n   ΔNa por litro: ${delta.toFixed(2)} mEq/L\n   Volumen para llegar a Na 140: ${(litersNeeded*1000).toFixed(0)} mL\n   Velocidad en ${hoursToCorrect}h: ${rateMLh.toFixed(0)} mL/h\n   ${f.note}\n`;
          } else {
            fluidTable+=`\n▸ ${f.n} (Na ${f.na} mEq/L)\n   ⚠ NO desciende el Na⁺ (ΔNa ${delta>0?"+":""}${delta.toFixed(2)})\n   ${f.note}\n`;
          }
        });
        R.act.push(fluidTable);

        R.act.push(`HIPERNATREMIA (Na⁺ ${na} mEq/L) — ${chronic==="acute"?"AGUDA <48h":"CRÓNICA >48h o desconocida"}\n\n📊 RESUMEN:\n• Agua corporal total: ${tbw.toFixed(1)} L\n• Déficit de agua libre: ${(waterDef*1000).toFixed(0)} mL\n• Velocidad máxima: ${maxDrop} mEq/L en 24 horas\n• Tiempo mínimo: ${hoursToCorrect} horas\n\n📋 SECUENCIA DE MANEJO:\n1️⃣ EVALUAR LA VOLEMIA PRIMERO\n   • Si hay HIPOVOLEMIA con inestabilidad → SSN 0.9% hasta restaurar la perfusión\n   • Corregir el sodio solo después de estabilizar el volumen circulante\n   • Si está EUVOLÉMICO o HIPERVOLÉMICO → ir directo a agua libre\n\n2️⃣ CALCULAR EL APORTE TOTAL DIARIO\n   • Déficit de agua libre: ${(waterDef*1000).toFixed(0)} mL\n   • MÁS pérdidas insensibles: ~${wt?(0.5*wt*24).toFixed(0):"—"} mL/día (0.5 mL/kg/h)\n   • MÁS diuresis del día previo\n   • MÁS pérdidas por SNG, drenajes, diarrea\n\n3️⃣ VÍA DE ADMINISTRACIÓN\n   • Preferir la vía enteral (agua libre por SNG) cuando el tracto GI funciona: más fisiológica, sin riesgo de sobrecarga de volumen\n   • IV con SG5% si no hay acceso enteral\n\n4️⃣ MONITOREO\n   • Na⁺ sérico cada 4-6 horas durante la corrección activa\n   • Recalcular si la velocidad real difiere de la esperada\n   • Vigilar glucemia si se usa SG5% (la hiperglucemia agrava la diuresis osmótica)\n\n⚠ RIESGO DE CORRECCIÓN RÁPIDA:\nEn hipernatremia crónica las neuronas acumulan osmolitos idiogénicos para equilibrar la osmolalidad. Bajar el Na⁺ rápidamente hace que entre agua a la célula → EDEMA CEREBRAL, convulsiones, herniación.\n\n🔍 BUSCAR LA CAUSA:\n• Pérdida de agua libre: diabetes insípida central o nefrogénica, diuresis osmótica (glucosa, manitol, urea), fiebre, quemaduras, taquipnea\n• Aporte insuficiente: sedación, alteración del estado mental, ausencia de acceso a agua, ancianos\n• Ganancia de sodio: NaHCO3, salina hipertónica, nutrición parenteral, ahogamiento en agua salada\n\n💡 Si hay POLIURIA con orina diluida: sospechar diabetes insípida → prueba con desmopresina para diferenciar central de nefrogénica`);}

      // ══════ HYPONATREMIA — SALSA protocol ══════
      if(na<135){
        const naDef=tbw*(135-na);
        const maxRise=chronic==="acute"?10:8;
        const adrogue3=(513-na)/(tbw+1);
        const rateFor=maxRise/adrogue3*1000/24;
        R.calc.push({l:"Déficit de sodio",v:`${naDef.toFixed(0)} mEq`,f:"ACT×(135−Na)",c:"#f59e0b"});
        R.calc.push({l:"Ascenso máximo permitido",v:`${maxRise} mEq/L/24h`,f:chronic==="acute"?"Aguda documentada <48h":"Crónica — riesgo de desmielinización",c:"#ef4444"});
        R.calc.push({l:"↑Na por litro de NaCl 3%",v:`${adrogue3.toFixed(2)} mEq/L`,f:"Adrogué-Madias: (513−Na)÷(ACT+1)",c:"#3b82f6"});
        R.calc.push({l:"Infusión continua NaCl 3%",v:`${rateFor.toFixed(0)} mL/h`,f:`Para ↑${maxRise} mEq/L en 24h`,c:"#3b82f6"});
        if(wt!==null){
          R.calc.push({l:"Bolo SALSA (2 mL/kg)",v:`${(2*wt).toFixed(0)} mL`,f:"NaCl 3% en 20 min",c:"#3b82f6"});
          R.calc.push({l:"↑Na esperado por bolo",v:`~${(adrogue3*2*wt/1000).toFixed(1)} mEq/L`,f:"Por cada bolo de 2 mL/kg",c:"#8ab0c0"});
          R.calc.push({l:"Infusión lenta SALSA",v:`${(0.5*wt).toFixed(0)} mL/h`,f:"0.5 mL/kg/h (síntomas moderados)",c:"#3b82f6"});
        }
        R.alerts.push({lv:na<125?"critical":"warning",t:`Hiponatremia ${na} mEq/L${na<125?" SEVERA":""}`});

        // Fluid comparison for hyponatremia
        const hypoFluids=[
          {n:"NaCl 3% (hipertónica)",na:513},
          {n:"NaCl 0.9% (SSN)",na:154},
          {n:"Ringer lactato",na:130},
        ];
        let hypoTable=`💧 ASCENSO DE Na⁺ POR CADA LITRO INFUNDIDO (Adrogué-Madias)\nFórmula: ΔNa = (Na_infusión − Na_sérico) ÷ (ACT + 1)\nACT del paciente: ${tbw.toFixed(1)} L\n`;
        hypoFluids.forEach(f=>{
          const delta=(f.na-na)/(tbw+1);
          hypoTable+=`\n▸ ${f.n} (Na ${f.na} mEq/L)\n   ΔNa por litro: ${delta>0?"+":""}${delta.toFixed(2)} mEq/L\n   Volumen para ↑${maxRise} mEq/L: ${delta>0?((maxRise/delta)*1000).toFixed(0)+" mL":"NO corrige"}\n   ${delta>0?`Velocidad segura: ${((maxRise/delta)*1000/24).toFixed(0)} mL/h`:"⚠ Su Na es menor o igual al del paciente"}\n`;
        });
        hypoTable+=`\n⚠ La fórmula NO contempla pérdidas urinarias concurrentes. En SIADH con orina concentrada la corrección puede ser más lenta; en diuresis acuosa (post-resolución de SIADH, insuficiencia suprarrenal tratada) puede ser MUCHO más rápida de lo calculado.`;
        R.act.push(hypoTable);

        R.act.push(`HIPONATREMIA (Na⁺ ${na} mEq/L) — ${chronic==="acute"?"AGUDA <48h":"CRÓNICA >48h o desconocida"}\n\n🚨 SI HAY SÍNTOMAS NEUROLÓGICOS GRAVES (convulsión, coma, herniación inminente):\n\n📌 PROTOCOLO DE BOLOS — Estudio SALSA (Baek, JAMA Intern Med 2021)\n• Bolo de NaCl 3% a 2 mL/kg${wt?` = ${(2*wt).toFixed(0)} mL`:""} administrado en 20 minutos\n• Repetir hasta 2 veces más si los síntomas persisten (total 3 bolos)\n• Meta inmediata: elevar el Na⁺ 4-6 mEq/L — suficiente para revertir el edema cerebral\n• Medir Na⁺ tras cada bolo\n\n📊 QUÉ DEMOSTRÓ SALSA (n=178, hiponatremia sintomática con Na ≤125):\n• Comparó bolos intermitentes rápidos vs infusión continua lenta\n• La sobrecorrección fue similar entre ambos (17.2% vs 24.2%, sin diferencia significativa)\n• Los BOLOS requirieron MENOS terapia de re-descenso (41.5% vs 57.5%, p=0.02)\n• Los bolos alcanzaron la meta terapéutica más rápido\n• Conclusión: los bolos intermitentes son al menos tan seguros y más prácticos\n\n📌 SI LOS SÍNTOMAS SON MODERADOS (náusea, confusión, cefalea):\n• Infusión continua de NaCl 3% a 0.5-1 mL/kg/h${wt?` = ${(0.5*wt).toFixed(0)}-${(1*wt).toFixed(0)} mL/h`:""}\n• O bolos de menor frecuencia con vigilancia estrecha\n• Velocidad calculada para este paciente: ${rateFor.toFixed(0)} mL/h\n\n📌 SI ES ASINTOMÁTICA Y CRÓNICA:\n• Corrección lenta orientada a la causa\n• Restricción hídrica si es SIADH (500-1000 mL/día)\n• NO usar salina hipertónica salvo Na muy bajo con riesgo inminente\n\n🚨 LÍMITES DE VELOCIDAD — NO NEGOCIABLES:\n• Máximo ${maxRise} mEq/L en 24 horas\n• Máximo 18 mEq/L en 48 horas\n• Superar estos límites → SÍNDROME DE DESMIELINIZACIÓN OSMÓTICA\n• La desmielinización aparece 2-6 días DESPUÉS de la sobrecorrección: cuadriparesia, disartria, disfagia, síndrome de enclaustramiento\n\n⚠ FACTORES DE ALTO RIESGO PARA DESMIELINIZACIÓN (usar límite de 8 mEq/L/24h o incluso 6):\n• Na⁺ ≤105 mEq/L\n• Alcoholismo\n• Desnutrición o hepatopatía avanzada\n• Hipokalemia (la corrección del K⁺ eleva el Na⁺ por sí sola)\n• Hipoxemia\n\n🔄 SI HAY SOBRECORRECCIÓN:\n• Desmopresina 2-4 μg IV cada 6-8 horas\n• Más SG5% a 3 mL/kg/h para "re-descender" el Na⁺\n• Meta: volver al límite de ascenso permitido\n• Estrategia proactiva alternativa: desmopresina desde el inicio + NaCl 3% controlado ("DDAVP clamp")\n\n📋 MONITOREO:\n• Na⁺ sérico cada 2 horas durante la fase aguda\n• Cada 4-6 horas en fase de mantenimiento\n• Vigilar diuresis: una diuresis acuosa súbita anuncia sobrecorrección inminente\n\n🔍 CLASIFICAR POR VOLEMIA Y OSMOLALIDAD URINARIA:\n• HIPOVOLÉMICA (Na urinario <20): pérdidas GI, diuréticos, tercer espacio → SSN 0.9%\n• EUVOLÉMICA (Na urinario >40, Osm urinaria >100): SIADH → restricción hídrica, urea, tolvaptán en casos seleccionados\n• HIPERVOLÉMICA: insuficiencia cardíaca, cirrosis, síndrome nefrótico → restricción hídrica + diurético de asa\n• Osm urinaria <100: polidipsia primaria o baja ingesta de solutos (potomanía) → restricción hídrica sola\n• PSEUDOHIPONATREMIA: hipertrigliceridemia severa, paraproteinemia → medir Na por potenciometría directa`);
        R.refs.push("Baek SH, et al. Bolos intermitentes rápidos vs infusión continua lenta de salina hipertónica (SALSA). JAMA Intern Med. 2021;181(1):81-92.","Adrogué HJ, Madias NE. Hyponatremia. NEJM. 2000;342(21):1581-1589.");}
    }
  }

  // ══════ IONIZED CALCIUM ══════
  const caIon=n("caIonized");const caIonUnit=v.caIonUnit||"mmol";
  if(caIon!==null){
    const caIonMmol=caIonUnit==="mmol"?caIon:caIon/4.008;
    const caIonMgdl=caIonUnit==="mgdl"?caIon:caIon*4.008;
    R.calc.push({l:"Calcio iónico",v:`${caIonMmol.toFixed(2)} mmol/L`,f:"Normal 1.10-1.30 mmol/L",c:caIonMmol<1.10?"#ef4444":caIonMmol>1.35?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Calcio iónico (conversión)",v:`${caIonMgdl.toFixed(2)} mg/dL`,f:"mg/dL = mmol/L × 4.008 | Normal 4.4-5.2",c:caIonMgdl<4.4?"#ef4444":caIonMgdl>5.4?"#f59e0b":"#22c55e"});
    R.interp.push({t:`CONVERSIÓN DE UNIDADES DEL CALCIO IÓNICO\n• De mmol/L a mg/dL: multiplicar por 4.008\n• De mg/dL a mmol/L: dividir entre 4.008\n• Valor ingresado: ${caIon} ${caIonUnit==="mmol"?"mmol/L":"mg/dL"} = ${caIonMmol.toFixed(2)} mmol/L = ${caIonMgdl.toFixed(2)} mg/dL\n\n📌 El calcio iónico representa la fracción biológicamente ACTIVA (~50% del calcio total). Es el parámetro de elección en el paciente crítico porque no depende de la albúmina ni de las fórmulas de corrección, que son poco confiables en UCI`,c:"#3b82f6"});

    // pH effect
    if(ph!==null){const phDelta=7.40-ph;const caCorrPh=caIonMmol+(phDelta*0.2);
      if(Math.abs(phDelta)>0.05){R.calc.push({l:"Ca iónico ajustado a pH 7.40",v:`${caCorrPh.toFixed(2)} mmol/L`,f:"±0.2 mmol/L por cada 0.1 de pH",c:"#8ab0c0"});
        R.interp.push({t:`EFECTO DEL pH SOBRE EL CALCIO IÓNICO\n• pH actual ${ph.toFixed(2)} (desviación de ${phDelta>0?"−":"+"}${Math.abs(phDelta).toFixed(2)} respecto a 7.40)\n• La ALCALOSIS aumenta la unión del calcio a la albúmina → BAJA el calcio iónico\n• La ACIDOSIS libera calcio de la albúmina → SUBE el calcio iónico\n• Regla: cada 0.1 unidades de cambio en el pH modifica el Ca iónico ~0.2 mmol/L en sentido inverso\n• ${ph<7.35?"En este paciente acidótico, el calcio iónico puede caer al corregir la acidosis — vigilar tras administrar bicarbonato":"En este paciente alcalótico, parte de la hipocalcemia puede ser funcional por la alcalosis"}`,c:"#f59e0b"});}}

    if(caIonMmol<1.10){
      const severity=caIonMmol<0.90?"SEVERA":caIonMmol<1.00?"MODERADA":"LEVE";
      R.alerts.push({lv:caIonMmol<0.90?"critical":"warning",t:`Hipocalcemia iónica ${severity} (${caIonMmol.toFixed(2)} mmol/L)`});
      const gluconateBolus=wt?Math.min(30,Math.max(10,wt*0.2)):15;
      const elementalRate=wt?(0.5*wt).toFixed(0):"—";
      const elementalRateMax=wt?(2*wt).toFixed(0):"—";
      R.act.push(`HIPOCALCEMIA IÓNICA ${severity} — ${caIonMmol.toFixed(2)} mmol/L (${caIonMgdl.toFixed(2)} mg/dL)\n\n📊 CLASIFICACIÓN POR SEVERIDAD:\n• Leve: 1.00-1.09 mmol/L (4.0-4.3 mg/dL)\n• Moderada: 0.90-0.99 mmol/L (3.6-3.9 mg/dL)\n• Severa: <0.90 mmol/L (<3.6 mg/dL) — riesgo de arritmia, tetania, convulsiones\n\n💉 PREPARADOS DISPONIBLES:\n\n▸ GLUCONATO DE CALCIO 10%\n   • Ampolla de 10 mL = 1 g de sal = 93 mg de calcio elemental = 4.65 mEq\n   • Seguro por vía PERIFÉRICA (menor riesgo de necrosis si extravasa)\n   • Requiere metabolismo hepático para liberar el calcio — menos eficaz en falla hepática\n   • ES LA PRIMERA OPCIÓN en la mayoría de los escenarios\n\n▸ CLORURO DE CALCIO 10%\n   • Ampolla de 10 mL = 1 g de sal = 273 mg de calcio elemental = 13.6 mEq\n   • Aporta TRES VECES más calcio elemental que el gluconato\n   • SOLO POR VÍA CENTRAL — causa necrosis tisular severa si extravasa\n   • Preferido en paro cardíaco, hiperkalemia con cambios en ECG, o cuando se requiere efecto inmediato\n\n⚡ TRATAMIENTO AGUDO (sintomática o Ca iónico <0.90):\n• Gluconato de calcio 10%: ${gluconateBolus.toFixed(0)} mL (${(gluconateBolus/10).toFixed(1)} g) diluidos en 100 mL de SG5% o SSN, a pasar en 10-20 minutos\n• O cloruro de calcio 10%: 5-10 mL por vía central en 10 minutos\n• Efecto transitorio (1-2 horas): SIEMPRE continuar con infusión de mantenimiento\n\n🔄 BOMBA DE INFUSIÓN CONTINUA (mantenimiento):\n\n📌 PREPARACIÓN ESTÁNDAR:\n• 10 ampollas de gluconato de calcio 10% (100 mL = 10 g de sal = 930 mg de calcio elemental)\n• Diluir en SG5% o SSN hasta completar 1000 mL\n• Concentración resultante: ~0.93 mg de calcio elemental por mL\n\n📌 DOSIFICACIÓN:\n• Meta: 0.5 a 2 mg/kg/h de CALCIO ELEMENTAL\n• Para este paciente: ${elementalRate} a ${elementalRateMax} mg/h de calcio elemental\n• Con la preparación estándar (0.93 mg/mL): ${wt?`${(0.5*wt/0.93).toFixed(0)} a ${(2*wt/0.93).toFixed(0)} mL/h`:"—"}\n• Iniciar en la dosis baja y titular según el calcio iónico\n\n📌 PREPARACIÓN ALTERNATIVA CONCENTRADA (restricción de volumen):\n• 6 ampollas de gluconato 10% (60 mL = 558 mg de calcio elemental) en 500 mL\n• Concentración: ~1.12 mg/mL\n\n⚠ PRECAUCIONES CON LA INFUSIÓN:\n• NUNCA mezclar con soluciones que contengan bicarbonato o fosfato → precipitación\n• Vía exclusiva o lavar la línea antes y después\n• Vigilar el sitio de infusión (extravasación)\n• Monitoreo cardíaco continuo si hay hipocalcemia severa o infusión rápida\n• Precaución extrema en pacientes digitalizados: el calcio potencia la toxicidad digitálica\n\n📋 MONITOREO:\n• Calcio iónico cada 4-6 horas durante la titulación\n• Magnesio: la hipomagnesemia hace REFRACTARIA la corrección del calcio — corregir primero\n• Fósforo: vigilar el producto calcio × fósforo (riesgo de calcificación si >70)\n• ECG: el QTc prolongado se acorta al corregir\n\n🔍 CAUSAS EN EL PACIENTE CRÍTICO:\n• Sepsis (muy frecuente, mecanismo multifactorial)\n• Transfusión masiva o TRR con citrato regional → quelación del calcio\n• Pancreatitis aguda (saponificación de la grasa peripancreática)\n• Rabdomiólisis (depósito de calcio en músculo lesionado)\n• Lesión renal aguda (↓1,25-dihidroxivitamina D, hiperfosfatemia)\n• Hipoparatiroidismo post-quirúrgico (tiroidectomía, paratiroidectomía)\n• Hipomagnesemia\n• Alcalosis respiratoria (hiperventilación) — hipocalcemia funcional\n• Fármacos: bifosfonatos, denosumab, foscarnet, cinacalcet\n\n🔬 SIGNOS CLÍNICOS A BUSCAR:\n• Signo de Chvostek: percusión del nervio facial → contracción peribucal (baja especificidad, presente en 10-25% de sanos)\n• Signo de Trousseau: espasmo carpopedal al inflar el manguito 20 mmHg sobre la sistólica por 3 minutos (más específico)\n• Parestesias peribucales y en extremidades, calambres, tetania\n• Laringoespasmo, broncoespasmo\n• ECG: QTc prolongado → riesgo de torsades de pointes\n• Hipotensión refractaria a vasopresores (el calcio es necesario para la contracción miocárdica y vascular)`);}

    if(caIonMmol>1.35){
      R.alerts.push({lv:caIonMmol>1.50?"critical":"warning",t:`Hipercalcemia iónica ${caIonMmol.toFixed(2)} mmol/L`});
      R.act.push(`HIPERCALCEMIA IÓNICA (${caIonMmol.toFixed(2)} mmol/L = ${caIonMgdl.toFixed(2)} mg/dL)\n\n💧 TRATAMIENTO ESCALONADO:\n\n1️⃣ HIDRATACIÓN — la base del tratamiento\n   • SSN 0.9% a 200-300 mL/h inicialmente\n   • La hipercalcemia causa diabetes insípida nefrogénica → los pacientes llegan profundamente depletados\n   • Meta de diuresis: 100-150 mL/h\n\n2️⃣ DIURÉTICO DE ASA — solo DESPUÉS de restaurar la euvolemia\n   • Furosemida 20-40 mg IV\n   • ⚠ NO usar como primera línea: si el paciente está hipovolémico, empeora la hipercalcemia\n\n3️⃣ BIFOSFONATOS — para hipercalcemia por malignidad\n   • Ácido zoledrónico 4 mg IV en 15 minutos\n   • Inicio del efecto en 24-48 horas, pico a los 4-7 días\n   • Ajustar dosis si hay lesión renal\n\n4️⃣ CALCITONINA — efecto rápido pero transitorio\n   • 4 UI/kg SC o IM cada 12 horas\n   • Inicio en 4-6 horas (el más rápido de los agentes hipocalcemiantes)\n   • Taquifilaxia en 48 horas — sirve como puente hasta que actúen los bifosfonatos\n\n5️⃣ DENOSUMAB — si hay lesión renal o refractariedad a bifosfonatos\n   • 120 mg SC — no requiere ajuste renal\n\n6️⃣ CORTICOIDES — si la causa es linfoma, mieloma, sarcoidosis o intoxicación por vitamina D\n   • Prednisona 40-60 mg/día o equivalente\n\n7️⃣ HEMODIÁLISIS con baño bajo en calcio\n   • Para crisis hipercalcémica con compromiso vital o lesión renal avanzada\n\n⚠ SUSPENDER: aportes de calcio, vitamina D, tiazidas, litio, teofilina\n\n🔍 CAUSAS: malignidad (PTHrP, metástasis óseas, mieloma), hiperparatiroidismo primario, inmovilización prolongada, intoxicación por vitamina D o A, enfermedades granulomatosas, síndrome leche-álcali, feocromocitoma`);}
  }

  // ═══ POTASSIUM ═══
  if(k!==null){
    R.calc.push({l:"K⁺ sérico",v:`${k} mEq/L`,f:"Normal 3.5-5.0 | Meta UCI 4.0-4.5",c:k>5.5?"#ef4444":k<3.5?"#f59e0b":"#22c55e"});
    if(k<3.5&&wt!==null){
      const deficit=k<2.5?(3.5-k)*wt*4.5:(3.5-k)*wt*3;
      R.calc.push({l:"Déficit de K⁺ estimado",v:`${deficit.toFixed(0)} mEq`,f:"Cada ↓0.3 mEq/L ≈ 100 mEq de déficit corporal",c:k<2.5?"#ef4444":"#f59e0b"});
      R.calc.push({l:"Tiempo de reposición (periférica)",v:`${Math.ceil(deficit/20)} h`,f:"A 20 mEq/h máximo",c:"#8ab0c0"});
      R.alerts.push({lv:k<2.5?"critical":"warning",t:`Hipokalemia ${k} mEq/L${k<2.5?" SEVERA — riesgo de arritmia ventricular":""}`});
      R.act.push(`HIPOKALEMIA (K⁺ ${k} mEq/L)\n\n📊 DÉFICIT ESTIMADO: ${deficit.toFixed(0)} mEq\n• Regla: cada descenso de 0.3 mEq/L ≈ 100 mEq de déficit corporal total\n• Relación no lineal: a menor K⁺ sérico, mayor déficit proporcional\n\n💉 VÍAS Y VELOCIDADES MÁXIMAS:\n• Vía periférica: 10-20 mEq/h (concentración máx 40 mEq/L) — dolor y flebitis limitan\n• Vía central: hasta 40 mEq/h con monitoreo ECG continuo (concentración hasta 80-100 mEq/L)\n• Vía oral: preferida si tolera y K⁺ >2.5 — KCl 40-80 mEq/día divididos\n\n${k<2.5?"🚨 K⁺ <2.5 — REPOSICIÓN URGENTE:\n• Monitoreo cardíaco continuo obligatorio\n• Vía central preferida\n• Riesgo de arritmia ventricular, torsades, paro\n• Buscar cambios en ECG: onda U, aplanamiento de T, ↓ST, prolongación de QT\n\n":""}⚠ VERIFICAR MAGNESIO SIEMPRE:\n• La hipomagnesemia causa pérdida renal de K⁺ y hace REFRACTARIA la corrección\n• Si Mg²⁺ <1.8 mg/dL: corregir el magnesio PRIMERO o simultáneamente\n\n📋 MONITOREO:\n• Cada 10 mEq IV eleva el K⁺ ~0.1 mEq/L (alta variabilidad individual)\n• Control de K⁺ cada 2-4 horas durante reposición agresiva\n• Meta en paciente crítico: 4.0-4.5 mEq/L (mayor que en paciente estable)\n\n🔍 CAUSAS EN UCI:\n• Redistribución: alcalosis, insulina, β2-agonistas, refeeding\n• Pérdida renal: diuréticos de asa/tiazidas, hipomagnesemia, anfotericina, hiperaldosteronismo\n• Pérdida GI: diarrea, SNG, vómito\n• Aporte insuficiente`);}
    if(k>5.5){
      R.alerts.push({lv:k>6.5?"critical":"warning",t:`Hiperkalemia ${k} mEq/L${k>6.5?" — EMERGENCIA MÉDICA":""}`});
      R.act.push(`HIPERKALEMIA (K⁺ ${k} mEq/L)\n\n${k>6.5?`🚨 EMERGENCIA — PROTOCOLO INMEDIATO:\n\n1️⃣ ECG DE 12 DERIVACIONES AHORA\n   • Buscar: ondas T picudas → PR prolongado → pérdida de onda P → QRS ancho → onda sinusoidal → paro\n\n2️⃣ ESTABILIZAR LA MEMBRANA CARDÍACA (si hay cambios en ECG)\n   • Gluconato de calcio 10%: 10 mL IV en 2-3 minutos\n   • O cloruro de calcio 10%: 5-10 mL IV por vía central (3× más calcio elemental)\n   • Inicio: 1-3 min | Duración: 30-60 min | Repetir si persisten cambios\n   • ⚠ NO baja el K⁺ — solo protege el corazón\n\n`:""}3️⃣ REDISTRIBUIR EL K⁺ AL INTRACELULAR\n   • Insulina regular 10 U IV + Dextrosa 50% 50 mL (25 g)\n     → ↓K⁺ 0.5-1.0 mEq/L | Inicio 15-30 min | Duración 4-6 h\n     → Vigilar glucemia horaria por 6h (riesgo de hipoglucemia tardía)\n     → Si glucemia >250: insulina sin dextrosa\n   • Salbutamol nebulizado 10-20 mg (dosis alta, 4-8× la broncodilatadora)\n     → ↓K⁺ 0.5-1.0 mEq/L | Inicio 30 min | Efecto aditivo con insulina\n     → ~20% de pacientes no responden\n   • Bicarbonato de sodio: SOLO si acidosis metabólica concomitante\n     → Efecto modesto e inconsistente como monoterapia\n\n4️⃣ ELIMINAR EL K⁺ DEL ORGANISMO\n   • Furosemida 40-80 mg IV (si función renal preservada y euvolemia)\n   • Quelantes:\n     → Ciclosilicato de sodio y zirconio (SZC): inicio 1h, bien tolerado\n     → Patiromer: inicio 7h, para manejo crónico\n     → Poliestireno sulfonato (Kayexalato): eficacia cuestionada, riesgo de necrosis intestinal con sorbitol\n   • HEMODIÁLISIS: método más rápido y definitivo\n     → Indicada si: K⁺ >6.5 refractario, LRA oligúrica, cambios ECG persistentes, sobrecarga\n\n📋 MEDIDAS ADICIONALES:\n• Suspender: IECA/ARA-II, espironolactona, AINEs, heparina, trimetoprim, β-bloqueadores\n• Revisar aportes ocultos: nutrición, hemoderivados almacenados, penicilina G potásica\n• Descartar pseudohiperkalemia: hemólisis de la muestra, trombocitosis, leucocitosis extrema\n• Buscar causa: LRA, rabdomiólisis, lisis tumoral, acidosis, hipoaldosteronismo\n\n🎯 META: K⁺ <5.5 mEq/L con ECG normalizado`);}
  }

  // ═══ MAGNESIUM ═══
  if(mg!==null){
    R.calc.push({l:"Mg²⁺ sérico",v:`${mg} mg/dL`,f:"Normal 1.8-2.4 | Meta UCI >2.0",c:mg<1.8?"#f59e0b":mg>2.5?"#f59e0b":"#22c55e"});
    if(mg<1.8){
      R.alerts.push({lv:mg<1.2?"critical":"warning",t:`Hipomagnesemia ${mg} mg/dL${mg<1.2?" SEVERA":""}`});
      R.act.push(`HIPOMAGNESEMIA (Mg²⁺ ${mg} mg/dL)\n\n${mg<1.2?`🚨 SEVERA (<1.2 mg/dL) — riesgo de torsades de pointes, convulsiones, arritmias\n• Sulfato de magnesio 2-4 g IV en 15-60 minutos\n• Seguido de 4-8 g en infusión de 24 horas\n• Monitoreo cardíaco continuo\n\n`:`• Sulfato de magnesio 1-2 g IV en 1-2 horas\n• O vía oral 400-800 mg/día de óxido/citrato de magnesio (limitado por diarrea)\n\n`}⚠ EFECTO EN CASCADA — LA HIPOMAGNESEMIA CAUSA:\n• Hipokalemia REFRACTARIA (pérdida renal de K⁺ que no corrige hasta reponer Mg)\n• Hipocalcemia refractaria (↓liberación y resistencia a PTH)\n• Por eso: SIEMPRE corregir el Mg²⁺ antes o junto con K⁺ y Ca²⁺\n\n📋 MONITOREO:\n• El Mg²⁺ sérico refleja solo el 1% del contenido corporal — puede haber déficit con nivel normal\n• Control cada 6-12 horas durante reposición\n• En LRA: reducir dosis 50% y vigilar hipermagnesemia (arreflexia, depresión respiratoria)\n• Meta en UCI: >2.0 mg/dL\n\n🔍 CAUSAS EN UCI:\n• Diuréticos de asa y tiazidas\n• Alcoholismo, desnutrición, refeeding\n• Diarrea, aspiración por SNG, fístulas\n• Anfotericina B, aminoglucósidos, cisplatino, inhibidores de bomba de protones (crónico)\n• Poliuria post-obstructiva o fase de recuperación de LRA`);}
    if(mg>2.5)R.interp.push({t:`Hipermagnesemia ${mg} mg/dL: común en LRA con aporte de Mg. Vigilar arreflexia (>4), depresión respiratoria (>8), bloqueo cardíaco (>10). Suspender aportes; si es severa: gluconato de calcio + diuresis forzada o diálisis`,c:"#f59e0b"});
  }

  // ═══ CALCIUM ═══
  if(ca!==null){
    R.calc.push({l:"Ca²⁺ total",v:`${ca} mg/dL`,f:"Normal 8.5-10.5",c:ca<8.5?"#f59e0b":ca>10.5?"#f59e0b":"#22c55e"});
    if(alb!==null){const caC=ca+0.8*(4-alb);
      R.calc.push({l:"Ca²⁺ corregido por albúmina",v:`${caC.toFixed(1)} mg/dL`,f:"Ca+0.8×(4−Albúmina)",c:caC<8.5?"#f59e0b":caC>10.5?"#f59e0b":"#22c55e"});
      R.interp.push({t:`⚠ La corrección por albúmina es POCO CONFIABLE en el paciente crítico. En UCI se recomienda medir CALCIO IÓNICO directamente (valor normal 1.10-1.30 mmol/L), especialmente con alteraciones del pH, transfusión masiva (quelación por citrato) o hipoalbuminemia severa`,c:"#f59e0b"});
      if(caC<8.5)R.act.push(`HIPOCALCEMIA (Ca²⁺ corregido ${caC.toFixed(1)} mg/dL)\n\n💉 REPOSICIÓN:\n• SINTOMÁTICA (tetania, convulsiones, laringoespasmo, QTc prolongado, hipotensión refractaria):\n  → Gluconato de calcio 10%: 10-20 mL IV en 10-20 minutos (vía periférica segura)\n  → O cloruro de calcio 10%: 5-10 mL IV por vía CENTRAL únicamente (necrosis si extravasa)\n• MANTENIMIENTO: gluconato de calcio 10% 60 mL en 500 mL de SG5% a 50 mL/h\n\n🔬 SIGNOS CLÍNICOS:\n• Chvostek (percusión del facial → contracción peribucal)\n• Trousseau (espasmo carpal con manguito inflado 3 min) — más específico\n• Parestesias peribucales y distales, calambres\n• ECG: QTc prolongado → riesgo de torsades\n\n⚠ CORREGIR PRIMERO EL MAGNESIO si está bajo (la hipoMg causa hipoCa refractaria)\n\n🔍 CAUSAS EN UCI:\n• Sepsis (muy frecuente, mecanismo multifactorial)\n• Transfusión masiva (quelación por citrato)\n• Pancreatitis aguda (saponificación)\n• LRA (↓1,25-OH vitamina D, hiperfosfatemia)\n• Post-tiroidectomía/paratiroidectomía\n• Alcalosis (↑unión a albúmina, ↓fracción ionizada)\n• Fármacos: bifosfonatos, foscarnet, cinacalcet`);
      if(caC>10.5)R.act.push(`HIPERCALCEMIA (Ca²⁺ corregido ${caC.toFixed(1)} mg/dL)\n\n💧 TRATAMIENTO ESCALONADO:\n• 1º HIDRATACIÓN: SSN 0.9% 200-300 mL/h (la hipercalcemia causa diabetes insípida nefrogénica y depleción de volumen)\n• 2º Furosemida SOLO tras restaurar euvolemia (no como primera línea)\n• 3º Bifosfonatos: ácido zoledrónico 4 mg IV (inicio 24-48h, pico 4-7 días)\n• 4º Calcitonina 4 UI/kg SC/IM c/12h (inicio rápido 4-6h pero taquifilaxia en 48h)\n• 5º Denosumab si refractario o LRA (no requiere ajuste renal)\n• 6º Corticoides si etiología por linfoma, mieloma o intoxicación por vitamina D\n• 7º Hemodiálisis con baño bajo en calcio si crisis hipercalcémica o LRA\n\n🔍 CAUSAS: malignidad (PTHrP, metástasis óseas), hiperparatiroidismo primario, inmovilización prolongada, intoxicación por vitamina D, sarcoidosis, tiazidas, litio`);}
  }

  // ═══ PHOSPHATE ═══
  if(phos!==null){
    R.calc.push({l:"Fósforo sérico",v:`${phos} mg/dL`,f:"Normal 2.5-4.5",c:phos<2.5?"#f59e0b":phos>4.5?"#f59e0b":"#22c55e"});
    if(phos<2.5&&wt!==null){
      const dose=phos<1?0.5:phos<2?0.32:0.16;
      R.calc.push({l:"Dosis de fosfato sugerida",v:`${(dose*wt).toFixed(1)} mmol`,f:`${dose} mmol/kg IV en 6h`,c:"#3b82f6"});
      R.alerts.push({lv:phos<1?"critical":"warning",t:`Hipofosfatemia ${phos} mg/dL${phos<1?" SEVERA":""}`});
      R.act.push(`HIPOFOSFATEMIA (P ${phos} mg/dL)\n\n${phos<1?`🚨 SEVERA (<1 mg/dL) — CONSECUENCIAS GRAVES:\n• Debilidad diafragmática → falla ventilatoria y FRACASO EN EL DESTETE del ventilador\n• Rabdomiólisis\n• Hemólisis (↓2,3-DPG y ATP eritrocitario)\n• Disfunción miocárdica\n• Encefalopatía, convulsiones\n• Disfunción leucocitaria y plaquetaria\n\n`:""}💉 REPOSICIÓN IV:\n• Dosis: ${dose} mmol/kg = ${(dose*wt).toFixed(1)} mmol en 6 horas\n• Fosfato de potasio: si el K⁺ también está bajo (aporta 1.5 mEq K por mmol de P)\n• Fosfato de sodio: si el K⁺ es normal o alto\n• Velocidad máxima: 7.5 mmol/h (riesgo de hipocalcemia y arritmia si más rápido)\n\n📋 MONITOREO:\n• Vigilar Ca²⁺ durante la reposición (el fosfato quela el calcio)\n• ⚠ Producto Ca × P >70 → riesgo de calcificación metastásica\n• Control de P cada 6-12 horas\n• Precaución en LRA: reducir dosis 50%\n\n🔍 CAUSAS EN UCI:\n• SÍNDROME DE REALIMENTACIÓN (la causa más importante y prevenible)\n• Cetoacidosis diabética en tratamiento (con insulina el P entra a la célula)\n• Alcalosis respiratoria (desplazamiento intracelular)\n• Sepsis\n• Terapia de reemplazo renal continua\n• Diuréticos, antiácidos quelantes de fosfato\n• Alcoholismo crónico`);}
    if(phos>4.5&&ca!==null){const prod=ca*phos;
      R.calc.push({l:"Producto Ca × P",v:`${prod.toFixed(0)} mg²/dL²`,f:"Riesgo de calcificación si >70",c:prod>70?"#ef4444":"#22c55e"});
      if(prod>70)R.alerts.push({lv:"warning",t:`Producto Ca×P ${prod.toFixed(0)} >70 — riesgo de calcificación metastásica`});}
  }

  // ═══ CHLORIDE & BICARBONATE ═══
  if(cl!==null&&na!==null){const naClD=na-cl;const clC=cl*(140/na);
    R.calc.push({l:"Diferencia Na⁻Cl",v:`${naClD.toFixed(0)} mEq/L`,f:"Na−Cl | Normal 32-40",c:naClD<30?"#ef4444":naClD>40?"#f59e0b":"#22c55e"});
    R.calc.push({l:"Cloro corregido",v:`${clC.toFixed(1)} mEq/L`,f:"Cl×(140÷Na) | Normal 100-110",c:clC>110?"#ef4444":clC<98?"#f59e0b":"#22c55e"});
    if(naClD<32||clC>110)R.interp.push({t:`Diferencia Na⁻Cl ${naClD.toFixed(0)} con cloro corregido ${clC.toFixed(1)}: patrón de hipercloremia con capacidad acidificante. La SSC 2026 recomienda cristaloides balanceados sobre salina 0.9% con certeza moderada. 👉 El análisis completo del índice sodio-cloro, con su interpretación ácido-base e intervenciones detalladas, está en la pestaña de Ventilación, sección de gasometría arterial`,c:"#f59e0b"});
    if(naClD>40||clC<98)R.interp.push({t:`Diferencia Na⁻Cl ${naClD.toFixed(0)} con cloro corregido ${clC.toFixed(1)}: patrón de hipocloremia asociado a alcalosis metabólica. Recordar que deprime el estímulo respiratorio y dificulta el destete. 👉 Conducta detallada en la pestaña de Ventilación, sección de gasometría arterial`,c:"#f59e0b"});}

  if(hco3!==null&&ph!==null&&wt!==null){
    R.calc.push({l:"HCO3⁻ sérico",v:`${hco3} mEq/L`,f:"Normal 22-26",c:hco3<22?"#f59e0b":hco3>26?"#f59e0b":"#22c55e"});
    if(ph<=7.20&&hco3<15){
      const biDef=0.5*wt*(15-hco3);
      R.calc.push({l:"Déficit de HCO3⁻ (a meta 15)",v:`${biDef.toFixed(0)} mEq`,f:"0.5×Peso×(15−HCO3)",c:"#ef4444"});
      R.calc.push({l:"Volumen NaHCO3 4.2%",v:`${(biDef/0.5).toFixed(0)} mL`,f:"500 mEq/L = 0.5 mEq/mL",c:"#3b82f6"});
      R.act.push(`ACIDOSIS METABÓLICA SEVERA (pH ${ph.toFixed(2)}, HCO3 ${hco3})\n\n📊 DÉFICIT: ${biDef.toFixed(0)} mEq (meta HCO3 15 — NO normalizar a 24)\n\n⚖️ EVIDENCIA ACTUAL — ¿DAR BICARBONATO?\n• BICAR-ICU (Jaber, Lancet 2018, n=389): sin beneficio global, PERO el subgrupo con LRA AKIN 2-3 mostró ↓mortalidad 28d (46% vs 63%, p=0.017)\n• BICAR-ICU 2 (Jung, JAMA 2025, n=627): diseñado para CONFIRMAR ese subgrupo → resultó NEGATIVO. Mortalidad 90d 62.1% vs 61.7% (p=0.91)\n• Hallazgo consistente en ambos: REDUCCIÓN DE TRR (35% vs 50%)\n• Interpretación: el beneficio parece ser evitar la indicación de diálisis por acidemia, no protección renal real\n• SSC 2026: recomendación condicional, muy baja certeza\n\n💉 SI SE DECIDE ADMINISTRAR:\n• NaHCO3 4.2% (500 mEq/L = 0.5 mEq/mL)\n• Dosis: 125-250 mL en 30 minutos\n• Volumen calculado para el déficit: ${(biDef/0.5).toFixed(0)} mL\n• Reevaluar gasometría a las 1-4 horas\n• Repetir si pH <7.30\n• Máximo: 1000 mL (500 mEq) en 24 horas\n\n⚠ RIESGOS DEL BICARBONATO:\n• Hipernatremia (cada 100 mL de 4.2% aporta ~50 mEq de Na)\n• Hipocalcemia (↑unión del Ca a albúmina con el ↑pH)\n• Hipokalemia (desplazamiento intracelular)\n• Acidosis intracelular paradójica (el CO2 generado difunde a la célula)\n• Alcalosis de rebote\n• Sobrecarga de volumen\n\n📋 MONITOREO: pH, Na⁺, Ca²⁺ iónico, K⁺ cada 2-4 horas\n\n🎯 LO MÁS IMPORTANTE: TRATAR LA CAUSA DE LA ACIDOSIS`);
      R.refs.push("Jaber S, et al. BICAR-ICU. Lancet. 2018;392:31-40.","Jung B, et al. BICAR-ICU 2. JAMA. 2025.");}}

  R.refs=[...new Set(R.refs)];return R;
}

/* ═══════════ TAB 5: ULTRASONIDO ═══════════ */
const LUS_ZONES=["Anterior sup. der.","Anterior inf. der.","Lateral sup. der.","Lateral inf. der.","Posterior sup. der.","Posterior inf. der.","Anterior sup. izq.","Anterior inf. izq.","Lateral sup. izq.","Lateral inf. izq.","Posterior sup. izq.","Posterior inf. izq."];
const LUS_SCORES=[{v:"0",l:"0 — Líneas A (normal)"},{v:"1",l:"1 — ≥3 líneas B separadas"},{v:"2",l:"2 — Líneas B coalescentes"},{v:"3",l:"3 — Consolidación"}];

function calcUS(v){
  const R={calc:[],interp:[],act:[],alerts:[],refs:[]};const n=k=>{const x=parseFloat(v[k]);return isNaN(x)?null:x;};
  const ivcMax=n("ivcMax"),ivcMin=n("ivcMin"),vtiLVOT=n("vtiLVOT"),lvotD=n("lvotDiam"),hr=n("hr");

  // ═══ IVC ═══
  if(ivcMax!==null&&ivcMin!==null&&ivcMax>0){
    R.calc.push({l:"VCI diámetro máximo",v:`${ivcMax} mm`,f:"2 cm distal a unión con AD",c:ivcMax>21?"#f59e0b":"#22c55e"});
    R.calc.push({l:"VCI diámetro mínimo",v:`${ivcMin} mm`,f:"Medición en modo M",c:"#8ab0c0"});
    const ci=((ivcMax-ivcMin)/ivcMax*100);
    const di=((ivcMax-ivcMin)/ivcMin*100);
    const dIvcMean=((ivcMax-ivcMin)/((ivcMax+ivcMin)/2)*100);

    if(v.breathingMode==="spontaneous"){
      R.calc.push({l:"Índice de COLAPSABILIDAD",v:`${ci.toFixed(1)}%`,f:"(Dmáx−Dmín)/Dmáx × 100",c:ci>50?"#22c55e":ci<20?"#ef4444":"#f59e0b"});
      R.interp.push({t:`RESPIRACIÓN ESPONTÁNEA — se usa el índice de COLAPSABILIDAD\n• En inspiración espontánea la presión intratorácica cae → la VCI colapsa\n• Colapso >50% sugiere presión venosa central baja y posible respuesta a volumen\n• Colapso <20% sugiere PVC elevada`,c:"#3b82f6"});
      if(ci>50)R.interp.push({t:`Colapsabilidad ${ci.toFixed(1)}% >50%: sugiere PVC baja (0-5 mmHg) y posible precarga-dependencia. ⚠ En respiración espontánea la VCI tiene BAJA precisión para predecir respuesta a volumen (el esfuerzo inspiratorio es variable). Preferir elevación pasiva de piernas con medición de gasto cardíaco`,c:"#f59e0b"});
      if(ci<20)R.interp.push({t:`Colapsabilidad ${ci.toFixed(1)}% <20% con VCI ${ivcMax>21?"dilatada":"no dilatada"}: sugiere PVC elevada (>15 mmHg). Evaluar congestión venosa sistémica con VExUS`,c:"#ef4444"});
    } else {
      R.calc.push({l:"Índice de DISTENSIBILIDAD",v:`${di.toFixed(1)}%`,f:"(Dmáx−Dmín)/Dmín × 100",c:di>18?"#22c55e":"#f59e0b"});
      R.calc.push({l:"ΔVCI (variante)",v:`${dIvcMean.toFixed(1)}%`,f:"(Dmáx−Dmín)/promedio × 100",c:dIvcMean>12?"#22c55e":"#f59e0b"});
      R.interp.push({t:`VENTILACIÓN MECÁNICA — se usa el índice de DISTENSIBILIDAD\n• Con presión positiva, la inspiración AUMENTA la presión intratorácica → la VCI se DISTIENDE\n• Es el fenómeno inverso a la respiración espontánea\n• Umbral >18% (Barbier, ICM 2004) predice respuesta a volumen\n• Umbral alternativo ΔVCI >12% (Feissel, ICM 2004)`,c:"#3b82f6"});
      if(di>18){R.interp.push({t:`Distensibilidad ${di.toFixed(1)}% >18%: PROBABLE RESPONDEDOR A VOLUMEN`,c:"#22c55e",bold:true});
        R.act.push(`VCI SUGIERE PRECARGA-DEPENDENCIA (distensibilidad ${di.toFixed(1)}%)\n\n⚠ CONDICIONES DE VALIDEZ — verificar TODAS:\n• Ventilación mecánica CONTROLADA (sin esfuerzos espontáneos)\n• Volumen corriente ≥8 mL/kg de peso predicho\n• Ritmo cardíaco REGULAR (sin fibrilación auricular ni extrasístoles frecuentes)\n• Tórax cerrado\n• Sin hipertensión intraabdominal (>12 mmHg altera la transmisión)\n• Sin falla ventricular derecha significativa\n\n📋 SI SE CUMPLEN:\n• Bolo de 250-500 mL de cristaloide con reevaluación\n• Confirmar con ↑gasto cardíaco (VTI del TSVI) ≥10-15%\n• Reevaluar VCI tras el bolo\n\n📋 SI NO SE CUMPLEN:\n• La VCI NO es confiable → usar elevación pasiva de piernas con medición de gasto cardíaco\n• O prueba de oclusión tele-espiratoria (15 segundos)`);}
      else R.interp.push({t:`Distensibilidad ${di.toFixed(1)}% <18%: poco probable que responda a volumen. Evaluar otras causas de hipoperfusión — disfunción cardíaca, vasoplejia, obstrucción`,c:"#f59e0b"});}

    // Estimated CVP
    let cvpEst="",cvpColor="#8ab0c0";
    if(ivcMax<21&&ci>50){cvpEst="0-5 mmHg (media 3)";cvpColor="#22c55e";}
    else if(ivcMax>21&&ci<50){cvpEst="10-20 mmHg (media 15)";cvpColor="#ef4444";}
    else {cvpEst="5-10 mmHg (media 8)";cvpColor="#f59e0b";}
    R.calc.push({l:"PVC estimada",v:cvpEst,f:"Según guías ASE (VCI + colapso)",c:cvpColor});
    if(ivcMax>21)R.interp.push({t:`VCI dilatada (${ivcMax} mm >21 mm): sugiere presión de aurícula derecha elevada. Evaluar causas: sobrecarga de volumen, falla ventricular derecha, hipertensión pulmonar, tamponamiento, pericarditis constrictiva, ventilación con PEEP alta`,c:"#ef4444"});
  }

  // ═══ CARDIAC OUTPUT ═══
  if(vtiLVOT!==null&&lvotD!==null&&hr!==null){
    const area=Math.PI*Math.pow(lvotD/10/2,2);
    const sv=area*vtiLVOT;
    const co=sv*hr/1000;
    R.calc.push({l:"Área del TSVI",v:`${area.toFixed(2)} cm²`,f:"π×(diámetro/2)²",c:"#8ab0c0"});
    R.calc.push({l:"Volumen sistólico",v:`${sv.toFixed(0)} mL`,f:"Área × VTI | normal 60-100",c:sv<60?"#ef4444":"#22c55e"});
    R.calc.push({l:"Gasto cardíaco",v:`${co.toFixed(2)} L/min`,f:"VS × FC | normal 4-8",c:co<4?"#ef4444":"#22c55e"});
    const bsaW=n("weight"),bsaH=n("height");
    if(bsaW&&bsaH){const bsa=Math.sqrt(bsaW*bsaH/3600);
      R.calc.push({l:"Superficie corporal",v:`${bsa.toFixed(2)} m²`,f:"√(Peso×Talla/3600) — Mosteller",c:"#8ab0c0"});
      R.calc.push({l:"Índice cardíaco",v:`${(co/bsa).toFixed(2)} L/min/m²`,f:"GC÷SC | normal 2.5-4.0",c:co/bsa<2.2?"#ef4444":"#22c55e"});
      if(co/bsa<2.2)R.alerts.push({lv:"critical",t:`Índice cardíaco ${(co/bsa).toFixed(2)} <2.2 L/min/m² — bajo gasto`});}
    if(vtiLVOT<14)R.interp.push({t:`VTI del TSVI ${vtiLVOT} cm <14: indica volumen sistólico bajo. Criterio de disfunción ventricular izquierda en el algoritmo ANDROMEDA-SHOCK-2 cuando se combina con FAC <40%`,c:"#ef4444"});
    else if(vtiLVOT>20)R.interp.push({t:`VTI ${vtiLVOT} cm >20: estado hiperdinámico. Compatible con choque distributivo, anemia severa, tirotoxicosis o fístula arteriovenosa`,c:"#f59e0b"});
  }

  // ═══ VTI VARIATION ═══
  const vtiMax=n("vtiMax"),vtiMin=n("vtiMin");
  if(vtiMax!==null&&vtiMin!==null&&vtiMin>0){const vtiVar=(vtiMax-vtiMin)/((vtiMax+vtiMin)/2)*100;
    R.calc.push({l:"Variación respiratoria del VTI",v:`${vtiVar.toFixed(1)}%`,f:"(máx−mín)/promedio × 100",c:vtiVar>12?"#22c55e":"#f59e0b"});
    if(vtiVar>12)R.interp.push({t:`Variación del VTI ${vtiVar.toFixed(1)}% >12%: predice respuesta a volumen con buena precisión en ventilación mecánica controlada. Es más confiable que la VCI porque mide directamente la variación del volumen sistólico`,c:"#22c55e",bold:true});}

  // ═══ LUNG ULTRASOUND SCORE ═══
  let lusTotal=0,lusFilled=0,bZones=0,consolidations=0;
  LUS_ZONES.forEach((_,i)=>{const s=v[`lus${i}`];if(s!==undefined&&s!==""){lusTotal+=parseInt(s);lusFilled++;if(parseInt(s)>=1&&parseInt(s)<=2)bZones++;if(parseInt(s)===3)consolidations++;}});
  if(lusFilled>0){
    R.calc.push({l:"Lung Ultrasound Score (LUS)",v:`${lusTotal}/${lusFilled*3}`,f:`${lusFilled}/12 zonas evaluadas`,c:lusTotal>13?"#ef4444":lusTotal>6?"#f59e0b":"#22c55e"});
    if(lusFilled===12){
      R.calc.push({l:"LUS normalizado",v:`${lusTotal}/36`,f:"Score completo de 12 zonas",c:lusTotal>13?"#ef4444":"#22c55e"});
      if(lusTotal<=5)R.interp.push({t:`LUS ${lusTotal}/36: aireación pulmonar conservada. Poco probable que haya edema pulmonar significativo`,c:"#22c55e"});
      else if(lusTotal<=13)R.interp.push({t:`LUS ${lusTotal}/36: pérdida moderada de aireación. Correlaciona con agua pulmonar extravascular aumentada`,c:"#f59e0b"});
      else{R.alerts.push({lv:"warning",t:`LUS ${lusTotal}/36 >13 — pérdida significativa de aireación pulmonar`});
        R.interp.push({t:`LUS ${lusTotal}/36 >13: pérdida severa de aireación. Correlaciona con: agua pulmonar extravascular elevada, mayor riesgo de fracaso de extubación (LUS >14 predice falla), peor oxigenación. Útil para monitorizar respuesta a diuréticos y a maniobras de reclutamiento`,c:"#ef4444"});
        R.act.push(`LUS ELEVADO (${lusTotal}/36):\n\n📊 INTERPRETACIÓN:\n• >13-14 puntos indica pérdida significativa de aireación\n• Correlaciona con agua pulmonar extravascular medida por termodilución\n• LUS >14 antes de la extubación predice fracaso (Soummer, CCM 2012)\n\n⚕️ ACCIONES SEGÚN PATRÓN:\n• Si predominan líneas B bilaterales difusas → edema pulmonar (cardiogénico o SDRA)\n  → Evaluar balance hídrico y considerar depleción con diuréticos\n  → Correlacionar con VExUS y función cardíaca\n• Si predominan consolidaciones focales → neumonía o atelectasia\n  → Broncoscopia si atelectasia por tapón mucoso\n  → Maniobras de reclutamiento si atelectasia por decúbito\n  → Antibiótico si infeccioso\n• Si hay patrón dorsal predominante → considerar posición prono\n\n📋 SEGUIMIENTO:\n• Repetir LUS tras cada intervención (diurético, reclutamiento, prono)\n• La mejoría del LUS precede a la mejoría gasométrica`);}}
    if(bZones>=2)R.interp.push({t:`${bZones} zonas con líneas B: el patrón B bilateral en zonas anteriores sugiere síndrome intersticial. Diferenciar edema cardiogénico (líneas B homogéneas, pleura lisa, derrame) de SDRA (distribución parcheada, pleura irregular, consolidaciones subpleurales, áreas de aireación conservada)`,c:"#f59e0b"});
    if(consolidations>0)R.interp.push({t:`${consolidations} zona(s) con consolidación: buscar broncograma aéreo dinámico (sugiere neumonía) vs estático (sugiere atelectasia). El signo del "shred" o borde irregular sugiere neumonía`,c:"#f59e0b"});
  }

  // ═══ BLUE PROTOCOL ═══
  if(v.bluePattern&&v.bluePattern!=="none"){
    const BLUE={
      a_sliding:{d:"Perfil A con deslizamiento pleural conservado",dx:"EPOC / Asma (si no hay TVP)",act:"Buscar TVP en miembros inferiores para descartar TEP. Si no hay TVP → broncoespasmo. Broncodilatadores, corticoides, evaluar VNI"},
      a_dvt:{d:"Perfil A + trombosis venosa profunda",dx:"TROMBOEMBOLIA PULMONAR",act:"Angiotomografía si estable. Si inestable: ecocardiografía buscando dilatación del VD, D-shape septal, signo de McConnell. Anticoagulación inmediata. Trombólisis si TEP de alto riesgo con inestabilidad hemodinámica"},
      b_profile:{d:"Perfil B — líneas B bilaterales difusas con deslizamiento",dx:"EDEMA PULMONAR (cardiogénico o SDRA)",act:"Diferenciar por: función cardíaca en eco, VCI, VExUS, BNP. Si cardiogénico: diuréticos + vasodilatadores + VNI. Si SDRA: ventilación protectora, prono si PaFi <150"},
      ab_profile:{d:"Perfil A/B — asimétrico (A en un lado, B en otro)",dx:"NEUMONÍA",act:"Antibiótico empírico según foco y epidemiología local. Cultivos antes de antibiótico. Considerar broncoscopia si no mejora"},
      c_profile:{d:"Perfil C — consolidación anterior",dx:"NEUMONÍA",act:"Antibiótico empírico. Buscar broncograma aéreo dinámico. Cultivos. Considerar drenaje si empiema asociado"},
      a_prime:{d:"Perfil A' — líneas A SIN deslizamiento pleural",dx:"NEUMOTÓRAX (confirmar con punto pulmonar)",act:"🚨 Buscar PUNTO PULMONAR (100% específico). Si hay inestabilidad: descompresión INMEDIATA con aguja en 2º espacio intercostal línea medioclavicular o 5º espacio línea axilar media, seguida de tubo torácico. NO esperar radiografía si hay neumotórax a tensión"},
      plaps:{d:"PLAPS — síndrome alveolar/pleural posterolateral",dx:"NEUMONÍA (o derrame/atelectasia)",act:"Explorar zona PLAPS sistemáticamente. Diferenciar consolidación de derrame. Si derrame significativo: considerar toracocentesis diagnóstica y/o terapéutica"},
    };
    const b=BLUE[v.bluePattern];
    if(b){R.interp.push({t:`PROTOCOLO BLUE — ${b.d}\n→ DIAGNÓSTICO MÁS PROBABLE: ${b.dx}`,c:"#ef4444",bold:true});
      R.act.push(`CONDUCTA SEGÚN PROTOCOLO BLUE:\n${b.act}\n\n📊 El protocolo BLUE tiene 90.5% de precisión diagnóstica en insuficiencia respiratoria aguda (Lichtenstein, Chest 2008). Se realiza en menos de 3 minutos con 3 puntos de exploración por hemitórax: BLUE superior, BLUE inferior y PLAPS`);
      R.refs.push("Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125.");}}

  // ═══ VExUS ═══
  if(v.vexusIVC&&v.vexusIVC!=="none"){
    let grade=0,severePatterns=0,mildPatterns=0,details=[];
    if(v.vexusIVC==="lt2"){grade=0;details.push("VCI <2 cm → VExUS Grado 0 (sin congestión venosa)");}
    else{
      // Hepatic vein
      if(v.vexusHepatic==="severe"){severePatterns++;details.push("Vena hepática: onda S INVERTIDA → patrón SEVERO");}
      else if(v.vexusHepatic==="mild"){mildPatterns++;details.push("Vena hepática: S < D → patrón leve");}
      else if(v.vexusHepatic==="normal")details.push("Vena hepática: S > D → normal");
      // Portal vein
      if(v.vexusPortal==="severe"){severePatterns++;details.push("Vena porta: pulsatilidad ≥50% → patrón SEVERO");}
      else if(v.vexusPortal==="mild"){mildPatterns++;details.push("Vena porta: pulsatilidad 30-49% → patrón leve");}
      else if(v.vexusPortal==="normal")details.push("Vena porta: pulsatilidad <30% → normal");
      // Renal vein
      if(v.vexusRenal==="severe"){severePatterns++;details.push("Vena intrarrenal: flujo MONOFÁSICO (solo diastólico) → patrón SEVERO");}
      else if(v.vexusRenal==="mild"){mildPatterns++;details.push("Vena intrarrenal: flujo bifásico (S+D) → patrón leve");}
      else if(v.vexusRenal==="normal")details.push("Vena intrarrenal: flujo continuo → normal");

      if(severePatterns>=2)grade=3;
      else if(severePatterns===1)grade=2;
      else grade=1;
    }
    const gradeColors=["#22c55e","#84cc16","#f59e0b","#ef4444"];
    R.calc.push({l:"VExUS Grado",v:`${grade}`,f:`VCI ${v.vexusIVC==="lt2"?"<2cm":"≥2cm"} | ${severePatterns} patrón(es) severo(s)`,c:gradeColors[grade]});
    R.interp.push({t:`EVALUACIÓN VExUS (Venous Excess Ultrasound)\n${details.map(d=>"• "+d).join("\n")}\n\n→ GRADO ${grade}`,c:gradeColors[grade],bold:true});

    const vexusGuide={
      0:{t:"Sin congestión venosa sistémica",a:`VExUS GRADO 0 — SIN CONGESTIÓN\n\n• La VCI <2 cm descarta congestión venosa significativa\n• Si hay hipoperfusión, es poco probable que sea por congestión\n• Se puede administrar volumen con relativa seguridad si está indicado por otros criterios\n• Continuar evaluación de respuesta a volumen con métodos dinámicos`},
      1:{t:"Congestión leve",a:`VExUS GRADO 1 — CONGESTIÓN LEVE\n\n• VCI dilatada pero sin patrones venosos severos\n• Riesgo bajo-moderado de lesión renal por congestión\n• Precaución con la administración adicional de volumen\n• Reevaluar tras cada intervención\n• Si hay LRA: la congestión puede estar contribuyendo`},
      2:{t:"Congestión moderada",a:`VExUS GRADO 2 — CONGESTIÓN MODERADA\n\n⚠ Un patrón venoso severo presente\n\n• RIESGO SIGNIFICATIVO DE LESIÓN RENAL AGUDA por congestión venosa\n• La congestión venosa reduce el gradiente de perfusión renal (PAM − PVC)\n• EVITAR administración adicional de volumen salvo indicación clara e imperativa\n• Considerar iniciar depleción si la hemodinamia lo permite\n• Optimizar función ventricular derecha: reducir PEEP si es posible, tratar hipertensión pulmonar\n• Meta: presión de perfusión renal (PAM − PVC) >55-60 mmHg`},
      3:{t:"Congestión severa",a:`VExUS GRADO 3 — CONGESTIÓN SEVERA\n\n🚨 Dos o más patrones venosos severos\n\n• ALTO RIESGO DE LESIÓN RENAL AGUDA (OR ~3.7 para LRA en cirugía cardíaca, Beaubien-Souligny 2020)\n• La congestión venosa es un mecanismo de LRA tan importante como la hipoperfusión arterial\n\n⚕️ ACCIONES:\n• SUSPENDER administración de volumen\n• DEPLECIÓN ACTIVA: diuréticos de asa (bolo o infusión continua)\n• Si refractario a diuréticos → ultrafiltración\n• Optimizar el ventrículo derecho:\n  → Reducir PEEP al mínimo tolerable\n  → Tratar hipoxemia e hipercapnia (vasoconstrictores pulmonares)\n  → Considerar vasodilatadores pulmonares si hipertensión pulmonar\n  → Inotrópicos si falla ventricular derecha (dobutamina, milrinona)\n• Vigilar la presión de perfusión renal: PAM − PVC\n• Reevaluar VExUS cada 12-24h para medir respuesta a la depleción`},
    };
    const vg=vexusGuide[grade];
    if(vg){R.act.push(vg.a);}
    if(grade>=2)R.alerts.push({lv:grade===3?"critical":"warning",t:`VExUS Grado ${grade} — ${vexusGuide[grade].t}. Riesgo de LRA por congestión venosa`});
    R.refs.push("Beaubien-Souligny W, et al. Quantifying systemic congestion with POCUS: the VExUS grading system. Ultrasound J. 2020;12:16.");
  }

  R.refs=[...new Set(R.refs)];return R;
}

/* ═══════════ VExUS DOPPLER WAVEFORM DIAGRAMS ═══════════ */
function VexusWave({vein,severity,width:w=300,height:h=110}){
  const base=h*0.5;const colors={normal:"#22c55e",mild:"#f59e0b",severe:"#ef4444"};
  const c=colors[severity]||"#4a9bb5";let p="",labels=[],ecg="";
  // ECG reference line at top
  const ecgY=14;
  for(let i=0;i<3;i++){const x0=30+i*90;ecg+=`M${x0},${ecgY} L${x0+8},${ecgY} L${x0+11},${ecgY-8} L${x0+14},${ecgY+4} L${x0+17},${ecgY} L${x0+90},${ecgY} `;}

  if(vein==="hepatic"){
    // Hepatic vein: S and D waves below baseline (toward heart = negative/below)
    if(severity==="normal"){
      // S > D (S deeper)
      p=`M10,${base}`;
      for(let i=0;i<3;i++){const x=10+i*90;
        p+=` L${x+12},${base} Q${x+22},${base+32} ${x+32},${base} Q${x+40},${base+20} ${x+50},${base} L${x+90},${base}`;}
      labels=[{x:35,y:base+42,t:"S",c:c},{x:57,y:base+30,t:"D",c:c},{x:w/2,y:h-6,t:"S > D — Normal",a:"middle"}];
    } else if(severity==="mild"){
      // S < D
      p=`M10,${base}`;
      for(let i=0;i<3;i++){const x=10+i*90;
        p+=` L${x+12},${base} Q${x+22},${base+16} ${x+32},${base} Q${x+42},${base+34} ${x+52},${base} L${x+90},${base}`;}
      labels=[{x:33,y:base+26,t:"S",c:c},{x:58,y:base+44,t:"D",c:c},{x:w/2,y:h-6,t:"S < D — Leve",a:"middle"}];
    } else {
      // S reversed (above baseline)
      p=`M10,${base}`;
      for(let i=0;i<3;i++){const x=10+i*90;
        p+=` L${x+12},${base} Q${x+22},${base-26} ${x+32},${base} Q${x+42},${base+34} ${x+52},${base} L${x+90},${base}`;}
      labels=[{x:33,y:base-32,t:"S invertida",c:c},{x:58,y:base+44,t:"D",c:c},{x:w/2,y:h-6,t:"S reversa — SEVERO",a:"middle"}];
    }
  }
  if(vein==="portal"){
    // Portal vein: continuous flow, pulsatility varies
    if(severity==="normal"){
      p=`M10,${base+20}`;
      for(let x=10;x<w-10;x+=3){const osc=Math.sin(x*0.07)*3;p+=` L${x},${base+20+osc}`;}
      labels=[{x:w/2,y:h-6,t:"Flujo continuo — PI <30%",a:"middle"}];
    } else if(severity==="mild"){
      p=`M10,${base+20}`;
      for(let x=10;x<w-10;x+=3){const osc=Math.sin(x*0.07)*10;p+=` L${x},${base+20+osc}`;}
      labels=[{x:w/2,y:h-6,t:"Pulsatilidad 30-49% — Leve",a:"middle"}];
    } else {
      p=`M10,${base+18}`;
      for(let x=10;x<w-10;x+=3){const osc=Math.sin(x*0.07)*22;p+=` L${x},${base+18+osc}`;}
      labels=[{x:w/2,y:h-6,t:"Pulsatilidad ≥50% — SEVERO",a:"middle"}];
    }
  }
  if(vein==="renal"){
    if(severity==="normal"){
      p=`M10,${base+18}`;
      for(let x=10;x<w-10;x+=3){const osc=Math.sin(x*0.08)*2.5;p+=` L${x},${base+18+osc}`;}
      labels=[{x:w/2,y:h-6,t:"Flujo continuo — Normal",a:"middle"}];
    } else if(severity==="mild"){
      // Biphasic: S and D peaks
      p=`M10,${base}`;
      for(let i=0;i<3;i++){const x=10+i*90;
        p+=` L${x+10},${base} Q${x+20},${base+24} ${x+30},${base+4} Q${x+40},${base+22} ${x+50},${base} L${x+90},${base}`;}
      labels=[{x:28,y:base+34,t:"S",c:c},{x:52,y:base+32,t:"D",c:c},{x:w/2,y:h-6,t:"Bifásico (S+D) — Leve",a:"middle"}];
    } else {
      // Monophasic: only D
      p=`M10,${base}`;
      for(let i=0;i<3;i++){const x=10+i*90;
        p+=` L${x+30},${base} Q${x+45},${base+34} ${x+60},${base} L${x+90},${base}`;}
      labels=[{x:52,y:base+44,t:"solo D",c:c},{x:w/2,y:h-6,t:"Monofásico (solo D) — SEVERO",a:"middle"}];
    }
  }

  return(<div style={{background:"rgba(0,8,16,0.75)",borderRadius:10,padding:"6px 4px 4px",border:`1px solid ${c}33`,marginBottom:6}}>
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{display:"block"}}>
      <path d={ecg} fill="none" stroke="rgba(120,180,200,0.35)" strokeWidth={1}/>
      <text x={4} y={ecgY+3} fill="rgba(120,180,200,0.5)" fontSize={7} fontFamily="DM Sans">ECG</text>
      <line x1={10} y1={base} x2={w-10} y2={base} stroke="rgba(60,140,170,0.25)" strokeWidth={0.7} strokeDasharray="3,3"/>
      <path d={p} fill="none" stroke={c} strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/>
      <path d={p} fill="none" stroke={c} strokeWidth={5} strokeLinecap="round" strokeLinejoin="round" opacity={0.15}/>
      {labels.map((l,i)=><text key={i} x={l.x} y={l.y} textAnchor={l.a||"start"} fill={l.c||"rgba(170,205,220,0.75)"} fontSize={l.a?9:8.5} fontWeight={600} fontFamily="DM Sans">{l.t}</text>)}
    </svg>
  </div>);
}
