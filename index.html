  const Demo=()=><DemoOuter v={v} u={u}/>;

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#06101e 0%,#0b1a2d 50%,#081422 100%)",color:"#c0d4de",fontFamily:"'DM Sans',sans-serif"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

      {/* HEADER */}
      <div style={{padding:"12px 14px 8px",borderBottom:"1px solid rgba(60,140,170,0.1)",background:"rgba(6,16,30,0.92)",backdropFilter:"blur(20px)",position:"sticky",top:0,zIndex:100}}>
        <div style={{maxWidth:720,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:32,height:32,borderRadius:8,background:"linear-gradient(135deg,#164e63,#0d3a4a)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,boxShadow:"0 2px 8px rgba(22,78,99,0.4)"}}>🫀</div>
            <div><h1 style={{fontSize:14.5,fontWeight:700,color:"#dceef4",margin:0,letterSpacing:"-0.01em"}}>CritCare Bedside</h1><p style={{fontSize:8.5,color:"#4a7a8a",margin:0,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase"}}>Suite de cálculo en cuidados críticos</p></div>
          </div>
          {/* TAB BAR */}
          <div style={{display:"flex",gap:2,overflowX:"auto",paddingBottom:2,WebkitOverflowScrolling:"touch"}}>
            {TABS.map(t=>(<button key={t.id} onClick={()=>{setTab(t.id);setRes(null);}} style={{flexShrink:0,padding:"7px 11px",border:"none",borderRadius:7,background:tab===t.id?"linear-gradient(135deg,#164e63,#12404f)":"rgba(15,30,50,0.5)",color:tab===t.id?"#c8ecf8":"#4a7080",fontSize:10.5,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'",display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap",transition:"all 0.2s"}}>
              <span style={{fontSize:12}}>{t.l}</span>{t.n}
            </button>))}
          </div>
        </div>
      </div>

      <div style={{maxWidth:720,margin:"0 auto",padding:"12px 12px 40px"}}>

        {/* ══════ TAB: HEMODINAMIA ══════ */}
        {tab==="hemo"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Parámetros hemodinámicos del monitor con interpretación y algoritmo ANDROMEDA-SHOCK-2 para fenotipificación del choque.</p></div>
          <Demo/>
          <div style={S.sec}><div style={S.secT}><span>🫀</span> Signos vitales</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="PAS" unit="mmHg" value={v.sbp} onChange={x=>u("sbp",x)} placeholder="120"/>
              <NI label="PAD" unit="mmHg" value={v.dbp} onChange={x=>u("dbp",x)} placeholder="80"/>
              <NI label="FC" unit="lpm" value={v.hr} onChange={x=>u("hr",x)} placeholder="80"/>
              <NI label="Temperatura" unit="°C" value={v.temp} onChange={x=>u("temp",x)} placeholder="36.5"/>
              <NI label="PVC" unit="mmHg" value={v.cvp} onChange={x=>u("cvp",x)} placeholder="8"/>
            </div>
          </div>
          <div style={S.sec}><div style={S.secT}><span>🩸</span> Marcadores de perfusión</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Llenado capilar" unit="seg" value={v.crt} onChange={x=>u("crt",x)} placeholder="2"/>
              <NI label="Lactato" unit="mmol/L" value={v.lactate} onChange={x=>u("lactate",x)} placeholder="1.0"/>
            </div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Técnica del CRT: aplicar presión firme sobre la superficie ventral de la falange distal del índice durante 10 segundos con un portaobjetos. Cronometrar el retorno del color. Normal &lt;3 segundos.</p></div>
          </div>
          <div style={S.sec}><div style={S.secT}><span>📋</span> Contexto clínico</div>
            <OS label="Hipertensión arterial crónica" value={v.htn} onChange={x=>u("htn",x)} options={[{l:"No",v:"no"},{l:"Sí",v:"yes"}]}/>
            <DD label="Tipo de choque" value={v.shock} onChange={x=>u("shock",x)} options={SHOCK_OPTS}/>
          </div>
          <CalcBtn fn={calcHemo}/>
          <Results res={res} rRef={rRef}/>
        </div>)}

        {/* ══════ TAB: VENTILACIÓN ══════ */}
        {tab==="vent"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Mecánica ventilatoria completa (invasiva y no invasiva) integrada con análisis de gasometría arterial y venosa. Identifica qué trastornos ácido-base son corregibles mediante ajustes del ventilador.</p></div>
          <Demo/>

          <div style={S.sec}><div style={S.secT}><span>🌬️</span> Tipo de soporte ventilatorio</div>
            <OS label="Modalidad de soporte" value={v.ventType} onChange={x=>u("ventType",x)} options={[{l:"VM invasiva",v:"invasive"},{l:"No invasiva / CNAF",v:"niv"},{l:"Sin soporte",v:"none"}]}/>
            {v.ventType==="invasive"&&<OS label="Modo ventilatorio" value={v.ventMode} onChange={x=>u("ventMode",x)} options={[{l:"Volumen controlado (VCV)",v:"volume"},{l:"Presión controlada (PCV)",v:"pressure"}]}/>}
            {v.ventType==="niv"&&<OS label="Modalidad no invasiva" value={v.nivMode} onChange={x=>u("nivMode",x)} options={[{l:"CPAP",v:"cpap"},{l:"BiPAP / VNI con PS",v:"bipap"},{l:"CNAF (alto flujo)",v:"hfnc"}]}/>}
            <OS label="Contexto de SDRA" value={v.ards} onChange={x=>u("ards",x)} options={[{l:"No",v:"no"},{l:"Sí",v:"yes"}]}/>
          </div>

          {v.ventType==="invasive"&&(<div style={S.sec}><div style={S.secT}><span>⚙️</span> Parámetros del ventilador</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>{v.ventMode==="volume"?"📌 VCV: Vt, FR y flujo son PROGRAMADOS. Pplat y Ppico se MIDEN. La Pplat requiere pausa inspiratoria de 0.5-2 segundos.":"📌 PCV: la presión sobre PEEP, la FR y el Ti son PROGRAMADOS. El Vt es RESULTANTE y varía con la compliance. Ppico ≈ Pplat por el flujo desacelerado."}</p></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              {v.ventMode==="volume"?<>
                <NI label="Vt programado" unit="mL" value={v.vt} onChange={x=>u("vt",x)} placeholder="420"/>
                <NI label="FR programada" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="16"/>
                <NI label="PEEP" unit="cmH₂O" value={v.peep} onChange={x=>u("peep",x)} placeholder="10"/>
                <NI label="Pplat (medida)" unit="cmH₂O" value={v.pplat} onChange={x=>u("pplat",x)} placeholder="25"/>
                <NI label="Ppico (medida)" unit="cmH₂O" value={v.ppeak} onChange={x=>u("ppeak",x)} placeholder="30"/>
                <NI label="Flujo inspiratorio" unit="L/min" value={v.inspFlow} onChange={x=>u("inspFlow",x)} placeholder="60"/>
              </>:<>
                <NI label="Presión sobre PEEP" unit="cmH₂O" value={v.pOverPeep} onChange={x=>u("pOverPeep",x)} placeholder="15"/>
                <NI label="FR programada" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="16"/>
                <NI label="PEEP" unit="cmH₂O" value={v.peep} onChange={x=>u("peep",x)} placeholder="10"/>
                <NI label="Vt resultante" unit="mL" value={v.vt} onChange={x=>u("vt",x)} placeholder="420"/>
                <NI label="Ppico (medida)" unit="cmH₂O" value={v.ppeak} onChange={x=>u("ppeak",x)} placeholder="25"/>
                <NI label="Pplat (si se mide)" unit="cmH₂O" value={v.pplat} onChange={x=>u("pplat",x)} placeholder=""/>
              </>}
              <NI label="Tiempo inspiratorio" unit="seg" value={v.ti} onChange={x=>u("ti",x)} placeholder="1.0"/>
            </div>
            <DD label="Relación I:E (si no se conoce el Ti)" value={v.ieRatio} onChange={x=>u("ieRatio",x)} options={[{v:"",l:"— No especificada —"},{v:"1:1",l:"1:1"},{v:"1:1.5",l:"1:1.5"},{v:"1:2",l:"1:2 (habitual)"},{v:"1:3",l:"1:3"},{v:"1:4",l:"1:4 (obstructivo)"},{v:"2:1",l:"2:1 (invertida)"}]}/>
            <OS label="Humidificación activa" value={v.humidified} onChange={x=>u("humidified",x)} options={[{l:"Sí",v:"yes"},{l:"No / HME",v:"no"}]}/>
          </div>)}

          {v.ventType==="niv"&&(<div style={S.sec}><div style={S.secT}><span>😷</span> Parámetros no invasivos</div>
            {v.nivMode==="cpap"&&<div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Nivel de CPAP" unit="cmH₂O" value={v.cpapLevel} onChange={x=>u("cpapLevel",x)} placeholder="8"/>
              <NI label="Vt espontáneo" unit="mL" value={v.vtNIV} onChange={x=>u("vtNIV",x)} placeholder="500"/>
              <NI label="FR" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="24"/>
            </div>}
            {v.nivMode==="bipap"&&<div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="IPAP" unit="cmH₂O" value={v.ipap} onChange={x=>u("ipap",x)} placeholder="16"/>
              <NI label="EPAP" unit="cmH₂O" value={v.epap} onChange={x=>u("epap",x)} placeholder="6"/>
              <NI label="Vt espontáneo" unit="mL" value={v.vtNIV} onChange={x=>u("vtNIV",x)} placeholder="500"/>
              <NI label="FR" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="24"/>
            </div>}
            {v.nivMode==="hfnc"&&<div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Flujo" unit="L/min" value={v.hfncFlow} onChange={x=>u("hfncFlow",x)} placeholder="50"/>
              <NI label="FR" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="24"/>
            </div>}
          </div>)}

          <div style={S.sec}><div style={S.secT}><span>🫁</span> Oxigenación</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="SpO2" unit="%" value={v.spo2} onChange={x=>u("spo2",x)} placeholder="95"/>
              <NI label="FiO2" unit="%" value={v.fio2} onChange={x=>u("fio2",x)} placeholder="21"/>
              <NI label="PaO2" unit="mmHg" value={v.pao2} onChange={x=>u("pao2",x)} placeholder="80"/>
            </div>
            <DD label="Altitud del paciente (para gradiente A-a)" value={v.altitude} onChange={x=>u("altitude",x)} options={ALTS}/>
            {v.altitude==="custom"&&<NI label="Presión barométrica" unit="mmHg" value={v.customPatm} onChange={x=>u("customPatm",x)} placeholder="760" style={{flex:"1 1 100%"}}/>}
          </div>

          <div style={S.sec}><div style={S.secT}><span>🧪</span> Gasometría arterial</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="pH" value={v.ph} onChange={x=>u("ph",x)} placeholder="7.40"/>
              <NI label="PaCO2" unit="mmHg" value={v.paco2} onChange={x=>u("paco2",x)} placeholder="40"/>
              <NI label="HCO3⁻" unit="mEq/L" value={v.hco3} onChange={x=>u("hco3",x)} placeholder="24"/>
              <NI label="SaO2" unit="%" value={v.sao2} onChange={x=>u("sao2",x)} placeholder="97"/>
              <NI label="Na⁺" unit="mEq/L" value={v.na} onChange={x=>u("na",x)} placeholder="140"/>
              <NI label="Cl⁻" unit="mEq/L" value={v.cl} onChange={x=>u("cl",x)} placeholder="102"/>
              <NI label="Albúmina" unit="g/dL" value={v.alb} onChange={x=>u("alb",x)} placeholder="4.0"/>
              <NI label="Hemoglobina" unit="g/dL" value={v.hb} onChange={x=>u("hb",x)} placeholder="12"/>
              <NI label="Lactato" unit="mmol/L" value={v.lactate} onChange={x=>u("lactate",x)} placeholder="1.0"/>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}}>
              <NI label="Exceso de base" unit="mEq/L" value={v.be} onChange={x=>u("be",x)} placeholder="0" style={{flex:"1 1 55%"}}/>
              <div style={{marginBottom:8}}><label style={S.label}>Signo</label><div style={{display:"flex",gap:3}}>{["+","-"].map(s=><button key={s} onClick={()=>u("beSign",s)} style={{padding:"10px 16px",borderRadius:8,border:v.beSign===s?"1px solid rgba(22,78,99,0.6)":"1px solid rgba(60,140,170,0.1)",background:v.beSign===s?"rgba(22,78,99,0.3)":"rgba(15,30,50,0.35)",color:v.beSign===s?"#a0d8ec":"#6a8a9a",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"'JetBrains Mono'"}}>{s}</button>)}</div></div>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🩸</span> Gasometría venosa central</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 La muestra debe tomarse de la punta del catéter venoso central (vena cava superior). El gap venoarterial de CO2 y el cociente respiratorio detectan hipoperfusión residual con mayor sensibilidad que la ScvO2 aislada.</p></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="ScvO2" unit="%" value={v.scvo2} onChange={x=>u("scvo2",x)} placeholder="72"/>
              <NI label="PvCO2" unit="mmHg" value={v.pvco2} onChange={x=>u("pvco2",x)} placeholder="45"/>
              <NI label="PvO2" unit="mmHg" value={v.pvo2} onChange={x=>u("pvo2",x)} placeholder="40"/>
            </div>
          </div>

          <CalcBtn fn={calcVent}/>
          <Results res={res} rRef={rRef}/>
        </div>)}

        {/* ══════ TAB: BALANCES ══════ */}
        {tab==="balance"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Balance hídrico total y parcial con estimación contextualizada de pérdidas insensibles y recomendaciones de manejo según la fase de reanimación.</p></div>
          <Demo/>

          <div style={S.sec}><div style={S.secT}><span>⏱️</span> Período de cálculo</div>
            <DD label="Horas del balance" value={v.balanceHours} onChange={x=>u("balanceHours",x)} options={[{v:"1",l:"1 hora"},{v:"6",l:"6 horas (turno)"},{v:"8",l:"8 horas (turno)"},{v:"12",l:"12 horas"},{v:"24",l:"24 horas (día completo)"}]}/>
          </div>

          <div style={S.sec}><div style={S.secT}><span>💧</span> Ingresos</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Soluciones IV" unit="mL" value={v.ivFluids} onChange={x=>u("ivFluids",x)} placeholder="1500"/>
              <NI label="Vía oral / SNG" unit="mL" value={v.oralIntake} onChange={x=>u("oralIntake",x)} placeholder="0"/>
              <NI label="Diluciones de fármacos" unit="mL" value={v.medsVolume} onChange={x=>u("medsVolume",x)} placeholder="400"/>
              <NI label="Nutrición (enteral/parenteral)" unit="mL" value={v.nutritionVolume} onChange={x=>u("nutritionVolume",x)} placeholder="1000"/>
              <NI label="Hemoderivados" unit="mL" value={v.bloodProducts} onChange={x=>u("bloodProducts",x)} placeholder="0"/>
            </div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Las diluciones de fármacos y los lavados de líneas son la fuente más frecuentemente subestimada de aporte hídrico en UCI. Pueden representar 500-1500 mL/día.</p></div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🚽</span> Egresos medibles</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Diuresis" unit="mL" value={v.urineOutput} onChange={x=>u("urineOutput",x)} placeholder="1200"/>
              <NI label="Gasto por SNG" unit="mL" value={v.ngLoss} onChange={x=>u("ngLoss",x)} placeholder="0"/>
              <NI label="Drenajes" unit="mL" value={v.drainsLoss} onChange={x=>u("drainsLoss",x)} placeholder="0"/>
              <NI label="Evacuaciones" unit="mL" value={v.stoolLoss} onChange={x=>u("stoolLoss",x)} placeholder="0"/>
              <NI label="Otras pérdidas" unit="mL" value={v.otherLoss} onChange={x=>u("otherLoss",x)} placeholder="0"/>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🌡️</span> Factores que modifican pérdidas insensibles</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Base fisiológica: 0.5 mL/kg/h (≈12 mL/kg/día). Dos tercios corresponden a evaporación cutánea y un tercio a la vía respiratoria.</p></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Temperatura" unit="°C" value={v.temp} onChange={x=>u("temp",x)} placeholder="37.0"/>
              <NI label="Frecuencia respiratoria" unit="rpm" value={v.rr} onChange={x=>u("rr",x)} placeholder="18"/>
            </div>
            <OS label="Ventilación mecánica invasiva" value={v.ventType} onChange={x=>u("ventType",x)} options={[{l:"No",v:"none"},{l:"Sí",v:"invasive"}]}/>
            {v.ventType==="invasive"&&<OS label="Humidificación activa del circuito" value={v.humidified} onChange={x=>u("humidified",x)} options={[{l:"Sí (calentador-humidificador)",v:"yes"},{l:"No / solo HME",v:"no"}]}/>}
            <CB label="Abdomen abierto / laparostomía" checked={v.openAbdomen==="yes"} onChange={c=>u("openAbdomen",c?"yes":"no")}/>
            <CB label="Diaforesis profusa" checked={v.sweating==="yes"} onChange={c=>u("sweating",c?"yes":"no")}/>
            <CB label="Quemaduras extensas" checked={v.burns==="yes"} onChange={c=>u("burns",c?"yes":"no")}/>
            {v.burns==="yes"&&<NI label="Superficie corporal quemada" unit="%" value={v.burnBSA} onChange={x=>u("burnBSA",x)} placeholder="20" style={{flex:"1 1 100%"}}/>}
          </div>

          <div style={S.sec}><div style={S.secT}><span>📈</span> Balance acumulado</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Balance acumulado total" unit="mL" value={v.cumulativeBalance} onChange={x=>u("cumulativeBalance",x)} placeholder="3500"/>
              <NI label="Peso al ingreso" unit="kg" value={v.weightAdmission} onChange={x=>u("weightAdmission",x)} placeholder="70"/>
            </div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 La sobrecarga hídrica &gt;10% del peso al ingreso se asocia de forma independiente con mayor mortalidad, más días de ventilación mecánica y peor recuperación de la función renal.</p></div>
          </div>

          <CalcBtn fn={calcBalance}/>
          <Results res={res} rRef={rRef}/>
        </div>)}

        {/* ══════ TAB: ELECTROLITOS ══════ */}
        {tab==="electro"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Cálculo de déficits, velocidades máximas de corrección y protocolos de reposición para los principales trastornos hidroelectrolíticos del paciente crítico.</p></div>
          <Demo/>

          <div style={S.sec}><div style={S.secT}><span>🧂</span> Electrolitos séricos</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Na⁺" unit="mEq/L" value={v.na} onChange={x=>u("na",x)} placeholder="140"/>
              <NI label="K⁺" unit="mEq/L" value={v.k} onChange={x=>u("k",x)} placeholder="4.0"/>
              <NI label="Cl⁻" unit="mEq/L" value={v.cl} onChange={x=>u("cl",x)} placeholder="102"/>
              <NI label="Mg²⁺" unit="mg/dL" value={v.mg} onChange={x=>u("mg",x)} placeholder="2.0"/>
              <NI label="Ca²⁺ total" unit="mg/dL" value={v.ca} onChange={x=>u("ca",x)} placeholder="9.0"/>
              <NI label="Fósforo" unit="mg/dL" value={v.phos} onChange={x=>u("phos",x)} placeholder="3.5"/>
              <NI label="Albúmina" unit="g/dL" value={v.alb} onChange={x=>u("alb",x)} placeholder="4.0"/>
              <NI label="Glucosa" unit="mg/dL" value={v.glucose} onChange={x=>u("glucose",x)} placeholder="100"/>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🦴</span> Calcio iónico</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 El calcio iónico es la fracción biológicamente activa y el parámetro de elección en UCI. Las fórmulas de corrección por albúmina son poco confiables en el paciente crítico. Ingrese el valor en la unidad de su laboratorio — la conversión es automática.</p></div>
            <OS label="Unidad de reporte" value={v.caIonUnit} onChange={x=>u("caIonUnit",x)} options={[{l:"mmol/L",v:"mmol"},{l:"mg/dL",v:"mgdl"}]}/>
            <NI label={`Calcio iónico`} unit={v.caIonUnit==="mmol"?"mmol/L":"mg/dL"} value={v.caIonized} onChange={x=>u("caIonized",x)} placeholder={v.caIonUnit==="mmol"?"1.15":"4.6"} style={{flex:"1 1 100%"}}/>
          </div>

          <div style={S.sec}><div style={S.secT}><span>⚗️</span> Estado ácido-base</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="pH" value={v.ph} onChange={x=>u("ph",x)} placeholder="7.40"/>
              <NI label="HCO3⁻" unit="mEq/L" value={v.hco3} onChange={x=>u("hco3",x)} placeholder="24"/>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>⏳</span> Cronicidad de la disnatremia</div>
            <OS label="Duración estimada del trastorno del sodio" value={v.naChronicity} onChange={x=>u("naChronicity",x)} options={[{l:"Aguda (<48 horas, documentada)",v:"acute"},{l:"Crónica o desconocida (>48h)",v:"chronic"}]}/>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 La cronicidad determina la velocidad máxima segura de corrección. En trastornos crónicos las neuronas han adaptado su osmolalidad intracelular, y una corrección rápida provoca daño osmótico. Ante la duda, tratar siempre como crónico.</p></div>
          </div>

          <CalcBtn fn={calcElectro}/>
          <Results res={res} rRef={rRef}/>
        </div>)}

        {/* ══════ TAB: ULTRASONIDO ══════ */}
        {tab==="us"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Cuantificación ecográfica: vena cava inferior, gasto cardíaco, lung ultrasound score, protocolo BLUE y evaluación de congestión venosa VExUS.</p></div>
          <Demo/>

          <div style={S.sec}><div style={S.secT}><span>🫧</span> Vena cava inferior</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Medir en eje longitudinal subxifoideo, a 2 cm distal de la unión con la aurícula derecha o justo distal a la desembocadura de las venas suprahepáticas. Usar modo M perpendicular al eje de la vena.</p></div>
            <OS label="Patrón respiratorio" value={v.breathingMode} onChange={x=>u("breathingMode",x)} options={[{l:"Ventilación mecánica",v:"mechanical"},{l:"Respiración espontánea",v:"spontaneous"}]}/>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Diámetro máximo" unit="mm" value={v.ivcMax} onChange={x=>u("ivcMax",x)} placeholder="18"/>
              <NI label="Diámetro mínimo" unit="mm" value={v.ivcMin} onChange={x=>u("ivcMin",x)} placeholder="12"/>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>❤️</span> Gasto cardíaco (VTI del TSVI)</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Medir el diámetro del TSVI en paraesternal eje largo durante la sístole. Obtener el VTI con Doppler pulsado en apical 5 cámaras, con la muestra en el TSVI justo proximal a la válvula aórtica.</p></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="Diámetro del TSVI" unit="mm" value={v.lvotDiam} onChange={x=>u("lvotDiam",x)} placeholder="20"/>
              <NI label="VTI del TSVI" unit="cm" value={v.vtiLVOT} onChange={x=>u("vtiLVOT",x)} placeholder="18"/>
              <NI label="FC" unit="lpm" value={v.hr} onChange={x=>u("hr",x)} placeholder="80"/>
            </div>
            <div style={{marginTop:6}}><label style={S.label}>Variación respiratoria del VTI (opcional)</label></div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"0 10px"}}>
              <NI label="VTI máximo" unit="cm" value={v.vtiMax} onChange={x=>u("vtiMax",x)} placeholder="20"/>
              <NI label="VTI mínimo" unit="cm" value={v.vtiMin} onChange={x=>u("vtiMin",x)} placeholder="16"/>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🫁</span> Lung Ultrasound Score</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Puntuar cada una de las 12 zonas (6 por hemitórax): 0 = líneas A normales | 1 = tres o más líneas B separadas | 2 = líneas B coalescentes | 3 = consolidación. Puntaje total 0-36.</p></div>
            {LUS_ZONES.map((z,i)=>(<DD key={i} label={z} value={v[`lus${i}`]} onChange={x=>u(`lus${i}`,x)} options={[{v:"",l:"— No evaluada —"},...LUS_SCORES]}/>))}
          </div>

          <div style={S.sec}><div style={S.secT}><span>🔵</span> Protocolo BLUE</div>
            <DD label="Perfil ecográfico identificado" value={v.bluePattern} onChange={x=>u("bluePattern",x)} options={[
              {v:"none",l:"— No evaluado —"},
              {v:"a_sliding",l:"Perfil A con deslizamiento conservado"},
              {v:"a_dvt",l:"Perfil A + TVP en miembros inferiores"},
              {v:"b_profile",l:"Perfil B (líneas B bilaterales difusas)"},
              {v:"ab_profile",l:"Perfil A/B (asimétrico)"},
              {v:"c_profile",l:"Perfil C (consolidación anterior)"},
              {v:"a_prime",l:"Perfil A' (sin deslizamiento pleural)"},
              {v:"plaps",l:"PLAPS (síndrome posterolateral)"},
            ]}/>
          </div>

          <div style={S.sec}><div style={S.secT}><span>🩺</span> VExUS — Congestión venosa</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 Evaluación secuencial: si la VCI mide menos de 2 cm el grado es 0 y no se requiere evaluar las venas. Si mide 2 cm o más, se evalúan los patrones Doppler de vena hepática, porta e intrarrenal.</p></div>
            <DD label="Paso 1 — Diámetro de la VCI" value={v.vexusIVC} onChange={x=>u("vexusIVC",x)} options={[{v:"none",l:"— No evaluado —"},{v:"lt2",l:"VCI < 2 cm → Grado 0 automático"},{v:"gte2",l:"VCI ≥ 2 cm → continuar evaluación"}]}/>
            {v.vexusIVC==="gte2"&&<>
              <DD label="Paso 2 — Vena hepática (Doppler)" value={v.vexusHepatic} onChange={x=>u("vexusHepatic",x)} options={[{v:"normal",l:"Normal: onda S mayor que onda D"},{v:"mild",l:"Leve: onda S menor que onda D"},{v:"severe",l:"Severo: onda S invertida (reversa)"}]}/>
              <DD label="Paso 3 — Vena porta (índice de pulsatilidad)" value={v.vexusPortal} onChange={x=>u("vexusPortal",x)} options={[{v:"normal",l:"Normal: pulsatilidad menor a 30%"},{v:"mild",l:"Leve: pulsatilidad 30-49%"},{v:"severe",l:"Severo: pulsatilidad 50% o mayor"}]}/>
              <DD label="Paso 4 — Vena intrarrenal (Doppler)" value={v.vexusRenal} onChange={x=>u("vexusRenal",x)} options={[{v:"normal",l:"Normal: flujo continuo"},{v:"mild",l:"Leve: flujo bifásico (sistólico y diastólico)"},{v:"severe",l:"Severo: flujo monofásico (solo diastólico)"}]}/>
            </>}
          </div>

          <CalcBtn fn={calcUS}/>
          <Results res={res} rRef={rRef}/>
        </div>)}

        {/* ══════ TAB: VExUS REFERENCE ══════ */}
        {tab==="vexref"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Atlas de referencia de los patrones Doppler para la evaluación VExUS. Compare estos esquemas con la imagen que obtiene en el paciente para asignar el grado de congestión venosa.</p></div>

          <div style={S.sec}><div style={S.secT}><span>📐</span> Algoritmo de graduación</div>
            <div style={{padding:"10px 12px",borderRadius:8,background:"rgba(0,10,20,0.35)",marginBottom:8}}>
              <p style={{fontSize:11.5,color:"#b0ccd8",margin:0,lineHeight:1.6}}>
                <strong style={{color:"#a0d8ec"}}>PASO 1 — Vena cava inferior</strong><br/>
                • Diámetro &lt;2 cm → <strong style={{color:"#22c55e"}}>Grado 0</strong>, no se requiere evaluar las venas<br/>
                • Diámetro ≥2 cm → continuar al paso 2<br/><br/>
                <strong style={{color:"#a0d8ec"}}>PASO 2 — Evaluar los tres lechos venosos</strong><br/>
                Vena hepática, vena porta y vena intrarrenal<br/><br/>
                <strong style={{color:"#a0d8ec"}}>PASO 3 — Contar los patrones SEVEROS</strong><br/>
                • Ningún patrón severo → <strong style={{color:"#84cc16"}}>Grado 1</strong> (congestión leve)<br/>
                • Un patrón severo → <strong style={{color:"#f59e0b"}}>Grado 2</strong> (congestión moderada)<br/>
                • Dos o más patrones severos → <strong style={{color:"#ef4444"}}>Grado 3</strong> (congestión severa)
              </p>
            </div>
          </div>

          {/* HEPATIC VEIN */}
          <div style={S.sec}><div style={S.secT}><span>🫀</span> Vena hepática</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 <strong>Técnica:</strong> ventana subcostal o intercostal derecha. Doppler pulsado en la vena hepática media o derecha, a 1-2 cm de su unión con la VCI. Ángulo de insonación &lt;60°. Registrar con trazado de ECG simultáneo si es posible.</p></div>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#22c55e"}}>▸ NORMAL — Onda S mayor que onda D</span></div>
            <VexusWave vein="hepatic" severity="normal"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>La onda S (sistólica) es más profunda que la D (diastólica). Refleja el llenado auricular durante la sístole ventricular con presión auricular derecha normal.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#f59e0b"}}>▸ LEVE — Onda S menor que onda D</span></div>
            <VexusWave vein="hepatic" severity="mild"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>La presión auricular derecha elevada reduce el gradiente durante la sístole, disminuyendo la amplitud de la onda S respecto a la D.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#ef4444"}}>▸ SEVERO — Onda S invertida (reversa)</span></div>
            <VexusWave vein="hepatic" severity="severe"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:0,lineHeight:1.45,paddingLeft:4}}>La onda S cruza la línea basal e invierte su dirección. Indica presión auricular derecha muy elevada o insuficiencia tricuspídea significativa. <strong style={{color:"#ef4444"}}>Cuenta como patrón severo.</strong></p>
          </div>

          {/* PORTAL VEIN */}
          <div style={S.sec}><div style={S.secT}><span>🩸</span> Vena porta</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 <strong>Técnica:</strong> ventana intercostal derecha o subcostal. Doppler pulsado en la vena porta principal o rama derecha. <strong>Índice de pulsatilidad = (Vmáx − Vmín) ÷ Vmáx × 100</strong>. Normalmente el flujo portal es casi continuo por la amortiguación del lecho hepático.</p></div>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#22c55e"}}>▸ NORMAL — Pulsatilidad menor a 30%</span></div>
            <VexusWave vein="portal" severity="normal"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>Flujo prácticamente continuo, monodireccional hacia el hígado (hepatópeto). El sinusoide hepático amortigua las variaciones de presión.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#f59e0b"}}>▸ LEVE — Pulsatilidad 30 a 49%</span></div>
            <VexusWave vein="portal" severity="mild"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>La congestión hepática transmite las pulsaciones cardíacas al sistema portal. Aparece ondulación visible del trazado.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#ef4444"}}>▸ SEVERO — Pulsatilidad 50% o mayor</span></div>
            <VexusWave vein="portal" severity="severe"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:0,lineHeight:1.45,paddingLeft:4}}>Pulsatilidad marcada; en casos extremos el flujo puede llegar a invertirse en parte del ciclo. <strong style={{color:"#ef4444"}}>Cuenta como patrón severo.</strong> ⚠ Falsos positivos: cirrosis, pacientes delgados sin congestión.</p>
          </div>

          {/* RENAL VEIN */}
          <div style={S.sec}><div style={S.secT}><span>🫘</span> Vena intrarrenal</div>
            <div style={S.note}><p style={{fontSize:10.5,color:"#7aaccc",margin:0,lineHeight:1.5}}>📌 <strong>Técnica:</strong> ventana lateral derecha o posterior. Localizar el riñón, aplicar Doppler color para identificar vasos interlobares, y colocar la muestra de Doppler pulsado abarcando arteria y vena simultáneamente. La vena se registra por debajo de la línea basal y la arteria por encima.</p></div>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#22c55e"}}>▸ NORMAL — Flujo continuo</span></div>
            <VexusWave vein="renal" severity="normal"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>Trazado venoso plano y continuo durante todo el ciclo cardíaco.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#f59e0b"}}>▸ LEVE — Flujo bifásico (sistólico y diastólico)</span></div>
            <VexusWave vein="renal" severity="mild"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:"0 0 10px",lineHeight:1.45,paddingLeft:4}}>Aparecen dos componentes discretos, sistólico y diastólico, por transmisión de las pulsaciones a la microcirculación renal congestionada.</p>
            <div style={{marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:"#ef4444"}}>▸ SEVERO — Flujo monofásico (solo diastólico)</span></div>
            <VexusWave vein="renal" severity="severe"/>
            <p style={{fontSize:10.5,color:"#8ab0c0",margin:0,lineHeight:1.45,paddingLeft:4}}>Desaparece el componente sistólico y solo persiste el diastólico. Es el patrón que mejor correlaciona con lesión renal aguda por congestión. <strong style={{color:"#ef4444"}}>Cuenta como patrón severo.</strong></p>
          </div>

          <div style={S.sec}><div style={S.secT}><span>⚠️</span> Limitaciones y falsos positivos</div>
            <div style={{fontSize:11,color:"#a0bcc8",lineHeight:1.6}}>
              <p style={{margin:"0 0 8px"}}><strong style={{color:"#f59e0b"}}>Vena porta:</strong> la cirrosis altera la pulsatilidad de forma independiente de la congestión. Pacientes muy delgados pueden mostrar pulsatilidad aumentada sin patología. La arritmia dificulta la medición.</p>
              <p style={{margin:"0 0 8px"}}><strong style={{color:"#f59e0b"}}>Vena hepática:</strong> la insuficiencia tricuspídea severa produce onda S reversa aun sin sobrecarga de volumen. La fibrilación auricular altera el patrón por pérdida de la contracción auricular.</p>
              <p style={{margin:"0 0 8px"}}><strong style={{color:"#f59e0b"}}>Vena renal:</strong> la enfermedad renal crónica avanzada y la obstrucción urinaria pueden alterar el patrón. La ventana acústica puede ser difícil en obesidad o distensión abdominal.</p>
              <p style={{margin:"0 0 8px"}}><strong style={{color:"#f59e0b"}}>Vena cava inferior:</strong> la ventilación con PEEP elevada, la hipertensión intraabdominal y la hipertensión pulmonar dilatan la VCI sin que necesariamente exista sobrecarga de volumen.</p>
              <p style={{margin:0}}><strong style={{color:"#7aacbc"}}>Recomendación:</strong> el VExUS debe interpretarse siempre en el contexto clínico global y en conjunto con la evaluación de la función ventricular, el balance hídrico acumulado y los marcadores de perfusión. Es una herramienta de tendencia: su mayor utilidad está en el seguimiento seriado durante la depleción.</p>
            </div>
          </div>

          <div style={S.sec}><div style={S.secT}><span>📚</span> Referencia</div>
            <p style={{fontSize:11,color:"#90b0c0",margin:"0 0 3px",lineHeight:1.45}}>Beaubien-Souligny W, et al. Quantifying systemic congestion with point-of-care ultrasound: development of the Venous Excess Ultrasound grading system. The Ultrasound Journal. 2020;12:16.</p>
            <a href="https://pubmed.ncbi.nlm.nih.gov/32270297/" target="_blank" rel="noopener noreferrer" style={{fontSize:9.5,color:"#4a90b5",textDecoration:"none",fontFamily:"'JetBrains Mono',monospace",wordBreak:"break-all"}}>https://pubmed.ncbi.nlm.nih.gov/32270297/</a>
          </div>
        </div>)}

        {/* ══════ TAB: ATLAS ══════ */}
        {tab==="atlas"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Atlas visual de patrones morfológicos de la onda de fotopletismografía con su correlación hemodinámica. Toque cualquier patrón para expandirlo.</p></div>
          {Object.entries(ATLAS).map(([k,d])=>{const exp=expA===k;return(<div key={k} style={{marginBottom:10}}>
            <button onClick={()=>setExpA(exp?null:k)} style={{width:"100%",textAlign:"left",...S.sec,borderLeft:`3px solid ${d.c}`,cursor:"pointer",marginBottom:0,background:exp?"rgba(15,35,55,0.7)":S.sec.background}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>{d.e}</span><span style={{fontSize:12.5,fontWeight:700,color:"#d0e4ec"}}>{d.p}</span></div><span style={{color:"#4a7a8a",fontSize:14,transform:exp?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s",display:"inline-block"}}>▾</span></div>
              <p style={{fontSize:11,color:"#708898",margin:"4px 0 0 24px"}}>{d.h.est}</p>
            </button>
            {exp&&<div style={{padding:"12px 14px",background:"rgba(8,20,36,0.6)",borderRadius:"0 0 14px 14px",border:"1px solid rgba(60,140,170,0.08)",borderTop:"none"}}>
              <WF type={k}/>
              <div style={{marginTop:10}}>{Object.entries(d.h).map(([hk,hv])=><div key={hk} style={{marginBottom:6}}><span style={{fontSize:9.5,fontWeight:700,color:"#5a90a4",textTransform:"uppercase",letterSpacing:"0.04em"}}>{hLab[hk]}: </span><span style={{fontSize:11.5,color:"#a0bcc8"}}>{hv}</span></div>)}</div>
              <div style={{marginTop:8,paddingTop:6,borderTop:"1px solid rgba(60,140,170,0.06)"}}><div style={{fontSize:11,fontWeight:700,color:"#7aacbc",marginBottom:4}}>⚕️ Acciones</div>{d.a.map((a,i)=><div key={i} style={{display:"flex",gap:6,marginBottom:3}}><span style={{color:d.c,fontSize:6,marginTop:5,flexShrink:0}}>●</span><span style={{fontSize:11,color:"#90aab8"}}>{a}</span></div>)}</div>
              <div style={{marginTop:6,paddingTop:4,borderTop:"1px solid rgba(60,140,170,0.06)"}}>{d.r.map((r,i)=><p key={i} style={{fontSize:9,color:"#506878",margin:"0 0 2px",fontFamily:"'JetBrains Mono',monospace"}}>[{i+1}] {r}</p>)}</div>
            </div>}
          </div>);})}
        </div>)}

        {/* ══════ TAB: REFERENCIAS ══════ */}
        {tab==="refs"&&(<div>
          <div style={{...S.sec,background:"rgba(22,78,99,0.08)"}}><p style={{fontSize:11.5,color:"#7aa8b8",margin:0,lineHeight:1.5}}>Fuentes bibliográficas utilizadas en los algoritmos de esta herramienta, con enlaces directos a las publicaciones originales.</p></div>
          {REFS_DATA.map((cat,ci)=><div key={ci} style={S.sec}>
            <div style={S.secT}><span>📄</span> {cat.cat}</div>
            {cat.refs.map((r,ri)=><div key={ri} style={{marginBottom:10,paddingBottom:8,borderBottom:ri<cat.refs.length-1?"1px solid rgba(60,140,170,0.05)":"none"}}>
              <p style={{fontSize:11,color:"#90b0c0",margin:"0 0 3px",lineHeight:1.45}}>{r.t}</p>
              <a href={r.u} target="_blank" rel="noopener noreferrer" style={{fontSize:9.5,color:"#4a90b5",textDecoration:"none",fontFamily:"'JetBrains Mono',monospace",wordBreak:"break-all"}}>{r.u}</a>
            </div>)}
          </div>)}
        </div>)}

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(CritCareBedside));
  </script>
</body>
</html>
